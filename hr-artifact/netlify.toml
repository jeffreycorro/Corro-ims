# CorConDev HR artifact — deploy as a SEPARATE Netlify site.
# Base directory: hr-artifact
# Do not point the public company portal at this folder.

# Build copies a Builds-only GOOGLE_SERVICE_ACCOUNT_JSON into the
# functions bundle so that ~3KB value is never injected into Lambda env
# (AWS 4KB limit). Prefer Netlify Blobs — see docs/netlify-functions-env.md.
[build]
  command = "node scripts/prepare-google-sa.js"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"
  # Tiny Functions-safe flag. Makes auth/drive try Netlify Blobs for the
  # service account even when NETLIFY=true is missing at Lambda runtime.
  GOOGLE_SERVICE_ACCOUNT_BLOB = "1"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions.sample]
  timeout = 26

[functions.drive]
  timeout = 26

[functions.transcribe]
  timeout = 26

# Skip PR / branch preview deploys from this config when Netlify honors ignore.
# Also turn Deploy Previews off in the Netlify UI (required):
# Project configuration → Build & deploy → Continuous Deployment →
# Branches and deploy contexts → Disable Deploy Previews.
# Optional: Site configuration → Access & security → Visitor access can still
# add Netlify password protection, but staff login is Supabase Auth only.
# This site must not be a casual public crawl target.

[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-store"
