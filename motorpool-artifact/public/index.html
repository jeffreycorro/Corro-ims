/* The questions asked most — what is due, what to register — are answered from
   this block in the prompt itself, so they never depend on a lookup surviving
   the cap on how many tools one question may offer. Small by design. */
function askSnapshot(){
  var out=[], now=new Date();
  try{
    var reg=askTools().filter(function(t){ return t.name==="registration_due"; })[0].execute({});
    var due=reg.due_this_month||[], od=reg.overdue_from_earlier_months||[];
    out.push("LTO registration renewals due in "+reg.month+": "+due.length+
      (due.length?" ("+reg.still_to_renew+" not yet renewed) — "+due.map(function(u){
        return u.code+" "+(u.description||"")+", plate "+(u.plate||"none")+(u.renewed_this_year==="no"?"":" [renewed "+u.renewed_this_year.replace(/^yes, /,"")+"]"); }).join("; "):"")+".");
    out.push("Registration overdue from earlier months, not renewed this year: "+od.length+
      (od.length?" — "+od.map(function(u){ return u.code+" "+(u.description||"")+" ("+u.renewal_month+")"; }).join("; "):"")+".");
    if(reg.units_with_no_renewal_month_on_file)
      out.push(reg.units_with_no_renewal_month_on_file+" active units have no renewal month on file, so they cannot be listed as due.");
    if((reg.papers_expiring_this_month||[]).length)
      out.push("Papers expiring this month: "+reg.papers_expiring_this_month.map(function(d){
        return d.code+" "+d.document+" "+d.expires; }).join("; ")+".");
  }catch(e){ out.push("Registration list could not be worked out: "+(e&&e.message||"")); }
  try{
    var kinds={};
    reminders().forEach(function(r){ kinds[r.kind]=(kinds[r.kind]||0)+1; });
    var ks=Object.keys(kinds).sort(function(a,b){ return kinds[b]-kinds[a]; });
    out.push("Reminders tab right now, by kind: "+(ks.length?ks.map(function(k){ return k+" "+kinds[k]; }).join(", "):"nothing")+
      ". Call whats_due for the units behind any of these.");
  }catch(e){}
  try{
    var f=fifo();
    out.push("Fuel reserve on hand: "+nnum(f.onHand,0)+" L.");
  }catch(e){}
  out.push("Open work: "+openBreakdowns().length+" units off the road, "+openJOs().length+
    " job orders, "+openTasks().length+" tasks.");
  return "FLEET SNAPSHOT, worked out by the portal at "+iso()+". When this answers the question, answer "+
    "straight from it and name the units. Never say you have no tool or cannot list something this snapshot covers.\n- "+
    out.join("\n- ");
}

/* Speech both ways. Output is plain Web Speech and works almost anywhere;
   input needs microphone permission, which an embedded page is often refused —
   so it degrades to typing and says so rather than failing silently. */
var TTS = (typeof speechSynthesis!=="undefined") ? speechSynthesis : null;
var SR  = window.SpeechRecognition || window.webkitSpeechRecognition || null;
var _rec=null;
/* Browsers refuse to speak unless a user gesture has unlocked audio, and the
   answer arrives long after the click — so every click that could lead to an
   answer plays a silent utterance first, which is what does the unlocking. */
function primeTTS(){
  if(!TTS||S.ttsReady) return;
  try{
    var u=new SpeechSynthesisUtterance(" ");
    u.volume=0; u.lang=S.voiceLang;
    TTS.speak(u); S.ttsReady=true;
  }catch(e){}
}
/* The device's own voices vary enormously — a Mac or iPhone carries neural
   voices that sound nothing like the old robot, but they are not the default.
   So rank what is installed and pick the best one rather than whatever the
   browser hands over first. */
var GOOD=[/premium/i,/enhanced/i,/neural/i,/natural/i,/siri/i,
  /\b(ava|samantha|serena|allison|nicky|aaron|zoe|evan|nathan|joelle)\b/i,
  /\b(daniel|karen|moira|tessa|rishi|fiona|veena)\b/i,
  /google (uk|us) english/i,/microsoft .*online/i];
function voiceScore(v){
  var s=0, n=(v.name||"")+" "+(v.voiceURI||"");
  GOOD.forEach(function(re,i){ if(re.test(n)) s+=(GOOD.length-i)*10; });
  if(/compact|eloquence|espeak/i.test(n)) s-=40;
  if(v.localService) s+=3;
  var want=(S.voiceLang||"en").slice(0,2).toLowerCase();
  var vl=(v.lang||"").slice(0,2).toLowerCase();
  if(v.lang===S.voiceLang) s+=25; else if(vl===want) s+=12;
  else if(vl==="en") s+=4;
  return s;
}
function loadVoices(){
  if(!TTS) return;
  var list=[];
  try{ list=TTS.getVoices()||[]; }catch(e){ list=[]; }
  if(!list.length) return;
  S.voices=list.slice().sort(function(a,b){ return voiceScore(b)-voiceScore(a); });
  if(!S.voiceName){
    try{ S.voiceName=localStorage.getItem("mp_voicename")||""; }catch(e){}
  }
  if(!S.voiceName||!S.voices.some(function(v){ return v.name===S.voiceName; }))
    S.voiceName=S.voices[0]?S.voices[0].name:"";
  if(S.ready) render();
}
function pickedVoice(){
  for(var i=0;i<S.voices.length;i++) if(S.voices[i].name===S.voiceName) return S.voices[i];
  return S.voices[0]||null;
}
/* Chrome cuts long utterances off partway, so feed it a sentence at a time. */
function utter(text,onDone){
  if(!TTS||!text) return;
  var clean=String(text).replace(/[*_#`>]/g,"").replace(/\s+/g," ").trim();
  var parts=clean.match(/[^.!?;\n]+[.!?;]?/g)||[clean];
  var chunks=[], cur="";
  parts.forEach(function(p){
    if((cur+p).length>180){ if(cur) chunks.push(cur.trim()); cur=p; }
    else cur+=p;
  });
  if(cur.trim()) chunks.push(cur.trim());
  var v=pickedVoice(), i=0;
  (function next(){
    if(i>=chunks.length){ if(onDone) onDone(); return; }
    var u=new SpeechSynthesisUtterance(chunks[i++]);
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang=S.voiceLang;
    u.rate=0.98; u.pitch=1;
    u.onend=next; u.onerror=next;
    try{ TTS.speak(u); }catch(e){ if(onDone) onDone(); }
  })();
}
function speak(text){
  if(!TTS||!S.voiceOut||!text) return;
  try{ TTS.cancel(); utter(text); }catch(e){}
}
function hush(){ try{ if(TTS) TTS.cancel(); }catch(e){} }
function listen(inp,onFinal,setBusy){
  if(!SR){ toast("This browser cannot listen. Type the question instead."); return; }
  if(_rec){ try{ _rec.stop(); }catch(e){} _rec=null; setBusy(false); return; }
  hush();
  var rec=new SR();
  rec.lang=S.voiceLang; rec.interimResults=true; rec.maxAlternatives=1; rec.continuous=false;
  var finalText="";
  rec.onresult=function(e){
    var interim="";
    for(var i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) finalText+=e.results[i][0].transcript;
      else interim+=e.results[i][0].transcript;
    }
    inp.value=(finalText+" "+interim).trim();
  };
  rec.onerror=function(e){
    _rec=null; setBusy(false);
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      S.micBlocked=true;
      toast("The microphone is blocked on this page — use your keyboard's dictation key instead.");
      render();
    }
    else if(e.error==="no-speech") toast("Did not catch anything — try again.");
    else if(e.error!=="aborted") toast("Could not hear that — try again.");
  };
  rec.onend=function(){ _rec=null; setBusy(false); if(finalText.trim()) onFinal(finalText.trim()); };
  try{ rec.start(); _rec=rec; setBusy(true); }
  catch(e){ _rec=null; setBusy(false); toast("Could not start the microphone."); }
}

      var lim=(S.sample.limits)?await S.sample.limits():null;
      var cap=lim&&lim.tools&&lim.tools.maxCount;
      S.askLimit={offered:offer.length, allowed:(lim&&lim.tools)?cap:0, known:!!lim};
      if(lim&&!lim.tools){
        slot.error=true;
        slot.content="This view cannot run the assistant's lookups, so it cannot read the records. Open the portal in the Claude app or on claude.ai and ask again.";
        S.asking=false; render(); return;
      }
      if(cap&&offer.length>cap) offer=offer.slice(0,cap);
    }catch(e){ S.askLimit={offered:offer.length, allowed:null, known:false}; }
    try{
      var res=await S.sample(turns,{
        tools:offer,
        modelTier:"default",
        onText:function(ev){ slot.content=ev.text; render(); }
      });
      slot.content=res.text||slot.content||"No answer came back.";
      speak(slot.content);
    }catch(e){
      slot.error=true;
      slot.content = e && e.code==="not_granted"
        ? "The assistant is not switched on for this view."
        : e && e.code==="rate_limited"
        ? "Too many questions at once — give it a moment and ask again."
        : "The assistant could not answer that. "+((e&&e.message)||"");
    }
    S.asking=false; render();
  }
}

/* A live gate panel: it says what is wrong, and takes the override on the spot
   rather than sending someone to a settings screen. */
function fuelGatePanel(state,onChange){
  var box=el("div");
  function draw(){
    box.innerHTML="";
    var chk=state.check;
    if(!chk||!chk.gates.length){
      if(chk&&chk.move>0&&chk.expected){
        var ok=el("div","banner info");
        ok.innerHTML="<b>Within range.</b> "+nnum(chk.move,chk.meter==="km"?0:1)+" "+
          (chk.meter==="km"?"km":"hours")+" since "+esc(chk.lastDate)+", about "+
          esc(nnum(chk.expected,2))+" L expected at its usual "+chk.avg.toFixed(2)+" "+meterUnit(chk.meter)+".";
        box.appendChild(ok);
      }
      return;
    }
    chk.gates.forEach(function(gt){
      var bn=el("div","banner "+(gt.level==="stop"?"crit":"warn"));
      var d=el("div");
      d.innerHTML="<b>"+esc(gt.msg)+"</b><br>"+esc(gt.detail);
      bn.appendChild(d);
      box.appendChild(bn);
    });
    if(chk.stops&&chk.stops.length){
      var ov=el("div","card"); ov.style.marginTop="var(--space-3)";
      var oh=el("div","hd"); oh.appendChild(el("h3",null,"Override"));
      oh.appendChild(el("span","note","Kept with the VRF and reviewable in the Office screens."));
      ov.appendChild(oh);
      var ob=el("div","bd");
      var r1=el("div","f3");
      function f3(l,n){ var x=el("div","field"); x.appendChild(el("label",null,l)); x.appendChild(n); return x; }
      var rs=el("select"); rs.appendChild(new Option("— pick a reason —",""));
      OVERRIDE_REASONS.forEach(function(x){ rs.appendChild(new Option(x,x)); });
      rs.value=state.override?state.override.reason:"";
      var nt=el("input"); nt.placeholder="what actually happened";
      nt.value=state.override?state.override.note:"";
      var wh=el("input"); wh.placeholder="your name";
      wh.value=state.override?state.override.by:"";
      r1.appendChild(f3("Reason",rs)); r1.appendChild(f3("Note",nt)); r1.appendChild(f3("Approved by",wh));
      ob.appendChild(r1);
      var act=el("div","row"); act.style.marginTop="var(--space-3)";
      var ap=el("button","btn pri",state.override?"Override saved":"Apply override");
      ap.addEventListener("click",function(){
        if(!rs.value){ toast("Pick a reason for the override."); return; }
        if(!wh.value.trim()){ toast("The override has to carry a name."); return; }
        state.override={codes:chk.stops.map(function(g){return g.code;}),
          reason:rs.value,note:nt.value.trim(),by:wh.value.trim(),at:iso()};
        toast("Override recorded — the request can be posted.");
        if(onChange) onChange();
        draw();
      });
      act.appendChild(ap);
      if(state.override){
        act.appendChild(el("span","chip ok","cleared by "+state.override.by+" on "+state.override.at));
        var cl=el("button","btn sm","Remove override");
        cl.addEventListener("click",function(){ state.override=null; if(onChange) onChange(); draw(); });
        act.appendChild(cl);
      }
      ob.appendChild(act);
      ov.appendChild(ob);
      box.appendChild(ov);
    }
  }
  draw();
  box.redraw=draw;
  return box;
}

/* ---- reserves ---- */
function budgetBar(rv){
  var box=el("div");
  var pct = rv.approved>0 ? Math.min(1.6, rv.actual/rv.approved) : 0;
  var tol = varianceTol();
  var row=el("div"); row.style.cssText="display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted)";
  row.appendChild(el("span",null,"Spent "+peso(rv.actual)));
  row.appendChild(el("span",null,"Approved "+peso(rv.approved)));
  box.appendChild(row);
  var tr=el("div","bar-track"); tr.style.height="10px"; tr.style.marginTop="4px";
  var fi=el("div","bar-fill");
  fi.style.width=Math.max(2,Math.min(100,(pct/1.6)*100))+"%";
  fi.style.background = rv.over?"var(--danger)":(rv.actual>rv.approved?"var(--warn)":"var(--ok)");
  tr.appendChild(fi); box.appendChild(tr);
  var mk=el("div","hint");
  mk.textContent = rv.approved>0
    ? (rv.diff>=0?"Over by ":"Under by ")+peso(Math.abs(rv.diff))+
      "  ("+(rv.pct*100).toFixed(1)+"%)  ·  tolerance "+Math.round(tol*100)+"%"
    : "No approved budget on this reserve.";
  mk.style.marginTop="3px";
  box.appendChild(mk);
  return box;
}

  g.appendChild(card("Approved — work may start",app.length+" open",rtable(app,"Nothing approved and open.")));
  var done=mine.filter(function(r){ return r.status==="Closed"||r.status==="Rejected"; });

  if((r.draftLines||[]).length){

    dth.appendChild(dhr); dt2.appendChild(dth);
    var dtb=el("tbody"), dsum=0;

  var bb=el("div","card"); var bh=el("div","hd"); bh.appendChild(el("h3",null,"Budget"));
  bb.appendChild(bh);

  /* trail */

  if(r.varianceAt) steps.push(["Variance decision",r.varianceAt+" by "+(r.varianceBy||"—")+
    (r.varianceNote?" — "+r.varianceNote:"")]);
  steps.forEach(function(sx){

      {h:"Proof",num:true,get:function(x){

      {h:"Status",get:vrfChip},
      {h:"",get:function(x){
        var bt=el("button","btn sm",x.status==="Open"?"Liquidate":"Open");
        bt.addEventListener("click",function(){ m.remove(); openVrf(x,x.status==="Open"?"liq":"lines"); });
        return bt; }}
    ],la.vrfs,{empty:"No VRF attached yet."})));

  var actions=el("div"); actions.style.marginTop="var(--space-5)";

  if(r.status==="Approved"){
    var att=el("div","card");
    var ah=el("div","hd"); ah.appendChild(el("h3",null,"Attach a VRF and liquidate"));
    att.appendChild(ah);
    var ab=el("div","bd");
    var cand=vrfIndex().filter(function(x){
      return x.units.indexOf(r.veh)>=0 && (r.vrfs||[]).indexOf(x.vrf)<0; }).slice(0,60);
    var sel=el("select"); sel.appendChild(new Option("— pick a VRF for "+r.veh+" —",""));
    cand.forEach(function(x){
      sel.appendChild(new Option("VRF "+x.vrf+"  ·  "+x.date+"  ·  "+peso(x.total),x.vrf)); });
    var row1=el("div","row");
    var selW=el("div","field"); selW.style.flex="1";
    selW.appendChild(el("label",null,"Attach a VRF")); selW.appendChild(sel);
    row1.appendChild(selW);
    var atb=el("button","btn","Attach");
    atb.addEventListener("click",async function(){
      if(!sel.value) return;
      r.vrfs=(r.vrfs||[]).concat([sel.value]);
      await saveReserves(); toast("VRF "+sel.value+" attached to RSV-"+r.no+".");
      render(); openReserve(r.no,asApprover);
    });
    row1.appendChild(atb);
    ab.appendChild(row1);
    var openOnes=la.vrfs.filter(function(x){ return x.status==="Open"; });
    var prog=el("div","banner "+(la.vrfs.length&&!openOnes.length?"info":"warn"));
    prog.style.marginTop="var(--space-3)";
    prog.innerHTML = !la.vrfs.length
      ? "<b>No VRF against this reserve yet.</b> Every movement is a VRF — the fuel drawn, the parts bought, the work done — and each one is liquidated on its own."
      : (openOnes.length
        ? "<b>"+(la.vrfs.length-openOnes.length)+" of "+la.vrfs.length+" VRFs liquidated.</b> "+
          esc(openOnes.map(function(x){return "VRF "+x.vrf;}).join(", "))+
          " still open. The reserve settles itself the moment the last one closes."
        : "<b>All "+la.vrfs.length+" VRFs liquidated at "+esc(peso(la.total))+".</b> Close the reserve to settle it.");
    ab.appendChild(prog);
    var liveOne=(r.vrfs||[]).map(vrfByNo).filter(Boolean)
      .filter(function(x){ return x.status==="Open"; })[0];
    /* Approved, but no VRF behind it — an approval made before the VRF was
       minted at approval time, or one whose creation failed. Offer it now
       rather than leaving the reserve stranded. */
    if(!liveOne&&!(r.vrfs||[]).length&&(r.draftLines||[]).length){
      var mb2=el("div","banner warn"); mb2.style.marginTop="var(--space-3)";
      mb2.innerHTML="<b>Approved, but VRF "+esc(r.vrfNo||"—")+" was never created.</b> "+
        "Create it now and the yard can do the work and liquidate it.";
      ab.appendChild(mb2);
      var mkrow=el("div","row"); mkrow.style.marginTop="var(--space-2)";
      var mkb=el("button","btn pri","Create VRF "+(r.vrfNo||"")+" now");
      mkb.addEventListener("click",async function(){
        mkb.disabled=true; mkb.textContent="Creating…";
        try{
          var madeNo=await postReserveVrf(r);
          if(madeNo){ r.vrfs=(r.vrfs||[]).concat([madeNo]); await saveReserves(); }
          toast(madeNo?("VRF "+madeNo+" created."):"Nothing to create — no lines on the request.");
        }catch(err){
          mkb.disabled=false; mkb.textContent="Create VRF "+(r.vrfNo||"")+" now";
          toast("Could not create it: "+(err&&err.message||"unknown error")); return;
        }
        m.remove(); render();
        var mv2=vrfByNo(r.vrfNo); if(mv2) openVrf(mv2,"liq");
      });
      mkrow.appendChild(mkb);
      ab.appendChild(mkrow);
    }
    if(liveOne){
      var dl=el("div","banner info"); dl.style.marginTop="var(--space-3)";
      dl.innerHTML="<b>VRF "+esc(liveOne.vrf)+" is live.</b> The lines are already on it. "+
        "Do the work, then liquidate it with the actual amounts — nothing else needs approving.";
      ab.appendChild(dl);
      var lb3=el("div","row"); lb3.style.marginTop="var(--space-2)";
      var gob=el("button","btn pri","Open VRF "+liveOne.vrf+" to liquidate");
      gob.addEventListener("click",function(){ m.remove(); openVrf(liveOne,"liq"); });
      lb3.appendChild(gob);
      ab.appendChild(lb3);
    }
    var lq=el("div","row"); lq.style.marginTop="var(--space-3)";
    var lqb=el("button","btn pri","Close this reserve");
    lqb.disabled=!la.vrfs.length||openOnes.length>0;
    lqb.addEventListener("click",async function(){
      var actual=la.total;
      var rr=reserveVariance(Object.assign({},r,{actual:actual}));
      r.actual=actual; r.liquidatedAt=iso();
      r.status = rr.over ? "Flagged" : "Closed";
      await saveReserves();
      toast(rr.over
        ? "RSV-"+r.no+" is "+(rr.pct*100).toFixed(1)+"% over — flagged for a decision."
        : "RSV-"+r.no+" closed at "+peso(actual)+".");
      render(); openReserve(r.no,asApprover);
    });
    lq.appendChild(lqb);
    if(openOnes.length){
      var goliq=el("button","btn","Liquidate VRF "+openOnes[0].vrf);
      goliq.addEventListener("click",function(){ m.remove(); openVrf(openOnes[0],"liq"); });
      lq.appendChild(goliq);
    }
    lq.appendChild(el("span","hint",
      "Anything more than "+Math.round(varianceTol()*100)+"% over the approved budget is flagged for a justification."));
    ab.appendChild(lq);
    att.appendChild(ab); actions.appendChild(att);
  }

  if(r.status==="Flagged"){
    var jc=el("div","card");
    var jh=el("div","hd"); jh.appendChild(el("h3",null,"Over-budget notice"));
    jh.appendChild(el("span","note","The work is done and the VRF is closed. This is a notice, not a hold."));
    jc.appendChild(jh);
    var jb=el("div","bd");
    var jt=el("textarea"); jt.rows=3; jt.value=r.justification||"";
    jt.placeholder="What changed on the job — extra parts found, price moved, scope grew.";
    var jf=el("div","field"); jf.appendChild(el("label",null,"Explanation")); jf.appendChild(jt);
    jb.appendChild(jf);
    var jw=el("input"); jw.placeholder="your name"; jw.value=r.justifiedBy||"";
    var jwf=el("div","field"); jwf.style.cssText="max-width:280px;margin-top:var(--space-3)";
    jwf.appendChild(el("label",null,"Written by")); jwf.appendChild(jw);
    jb.appendChild(jwf);
    var nrv=reserveVariance(r);
    var nb2=el("div","banner warn");
    nb2.innerHTML="<b>Came in "+esc(peso(nrv.diff))+" over — "+esc((nrv.pct*100).toFixed(1))+
      "% above the "+esc(peso(nrv.approved))+" approved.</b> The yard can explain it below; "+
      "the office closes the notice once it has been seen.";
    jb.insertBefore(nb2,jb.firstChild);
    var jact=el("div","row"); jact.style.marginTop="var(--space-3)";
    var jsv=el("button","btn","Save explanation");
    jsv.addEventListener("click",async function(){
      if(!jt.value.trim()||!jw.value.trim()){ toast("Write the explanation and put your name to it."); return; }
      r.justification=jt.value.trim(); r.justifiedBy=jw.value.trim();
      await saveReserves(); toast("Explanation saved.");
      render(); openReserve(r.no,asApprover);
    });
    jact.appendChild(jsv);
    if(!asApprover) jact.appendChild(el("span","hint","The office approves or refuses the overrun."));
    jb.appendChild(jact);

    if(asApprover){
      var dec=el("div"); dec.style.marginTop="var(--space-4)";
      if(!r.justification){
        var wn=el("div","banner info");
        wn.innerHTML="No explanation from the yard yet. You can still close the notice — send it back first if the figure looks wrong.";
        dec.appendChild(wn);
      }
      var dn=el("input"); dn.placeholder="anything you want on the record";
      var dw=el("input"); dw.placeholder="your name";
      var dr=el("div","f3");
      function f5(l,n){ var x=el("div","field"); x.appendChild(el("label",null,l)); x.appendChild(n); return x; }
      dr.appendChild(f5("Note",dn)); dr.appendChild(f5("Closed by",dw));
      var dbw=el("div"); dbw.style.cssText="display:flex;align-items:flex-end;gap:var(--space-2)";
      var acc=el("button","btn pri","Close the notice");
      var back=el("button","btn","Ask the yard to explain");
      dbw.appendChild(acc); dbw.appendChild(back); dr.appendChild(dbw);
      dec.appendChild(dr);
      var dmsg=el("div","hint"); dmsg.style.marginTop="var(--space-2)";
      dec.appendChild(dmsg);
      function syncVar(){
        var hasName=!!dw.value.trim(), hasNote=!!dn.value.trim();
        acc.disabled=!hasName;
        back.disabled=!hasNote;
        dmsg.textContent = !hasName
          ? "Closing the notice needs your name. Asking the yard to explain needs a note."
          : (back.disabled?"Ready to close. To send it back instead, add a note.":"");
        dmsg.style.color = !hasName ? "var(--danger)" : "";
      }
      [dw,dn].forEach(function(x){ x.addEventListener("input",syncVar); });
      syncVar();
      acc.addEventListener("click",async function(){
        if(!dw.value.trim()){ toast("The decision has to carry a name."); return; }
        r.status="Closed"; r.varianceBy=dw.value.trim(); r.varianceAt=iso();
        r.varianceNote=dn.value.trim()||"Notice seen and closed";
        await saveReserves(); toast("Notice on RSV-"+r.no+" closed.");
        m.remove(); render();
      });
      back.addEventListener("click",async function(){
        if(!dn.value.trim()){ toast("Say what you want explained."); return; }
        r.varianceNote=dn.value.trim(); r.justification=""; 
        await saveReserves(); toast("Sent back to the yard for a fuller explanation.");
        render(); openReserve(r.no,asApprover);
      });
      jb.appendChild(dec);
    }
    jc.appendChild(jb); actions.appendChild(jc);
  }

  if(r.status==="Requested"&&asApprover){
    var ac=el("div","card");
    var ach=el("div","hd"); ach.appendChild(el("h3",null,"Decision"));
    ac.appendChild(ach);
    var acb=el("div","bd");
    var ar=el("div","f3");
    function f6(l,n,h){ var x=el("div","field"); x.appendChild(el("label",null,l)); x.appendChild(n);
      if(h) x.appendChild(el("div","hint",h)); return x; }
    var ab2=el("input"); ab2.type="number"; ab2.step="100"; ab2.value=r.budget;
    var an=el("input"); an.placeholder="note";
    var aw=el("input"); aw.placeholder="approver";
    ar.appendChild(f6("Approved budget",ab2,"Asked for "+peso(r.budget)+". Change it to approve a different figure."));
    ar.appendChild(f6("Note",an)); ar.appendChild(f6("Approved by",aw));
    acb.appendChild(ar);
    var ready=rsvReadyToApprove(r);
    if(!ready.ok){
      var rb=el("div","banner crit"); rb.style.marginTop="var(--space-3)";
      rb.innerHTML="<b>This fuel request cannot be approved yet — "+esc(ready.missing.join(" and "))+
        ".</b> The gauge reading and its photo have to be on the request before any fuel is released. Reject it and ask the yard to raise it again with the picture.";
      acb.appendChild(rb);
    }
    var arow=el("div","row"); arow.style.marginTop="var(--space-3)";
    var okb=el("button","btn pri","Approve");
    var nob=el("button","btn","Reject");
    var amsg=el("div","hint"); amsg.style.marginTop="var(--space-2)";
    /* A required field should announce itself rather than punish the click.
       The buttons stay visibly disabled with the reason beside them. */
    function syncDecision(){
      var hasName=!!aw.value.trim(), hasNote=!!an.value.trim();
      var amt=parseFloat(ab2.value);
      okb.disabled = !ready.ok || !hasName || !(amt>0);
      nob.disabled = !hasName || !hasNote;
      var need=[];
      if(!hasName) need.push("your name in “Approved by”");
      if(!(amt>0)) need.push("an approved budget");
      if(need.length){
        amsg.textContent="To approve, fill in "+need.join(" and ")+
          ". A rejection also needs a reason in “Note”.";
        amsg.style.color="var(--danger)";
      }else if(nob.disabled){
        amsg.textContent="Ready to approve. To reject instead, add a reason in “Note”.";
        amsg.style.color="";
      }else{ amsg.textContent=""; amsg.style.color=""; }
    }
    [aw,an,ab2].forEach(function(x){ x.addEventListener("input",syncDecision); });
    okb.addEventListener("click",async function(){
      if(!aw.value.trim()){ toast("The approval has to carry a name."); return; }
      var amt=parseFloat(ab2.value);
      if(!(amt>0)){ toast("Put an approved budget on it."); return; }
      okb.disabled=true; okb.textContent="Approving…";
      var madeVrf=null;
      try{
        r.status="Approved"; r.approvedBudget=amt; r.approvedBy=aw.value.trim();
        r.approvedAt=iso(); r.decisionNote=an.value.trim();
        madeVrf=await postReserveVrf(r);
        if(madeVrf) r.vrfs=(r.vrfs||[]).concat([madeVrf]);
        await saveReserves();
      }catch(err){
        okb.disabled=false; okb.textContent="Approve";
        toast("Could not approve it: "+(err&&err.message||"unknown error"));
        return;
      }
      toast(madeVrf
        ? "Approved at "+peso(amt)+". VRF "+madeVrf+" is live — do the work, then liquidate it."
        : "RSV-"+r.no+" approved at "+peso(amt)+".");
      m.remove(); render();
      if(madeVrf){ var mv=vrfByNo(madeVrf); if(mv) openVrf(mv,"liq"); }
    });
    nob.addEventListener("click",async function(){
      if(!aw.value.trim()||!an.value.trim()){ toast("A rejection needs a reason and a name."); return; }
      r.status="Rejected"; r.approvedBy=aw.value.trim(); r.approvedAt=iso();
      r.decisionNote=an.value.trim();
      await saveReserves(); toast("RSV-"+r.no+" rejected.");
      m.remove(); render();
    });
    arow.appendChild(okb); arow.appendChild(nob);
    acb.appendChild(arow); acb.appendChild(amsg);
    syncDecision();
    ac.appendChild(acb); actions.appendChild(ac);
  }

  b.appendChild(actions);
  var close=el("div"); close.style.cssText="display:flex;justify-content:flex-end;margin-top:var(--space-5)";
  var cb=el("button","btn","Close"); cb.addEventListener("click",function(){ m.remove(); });
  close.appendChild(cb); b.appendChild(close);
  sheet.appendChild(b); m.appendChild(sheet);
  m.addEventListener("click",function(e){ if(e.target===m) m.remove(); });
  document.body.appendChild(m);
}

/* ---- office: approvals ---- */
function approveView(){
  var w=el("div");
  w.appendChild(pageHead("Office · Approvals","Reserves and overruns",
    "Every request for budget before it is spent, and every job that came in over what was approved."));
  var g=el("div","grid"); g.style.gap="var(--space-5)";
  var pend=openReserves(), flg=flaggedReserves();
  var asked=pend.reduce(function(a,r){ return a+(r.budget||0); },0);
  var over=flg.reduce(function(a,r){ return a+reserveVariance(r).diff; },0);
  g.appendChild(stats([
    ["Waiting on you", String(pend.length), peso(asked)+" requested", false,
      pend.length?"var(--warn)":"var(--ok)"],
    ["Notices to close", String(flg.length), peso(over)+" above approval", false,
      flg.length?"var(--danger)":"var(--ok)"],
    ["Approved and open", String(approvedReserves().length), "work may start"],
    ["Tolerance", Math.round(varianceTol()*100)+"%", "before a liquidation is flagged", true]
  ]));

  var tol=el("div","card");
  var th2=el("div","hd"); th2.appendChild(el("h3",null,"Variance tolerance"));
  th2.appendChild(el("span","note","How far an actual may drift from the approved budget before it is flagged."));
  tol.appendChild(th2);
  var tb2=el("div","bd");
  var trow=el("div","row");
  var ti=el("input"); ti.type="number"; ti.min="0"; ti.max="100"; ti.step="1";
  ti.value=Math.round(varianceTol()*100); ti.style.maxWidth="120px";
  var tsv=el("button","btn pri","Save");
  tsv.addEventListener("click",async function(){
    S.cfg.varianceTol=(parseFloat(ti.value)||0)/100;
    await writeDoc(PATHS.cfg,{nextVrf:S.cfg.nextVrf,pass:S.cfg.pass,fuel:S.cfg.fuel||null,
      varianceTol:S.cfg.varianceTol,nextReserve:S.cfg.nextReserve,driveFolder:S.cfg.driveFolder||""});
    toast("Tolerance set to "+Math.round(S.cfg.varianceTol*100)+"%."); render();
  });
  trow.appendChild(ti); trow.appendChild(el("span","hint","percent")); trow.appendChild(tsv);
  tb2.appendChild(trow);

  var drow=el("div"); drow.style.marginTop="var(--space-4)";

/* A task is a small job order: somebody asked for it, somebody did it, and
   there has to be something to show for it. Closing one takes a name and at
   least one photograph or link, the same bar the workshop is held to. */
function openTask(no){
  var ex=document.getElementById("taskSheet"); if(ex) ex.remove();
  var t=taskBy(no); if(!t) return;
  var done=t.status==="Done";
  var owner=taskOwner(t.no);
  var m=el("div","modal"); m.id="taskSheet";
  var sheet=el("div","sheet");
  var b=el("div"); b.style.padding="var(--space-5) var(--space-6)";
  function f2(l,n,h){ var x=el("div","field"); x.appendChild(el("label",null,l));
    x.appendChild(n); if(h) x.appendChild(el("div","hint",h)); return x; }

  var hd=el("div");
  hd.style.cssText="display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-4)";
  var lft=el("div");
  lft.appendChild(el("h3",null,"Task T-"+t.no));
  var vv=t.vehicle?vehicle(t.vehicle):null;
  lft.appendChild(el("div","hint",
    (t.vehicle?t.vehicle+(vv?" · "+vv.desc:""):"no unit")+"  ·  raised "+(t.created||"—")));
  hd.appendChild(lft);
  var rgt=el("div"); rgt.style.textAlign="right";
  rgt.appendChild(el("span","chip "+(done?"ok":"warn"),done?"Done":"Open"));
  if(done) rgt.appendChild(el("div","hint","closed "+(t.closed||"—")));
  else if(t.due){
    var late=daysSince(t.due);
    rgt.appendChild(el("div","hint",
      (late!=null&&late>0)?("due "+t.due+" · "+late+"d late"):("due "+t.due)));
  }
  hd.appendChild(rgt);
  b.appendChild(hd);

  /* --- the task itself --- */
  var ec=el("div","card"); ec.style.marginTop="var(--space-4)";
  var eh=el("div","hd"); eh.appendChild(el("h3",null,"The task"));
  eh.appendChild(el("span","note",done
    ?"Closed tasks are kept as they were written."
    :"Correct anything here and save."));
  ec.appendChild(eh);
  var eb=el("div","bd");
  var ti=el("input"); ti.value=t.title||"";
  var de=el("textarea"); de.rows=3; de.value=t.detail||"";
  var as=el("input"); as.value=t.assigned||"";
  var tvs=unitPicker(t.vehicle||"",null,{hint:"Leave it blank if the task is not about one unit."});
  var pr=el("select"); ["Normal","High","Urgent"].forEach(function(x){
    pr.appendChild(new Option(x,x)); }); pr.value=t.priority||"Normal";
  var ca=el("select"); ["Registration / LTO","Documents","Purchasing","Workshop","Site","Admin"]
    .forEach(function(x){ ca.appendChild(new Option(x,x)); }); ca.value=t.category||"Admin";
  var du=el("input"); du.type="date"; du.value=t.due||"";
  eb.appendChild(f2("Task",ti));
  var dwrap=f2("Detail",de); dwrap.style.marginTop="var(--space-3)"; eb.appendChild(dwrap);
  var e1=el("div","f3"); e1.style.marginTop="var(--space-3)";
  e1.appendChild(f2("Assigned to",as)); e1.appendChild(f2("Unit",tvs));
  e1.appendChild(f2("Due",du));
  eb.appendChild(e1);
  var e2=el("div","f3"); e2.style.marginTop="var(--space-3)";
  e2.appendChild(f2("Priority",pr)); e2.appendChild(f2("Category",ca));
  e2.appendChild(el("div"));
  eb.appendChild(e2);
  if(done){
    [ti,de,as,du].forEach(function(x){ x.readOnly=true; });
    [pr,ca].forEach(function(x){ x.disabled=true; });
  }else{
    var esave=el("div","row"); esave.style.marginTop="var(--space-4)";
    var esb=el("button","btn pri","Save changes");
    var emsg=el("div","hint");
    esb.addEventListener("click",async function(){
      if(!ti.value.trim()){ emsg.textContent="A task needs a title.";
        emsg.style.color="var(--danger)"; return; }
      esb.disabled=true; esb.textContent="Saving…";
      await saveTask(t.no,{title:ti.value.trim(),detail:de.value.trim(),
        assigned:as.value.trim(),vehicle:tvs.getCode(),priority:pr.value,
        category:ca.value,due:du.value});
      toast("T-"+t.no+" saved."); render(); openTask(t.no);
    });
    esave.appendChild(esb); esave.appendChild(emsg);
    eb.appendChild(esave);
  }
  ec.appendChild(eb); b.appendChild(ec);

  /* --- what there is to show for it --- */
  var pc=el("div","card"); pc.style.marginTop="var(--space-4)";
  var ph=el("div","hd"); ph.appendChild(el("h3",null,"Proof"));
  ph.appendChild(el("span","note",
    "A photograph of the thing done, or a link to a video or document. A task cannot be closed without one."));
  pc.appendChild(ph);
  var pb=el("div","bd");
  var gal=el("div","pgrid"); gal.appendChild(el("div","hint","Loading…"));
  pb.appendChild(gal);
  var links=el("div"); pb.appendChild(links);
  var cby=el("input"); cby.placeholder="who did it";
  var closeBtn=el("button","btn pri","Mark it done");
  var closeWhy=el("div","hint");
  function syncClose(){
    if(done) return;
    var want=[];
    if(!cby.value.trim()) want.push("who did it");
    if(!taskProofCount(t.no)) want.push("a photo or a link as proof");
    closeBtn.disabled=want.length>0;
    closeWhy.textContent=want.length?("Still needed: "+want.join(" and ")+"."):"";
    closeWhy.style.color=want.length?"var(--danger)":"";
  }

  function paintAtt(){
    listPhotos(owner).then(function(items){
      gal.innerHTML=""; links.innerHTML="";
      var pics=items.filter(function(x){ return x.kind!=="link"; });
      var lnk=items.filter(function(x){ return x.kind==="link"; });
      if(!pics.length&&!lnk.length)
        gal.appendChild(el("div","hint","Nothing attached yet."));
      pics.forEach(function(x){
        var c=el("div","pcard");
        var im=document.createElement("img"); im.src=x.data; im.alt=x.caption||("T-"+t.no);
        im.addEventListener("click",function(){ lightbox(x.data); });
        c.appendChild(im);
        var cp=el("div","cap");
        cp.appendChild(el("div",null,x.caption||"photo"));
        cp.appendChild(el("div","hint",(x.by||"—")+" · "+(x.at||"")));
        if(!done){
          var rm=el("button","btn sm","Remove"); rm.style.marginTop="4px";
          rm.addEventListener("click",async function(){
            rm.disabled=true; await removePhoto(owner,x.id);
            paintAtt(); syncClose(); });
          cp.appendChild(rm);
        }
        c.appendChild(cp); gal.appendChild(c);
      });
      lnk.forEach(function(x){
        var r=el("div","row");
        r.style.cssText="padding:6px 0;border-bottom:1px solid var(--rule)";
        r.appendChild(el("span","chip accent",
          (x.linkKind==="video"?"▶ ":"")+(LINK_KINDS[x.linkKind]||"Link")));
        var a=el("a",null,x.caption||x.url); a.href=x.url; a.target="_blank";
        a.rel="noopener noreferrer";
        a.style.cssText="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
        r.appendChild(a);
        r.appendChild(el("span","hint",(x.by||"—")+" · "+(x.at||"")));
        if(!done){
          var rm2=el("button","btn sm","Remove");
          rm2.addEventListener("click",async function(){
            rm2.disabled=true; await removePhoto(owner,x.id);
            paintAtt(); syncClose(); });
          r.appendChild(rm2);
        }
        links.appendChild(r);
      });
    });
  }

  var aby=el("input"); aby.placeholder="your name";
  if(!done){
    var ar=el("div","f3"); ar.style.marginTop="var(--space-4)";
    var afi=el("input"); afi.type="file"; afi.accept="image/*";
    var acap=el("input"); acap.placeholder="what it shows";
    ar.appendChild(f2("Photograph",afi)); ar.appendChild(f2("Caption",acap));
    ar.appendChild(f2("Put up by",aby));
    pb.appendChild(ar);
    var arow=el("div","row"); arow.style.marginTop="var(--space-2)";
    var apb=el("button","btn","Attach the photo");
    var amsg=el("div","hint");
    apb.addEventListener("click",async function(){
      if(!afi.files||!afi.files.length){ amsg.textContent="Choose a photo first.";
        amsg.style.color="var(--danger)"; return; }
      if(!aby.value.trim()){ amsg.textContent="Put your name to it.";
        amsg.style.color="var(--danger)"; return; }
      apb.disabled=true; apb.textContent="Attaching…";
      try{
        var sh=await shrinkImage(afi.files[0]);
        await addPhoto(owner,{caption:acap.value.trim(),by:aby.value.trim(),
          data:sh.data,w:sh.w,h:sh.h,bytes:sh.bytes});
      }catch(e){
        apb.disabled=false; apb.textContent="Attach the photo";
        amsg.textContent="Could not attach: "+(e&&e.message||"");
        amsg.style.color="var(--danger)"; return;
      }

          if(e.onHand<=0) sp.style.color="var(--warn)";

        {h:"Last in",get:function(e){return e.lastInISO||"—";}},

  var r1=el("div","f2"); r1.style.marginTop="var(--space-4)";

  S.parts.forEach(function(pp){ cs.appendChild(new Option(pp.cat,pp.cat)); });

    cs.appendChild(new Option(it.cat,it.cat));
  cs.value=it.cat||"";
  var nm=el("input"); nm.value=it.name||""; nm.placeholder="what it is called";

  acts.appendChild(cb);
  if(!isNew){

    db3.addEventListener("click",async function(){
      await replaceRows("items",S.items.filter(function(x){ return x.id!==it.id; }));
      _itemIdx=null; _inv=null; m.remove(); toast("Item removed."); render(); if(after) after();
    });
    acts.appendChild(db3);
  }
  var sv=el("button","btn pri","Save");

    sv.disabled=true;

/* Point a stray spelling at the item it really is. */
function linkStray(e2){
  var ex=document.getElementById("lkSheet"); if(ex) ex.remove();
  var m=el("div","modal"); m.id="lkSheet";
  var sheet=el("div","sheet"); sheet.style.maxWidth="560px";
  var b=el("div"); b.style.padding="var(--space-5) var(--space-6)";
  b.appendChild(el("h3",null,"What is this?"));
  b.appendChild(el("div","hint",
    "“"+(e2.item||"—")+"” was issued from the store but never bought into it. "+
    "If it is one of the items below under another name, point it there and the two merge."));
  var sel=el("select");
  sel.appendChild(new Option("— pick the item it really is —",""));
  (S.items||[]).slice().sort(function(a,b2){ return (a.cat+a.name).localeCompare(b2.cat+b2.name); })
    .forEach(function(mi){
      sel.appendChild(new Option(mi.cat+" — "+mi.name+(mi.partNo?"  ("+mi.partNo+")":""),mi.id)); });
  var f=el("div","field"); f.style.marginTop="var(--space-4)";
  f.appendChild(el("label",null,"Same as")); f.appendChild(sel);
  b.appendChild(f);
  var acts=el("div"); acts.style.cssText="display:flex;gap:var(--space-2);justify-content:flex-end;margin-top:var(--space-5)";
  var cb=el("button","btn","Cancel"); cb.addEventListener("click",function(){ m.remove(); });
  var sv=el("button","btn pri","Link them");
  sv.addEventListener("click",async function(){
    if(!sel.value) return;
    sv.disabled=true;
    var next=S.items.map(function(x){
      if(x.id!==sel.value) return x;
      var al=(x.aliases||[]).slice();
      if(al.indexOf(e2.item)<0) al.push(e2.item);
      return Object.assign({},x,{aliases:al});
    });
    try{ await replaceRows("items",next); }
    catch(err){ sv.disabled=false; toast("Could not save: "+(err&&err.message||"")); return; }
    _itemIdx=null; _inv=null;
    m.remove(); toast("Linked — the store now reads them as one item."); render();
  });
  acts.appendChild(cb); acts.appendChild(sv); b.appendChild(acts);
  sheet.appendChild(b); m.appendChild(sheet);
  m.addEventListener("click",function(ev){ if(ev.target===m) m.remove(); });
  document.body.appendChild(m);
}

function vrfLogView(){

  w.appendChild(pageHead("VRF log","Every form, by number",

    if(h) x.appendChild(el("div","hint",h)); return x; }
  var q=el("input"); q.placeholder="VRF number, unit, item, supplier…"; q.value=S.logQ||"";
  q.className="mono";
  var fw=workSelect(S.regWork,"— every job —");
  var fs2=el("select");
  [["","every status"],["Open","open — awaiting liquidation"],["Closed","liquidated"],
   ["Legacy","from the old workbooks"]].forEach(function(o){ fs2.appendChild(new Option(o[1],o[0])); });
  fs2.value=S.regStatus||"";

  g.appendChild(bar);

  fs2.addEventListener("change",function(){ S.regStatus=fs2.value; render(); });

  var host=el("div");
  g.appendChild(host);

  function draw(){
    host.innerHTML="";
    var term=(S.logQ||"").trim().toLowerCase();
    var list=vrfIndex().filter(function(v){
      if(S.regWork&&v.works.indexOf(S.regWork)<0) return false;
      if(S.regStatus&&v.status!==S.regStatus) return false;
      if(!term) return true;
      if(String(v.vrf).toLowerCase().indexOf(term)>=0) return true;
      if(v.units.join(" ").toLowerCase().indexOf(term)>=0) return true;
      if((v.project||"").toLowerCase().indexOf(term)>=0) return true;
      return v.rows.some(function(r){
        return ((r.item||"")+" "+(r.supplier||"")+" "+(r.cat||"")).toLowerCase().indexOf(term)>=0; });
    });
    var withFile=list.filter(function(v){ return vrfDrive(v); }).length;
    host.appendChild(stats([
      ["Forms in view", nnum(list.length), vrfIndex().length+" on file"],
      ["With a Drive link", nnum(withFile), list.length?Math.round((withFile/list.length)*100)+"% of these":"—"],
      ["Awaiting liquidation", nnum(list.filter(function(v){return v.status==="Open";}).length), "still open", true],
      ["Value in view", pesoK(list.reduce(function(a,v){return a+v.total;},0)), "sum of these forms", true]
    ]));
    var tbl=table([
      {h:"VRF",get:function(v){ var x=el("span","mono",v.vrf); x.style.fontWeight="600"; return x; }},
      {h:"Date",get:function(v){return v.date;}},
      {h:"Unit",get:function(v){ return el("span","mono",v.units.join(", ")||"—"); }},
      {h:"Jobs",get:function(v){
        var d=el("div"); d.style.cssText="display:flex;flex-wrap:wrap;gap:3px";
        v.scopes.forEach(function(sc){
          d.appendChild(el("span","chip "+(sc.confirmed?"accent":"mute"),sc.name)); });
        return d; }},
      {h:"Lines",num:true,get:function(v){return nnum(v.rows.length);}},
      {h:"Total",num:true,get:function(v){return peso(v.total);}},
      {h:"Files",num:true,get:function(v){
        var n=photoCount(v.vrf);
        return el("span","chip "+(n?"accent":"mute"),n?"📎 "+n:"—"); }},
      {h:"Status",get:vrfChip},
      {h:"",get:function(v){
        var row=el("div"); row.style.cssText="display:flex;gap:4px;flex-wrap:wrap";
        var pb=el("button","btn sm","Print");
        pb.addEventListener("click",function(ev){ ev.stopPropagation(); printVrfNo(v); });

  });
  draw();

  return w;
}

/* Writes a scope onto individual lines — a VRF that covers a change oil and an
   aircon repair keeps both, rather than being flattened to whichever came first. */
async function setLineWork(entry,codes){
  var touched={};
  entry.rows.forEach(function(r,i){
    var mk=r.month;
    var arr=S.ledger[mk]; if(!arr) return;
    var idx=arr.indexOf(r);
    if(idx<0) return;
    arr[idx]=Object.assign({},r,{work:codes[i]||""});
    touched[mk]=1;
  });
  for(var mk in touched){
    if(!touched.hasOwnProperty(mk)) continue;
    await writeDoc("ledger/"+mk,{month:mk,rows:S.ledger[mk]});
  }
  _vrfs=null; _lw=null;
}

function printVrf(entry,photos){

  sheet.style.cssText="max-width:900px;background:#fff";

  bar.style.cssText="display:flex;gap:var(--space-2);align-items:center;padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--surface);z-index:2;flex-wrap:wrap";

      try{

      }catch(e){ toast("The save was declined."); }

/* Where the signed paper copy of a VRF lives. Stored on the VRF's own lines so
   it travels with the record; if none is set, the log falls back to searching
   the Drive folder named in the office settings. */
async function setVrfDrive(entry,url){
  var touched={};
  entry.rows.forEach(function(r){
    var mk=r.month, arr=S.ledger[mk]; if(!arr) return;
    var idx=arr.indexOf(r); if(idx<0) return;
    arr[idx]=Object.assign({},r,{driveUrl:url||""});
    touched[mk]=1;
  });
  for(var mk in touched){
    if(!touched.hasOwnProperty(mk)) continue;
    await writeDoc("ledger/"+mk,{month:mk,rows:S.ledger[mk]});
  }
  _vrfs=null; _lw=null;
}
function vrfDrive(entry){
  for(var i=0;i<entry.rows.length;i++) if(entry.rows[i].driveUrl) return entry.rows[i].driveUrl;
  return "";
}
function driveSearchUrl(vrfNo){
  var base=(S.cfg&&S.cfg.driveFolder)||"";
  var q=encodeURIComponent("VRF "+vrfNo);
  var m=/drive\.google\.com\/drive\/folders\/([A-Za-z0-9_-]+)/.exec(base);
  if(m) return "https://drive.google.com/drive/search?q="+q+"%20parent:"+m[1];
  return "https://drive.google.com/drive/search?q="+q;
}
function isHttpUrl(u){ return /^https?:\/\/\S+$/i.test((u||"").trim()); }

  }else{

function blankLine(){ return {cat:"",item:"",supplier:"",qty:"",unit:"pc",price:"",liters:"",work:"",remarks:""}; }
/* A work-type picker, grouped by family so the list stays readable at 39 entries. */

  S.worktypes.forEach(function(w){ if(w.code!=="UNCLASS") (fams[w.family]=fams[w.family]||[]).push(w); });
  Object.keys(fams).forEach(function(f){

}

  var dIn=el("input"); dIn.type="date"; dIn.value=d.date;

  hb.appendChild(fld("Date",dIn));

  var vSel=unitPicker(d.veh,function(codeV){ d.veh=codeV; onUnitPicked(); },
    {hint:"Search by code, name or plate."});

  var pSel=el("select");
  pSel.appendChild(new Option("— pick a project —",""));
  S.projects.forEach(function(p){ pSel.appendChild(new Option(p.code,p.code)); });
  pSel.value=d.project;

    rsel.innerHTML="";

      var amt=rr.approvedBudget!=null?rr.approvedBudget:rr.budget;

        na
          ? (d.veh ? na+" approved and unspent for "+d.veh+" — pick one to spend against its budget."
                   : na+" approved across the yard — pick a unit above to narrow it.")
          : (d.veh ? "Nothing approved for "+d.veh+" yet. Raise it under Reserves and get it approved first."
                   : "Nothing approved anywhere yet. Only reserves that have been approved appear here.")));
      return;
    }
    var rr=reserveBy(d.reserve); if(!rr) return;
    var appr=(rr.approvedBudget!=null?rr.approvedBudget:rr.budget)||0;
    var already=reserveActual(rr).total;
    var thisOne=d.lines.reduce(function(a,l){
      return a+((parseFloat(l.qty)||0)*(parseFloat(l.price)||0)); },0);
    var rv={approved:appr,actual:already+thisOne,diff:(already+thisOne)-appr,
      pct: appr>0?((already+thisOne)-appr)/appr:0, over: appr>0?((already+thisOne)-appr)>appr*varianceTol():false};

      rmeter.appendChild(bn);

  g0.appendChild(rwrap);

  /* The reserve says the money was approved. This says what the money was for.

     job order behind it, so neither field is made to depend on the other. */
  var jsel=el("select");

/* Everything typed on the form becomes the reserve, so nobody re-keys a job
   they have already itemised. The lines ride along and come back on approval. */
async function sendForApproval(d,btn){
  if(!d.veh){ toast("Pick a unit first."); return; }
  if(!d.work){ toast("Pick the type of job — the approver decides on that."); return; }
  var rows=d.lines.filter(function(l){ return l.cat&&(parseFloat(l.qty)||parseFloat(l.price)); });
  if(!rows.length){ toast("Add at least one line so there is a figure to approve."); return; }
  var total=rows.reduce(function(a,l){
    return a+((parseFloat(l.qty)||0)*(parseFloat(l.price)||0)); },0);
  if(total<=0){ toast("Put the estimated amounts on the lines — that is what is being approved."); return; }
  if(rows.some(function(l){ return isFuel(l.cat); })){
    toast("Fuel is raised on the Reserves screen — it needs the gauge reading and its photo first.");
    S.view="rsv"; render(); return;
  }
  /* No window.prompt here: this page runs in a sandboxed frame that blocks
     modals outright, and a blocked prompt returns null — which silently killed
     every request. The name comes from the form field instead. */
  var who=(d.requestedBy||"").trim();
  if(!who||who==="MOTORPOOL DEPT."){
    toast("Put your name in “Requested by” at the top — the request has to carry one.");
    return false;
  }
  btn.disabled=true; btn.textContent="Sending…";
  try{
    var no=await claimReserveNo();
    var vno=await claimVrf();
    var summary=rows.map(function(l){
      return (l.item||normCat(l.cat))+" ×"+(l.qty||1); }).join(", ");
    S.reserves.push({no:String(no),vrfNo:String(vno),date:d.date||iso(),kind:"job",veh:d.veh,work:d.work,
      project:d.project,budget:total,needBy:"",
      scope:(d.purpose?d.purpose+" — ":"")+summary,
      requestedBy:who,status:"Requested",
      approvedBudget:null,approvedBy:"",approvedAt:"",decisionNote:"",
      vrfs:[],jo:"",actual:null,liquidatedAt:"",
      draftLines:rows.map(function(l){ return {cat:l.cat,item:l.item,supplier:l.supplier,
        qty:l.qty,unit:l.unit,price:l.price,liters:l.liters,work:l.work||d.work}; }),
      draftOdo:d.odo||"", draftPurpose:d.purpose||"",
      justification:"",justifiedBy:"",varianceBy:"",varianceAt:"",varianceNote:""});
    await saveReserves();
    if(d.photos&&d.photos.length){
      btn.textContent="Saving photos…";
      for(var pi=0;pi<d.photos.length;pi++){
        try{ await addPhoto(rsvOwner(no),{data:d.photos[pi].data,w:d.photos[pi].w,
          h:d.photos[pi].h,bytes:d.photos[pi].bytes,caption:d.photos[pi].caption,by:who}); }catch(e){}
      }
    }
    S.draft=null;
    toast("VRF "+vno+" sent for approval at "+peso(total)+" — the number is held for it.");
    S.view="rsv"; render();
    openReserve(no);
  }catch(e){
    btn.disabled=false; btn.textContent="Send for approval";
    toast("Could not send it. Nothing was saved — try again.");
  }
}

async function postVrf(d,btn){
  if(!d.veh){ toast("Pick a unit first."); return; }
  if(!d.work){ toast("Pick the type of job — it is what makes this VRF findable later."); return; }
  var fuelLines=d.lines.filter(function(l){ return isFuel(l.cat)&&(parseFloat(l.qty)||parseFloat(l.liters)); });
  if(fuelLines.length&&!d.reserve){
    toast("Fuel needs an approved reserve behind it — pick one at the top of the form.");
    return;
  }
  if(fuelLines.length&&!d.gateOverride){
    var LL=fuelLines.reduce(function(a,l){ return a+(parseFloat(l.liters)||parseFloat(l.qty)||0); },0);
    var chk=fuelCheck(d.veh,d.odo,LL);
    if(chk.stops&&chk.stops.length){
      toast("The fuel check has stopped this request — read it and override with a reason.");
      return;
    }
  }
  var rows=d.lines.filter(function(l){ return l.cat && (parseFloat(l.qty)||parseFloat(l.price)); });
  if(!rows.length){ toast("Add at least one line with a category and a figure."); return; }
  btn.disabled=true; btn.textContent="Posting…";
  try{
    /* a reserve holds its VRF number from the moment it is raised, so posting
       uses that number instead of burning a new one */
    var no = d.vrfNo || await claimVrf();
    var v = vehicle(d.veh);
    var mk = monthKey(d.date)||iso().slice(0,7);
    var out = rows.map(function(l){
      var sp=partSpec(l.cat);
      var qty=parseFloat(l.qty)||0, price=parseFloat(l.price)||0;
      return {month:mk,date:d.date,vrf:String(no),veh:d.veh,name:v?v.desc:"",
        work:l.work||d.work,
        cat:l.cat, sub:sp?sp.sub:(isFuel(l.cat)?"Fuel":""),
        grp: isFuel(l.cat)?"Fuel":"Maintenance",
        item:l.item, qty:qty, price:price, total:qty*price,
        supplier:l.supplier, project:d.project, liters:parseFloat(l.liters)||null,
        odo:parseFloat(String(d.odo).replace(/,/g,""))||null,
        override: (isFuel(l.cat)&&d.gateOverride)?d.gateOverride:null,
        reserve: d.reserve||"", vstatus:"Open",
        jo: (d.jo&&d.jo.indexOf("JO:")===0)?d.jo.slice(3):"",
        task: (d.jo&&d.jo.indexOf("T:")===0)?d.jo.slice(2):"",
        notes:d.purpose};
    });
    await appendLedger(mk,out);
    /* a line drawn against the reserve is also a withdrawal from the drums */
    var draws = out.filter(function(r){ return r.supplier==="FUEL RESERVE" && r.liters>0; });
    if(draws.length){
      await appendRows("withdrawals", draws.map(function(r){
        return {date:r.date,vrf:r.vrf,vehicle:r.veh,project:r.project,fuel:/gas/i.test(r.cat)?"Gasoline":"Diesel",
          cont:Math.round(r.liters/CONTAINER_L),liters:r.liters,cost:null,rate:null,operator:d.requestedBy};
      }));
    }
    if(d.photos&&d.photos.length){
      btn.textContent="Saving photos…";
      for(var pi=0;pi<d.photos.length;pi++){
        try{ await addPhoto(no,{data:d.photos[pi].data,w:d.photos[pi].w,h:d.photos[pi].h,
          bytes:d.photos[pi].bytes,caption:d.photos[pi].caption,by:d.requestedBy}); }catch(e){}
      }
    }
    if(d.reserve){
      var rr=reserveBy(d.reserve);
      if(rr){
        rr.vrfs=(rr.vrfs||[]).concat([String(no)]);
        await saveReserves();
      }
    }
    /* the work record keeps the VRF number, so the job order shows what it cost */
    if(d.jo&&d.jo.indexOf("JO:")===0){
      var jj=joBy(d.jo.slice(3));
      if(jj&&!jj.vrf){ try{ await saveJO(jj.no,{vrf:String(no)}); }catch(e){} }
    }else if(d.jo&&d.jo.indexOf("T:")===0){
      var tt=taskBy(d.jo.slice(2));
      if(tt&&!tt.vrf){ try{ await saveTask(tt.no,{vrf:String(no)}); }catch(e){} }
    }
    var nPhotos=(d.photos||[]).length;
    S.draft=null;
    toast("VRF "+no+" posted · "+out.length+" line"+(out.length>1?"s":"")+
      (nPhotos?" · "+nPhotos+" attachment"+(nPhotos>1?"s":""):""));
    render();
    var entry=vrfByNo(no);
    if(entry) openVrf(entry,"lines");
  }catch(e){
    btn.disabled=false; btn.textContent="Post VRF";
    toast("Could not post the VRF. Nothing was saved — try again.");
  }
}

  bfw.style.maxWidth="380px"; bbd.appendChild(bfw);
  bfi.addEventListener("change",async function(){
    var files=Array.prototype.slice.call(bfi.files||[]);
    for(var i=0;i<files.length;i++){
      try{ var sh=await shrinkImage(files[i]);
        bphotos.push({data:sh.data,w:sh.w,h:sh.h,bytes:sh.bytes,caption:"Delivery — "+(bsup.value||"fuel")}); }catch(e){}
    }
    bfi.value=""; bdraw();

  var bact=el("div","row"); bact.style.marginTop="var(--space-3)";
  var bsv=el("button","btn pri","Record delivery");
  bsv.addEventListener("click",async function(){
    if(!brs.value){ toast("Pick the approved bulk reserve this delivery is against."); return; }
    var L=(parseFloat(bcn.value)||0)*CONTAINER_L, pr=parseFloat(bpl.value)||0;
    if(!(L>0)||!(pr>0)){ toast("Containers and price per litre are both needed."); return; }
    if(!bphotos.length){ toast("Attach the delivery slip or the drum gauge photo."); return; }

async function saveJO(no,patch){
  var next=S.mechanic.map(function(x){
    return String(x.no)===String(no) ? Object.assign({},x,patch) : x; });
  await replaceRows("mechanic",next);
}
function openJO(no){
  var ex=document.getElementById("joSheet"); if(ex) ex.remove();
  var j=joBy(no); if(!j) return;

  var v=vehicle(j.vehicle);
  lft.appendChild(el("div","hint",j.vehicle+(v?" · "+v.desc:"")+
    (j.breakdown?"  ·  against BR-"+j.breakdown:"")));
  hd.appendChild(lft);
  var rgt=el("div"); rgt.style.textAlign="right";
  rgt.appendChild(joStatusChip(j));
  rgt.appendChild(el("div","hint","raised "+j.raised));
  hd.appendChild(rgt);
  b.appendChild(hd);

  if(j.down&&!j.downTo){
    var dn2=el("div","banner crit");
    var dd=daysSince(j.downFrom||j.raised);
    dn2.innerHTML="<b>"+esc(j.vehicle)+" is off the road</b> — since "+
      esc(j.downFrom||j.raised)+(dd!=null?" ("+dd+" day"+(dd===1?"":"s")+")":"")+
      (j.location?" at "+esc(j.location):"")+
      (j.reportedBy?", reported by "+esc(j.reportedBy):"")+".";
    b.appendChild(dn2);
    var bir=el("div","row"); bir.style.margin="var(--space-3) 0";
    var birb=el("button","btn pri","Back in service");
    birb.addEventListener("click",async function(){
      birb.disabled=true;
      try{ await saveJO(j.no,{downTo:iso()}); }
      catch(e){ birb.disabled=false; toast("Could not save: "+(e&&e.message||"")); return; }
      toast(j.vehicle+" back in service."); render(); openJO(j.no);
    });
    bir.appendChild(birb);
    bir.appendChild(el("span","hint","Records the day it went back to work. The job order can stay open until the write-up is done."));
    b.appendChild(bir);
  }else if(j.down&&j.downTo){
    var dn3=el("div","banner info");
    var days=(parseDate(j.downTo)&&parseDate(j.downFrom||j.raised))
      ? Math.round((parseDate(j.downTo)-parseDate(j.downFrom||j.raised))/DAY) : null;
    dn3.innerHTML="<b>Was off the road "+esc(j.downFrom||j.raised)+" to "+esc(j.downTo)+"</b>"+
      (days!=null?" — "+days+" day"+(days===1?"":"s")+" down.":".");
    b.appendChild(dn3);
  }

  var meta=el("div"); meta.style.cssText="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-3);margin:var(--space-4) 0";
  [["Work",j.action],["Assigned to",j.mechanic||"— unassigned"],["Priority",j.priority||"Normal"],
   ["Parts VRF",j.vrf||"—"],["Hours",j.hours!=null?nnum(j.hours,1):"—"]].forEach(function(pp){
    var r=el("div"); r.appendChild(el("div","hint",pp[0]));
    var val=el("div",null,pp[1]||"—"); val.style.fontWeight="500"; r.appendChild(val);
    meta.appendChild(r);
  });
  b.appendChild(meta);
  if(j.rootCause){
    var sc=el("div"); sc.style.marginBottom="var(--space-4)";
    sc.appendChild(el("div","hint","Scope of work"));

    b.appendChild(sc);

  /* --- checklist --- */

  var ckh=el("div","hd"); ckh.appendChild(el("h3",null,"Checklist"));
  var cl=j.checklist||[], done=cl.filter(function(x){return x.done;}).length;
  ckh.appendChild(el("span","note",done+" of "+cl.length+" ticked"));
  ck.appendChild(ckh);
  var ckb=el("div","bd");
  var who=el("input"); who.placeholder="your name"; who.style.cssText="margin-bottom:var(--space-3)";
  who.value=j.mechanic||"";
  if(!closed){
    var wf=el("div","field"); wf.appendChild(el("label",null,"Ticking as"));

    var r=el("label"); r.style.cssText="display:flex;gap:var(--space-3);align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--rule);cursor:"+(closed?"default":"pointer");

      var next=(j.checklist||[]).map(function(x,k){
        return k===i ? Object.assign({},x,{done:cb.checked,
          by:cb.checked?who.value.trim():"", at:cb.checked?iso():""}) : x; });
      var patch={checklist:next};
      if(j.status==="Open"&&cb.checked) patch.status="In progress";

      if(!who.value.trim()){ toast("Put your name in the checklist box first."); return; }
      var next=(j.proofs||[]).concat([{url:pu.value.trim(),label:pl.value.trim(),
        linkKind:pk.value||guessLinkKind(pu.value),

      vf.appendChild((function(){var x=el("div","field");x.appendChild(el("label",null,"Check notes"));x.appendChild(vnote);return x;})());
      var vbw=el("div"); vbw.style.cssText="display:flex;align-items:flex-end;gap:var(--space-2)";

      gate.appendChild(vf);
      vb.addEventListener("click",async function(){
        if(!vn.value.trim()){ toast("The checker has to put their name to it."); return; }
        await saveJO(j.no,{status:"Closed",verifiedAt:iso(),verifiedBy:vn.value.trim(),
          verifyNotes:vnote.value.trim()});
        toast("JO-"+j.no+" signed off and closed.");
        var sh=document.getElementById("joSheet"); if(sh) sh.remove();
        render();

    [["Work done by",(j.doneBy||"—")+" · "+(j.doneAt||"—")],
     ["Checked by",(j.verifiedBy||"—")+" · "+(j.verifiedAt||"—")]].forEach(function(pp){

    re.addEventListener("click",async function(){

function fleetView(){
  var w=el("div");
  if(S.sel) return unitView(S.sel);
  w.appendChild(pageHead("Fleet","Every unit on the books",
    "Each unit has its own file — identity, photographs and papers. Money is in the Office screens."));
  var addRow=el("div","row"); addRow.style.marginBottom="var(--space-3)";
  var addB=el("button","btn pri","+ New unit");
  addB.addEventListener("click",function(){ openUnitEdit(null); });
  addRow.appendChild(addB);
  addRow.appendChild(el("span","hint","Give it a code (SV-19, DT-07) and whatever is known; the rest can be filled in later."));
  w.appendChild(addRow);
  var down=downCodes();
  var q=el("input"); q.placeholder="Search code, description, plate, owner…";
  q.style.cssText="max-width:340px;margin-bottom:14px";
  var host=el("div");
  function draw(){
    host.innerHTML="";
    var term=q.value.trim().toLowerCase();
    var list=S.vehicles.filter(function(v){
      if(!term) return true;
      return (v.code+" "+v.desc+" "+v.plate+" "+v.owner+" "+v.make).toLowerCase().indexOf(term)>=0;
    });
    host.appendChild(table([
      {h:"Code",get:function(v){ var s=el("span","mono",v.code); s.style.fontWeight="600"; return s; }},
      {h:"Description",get:function(v){return v.desc;}},
      {h:"Plate",get:function(v){ var s=el("span","mono",v.plate||"—"); return s; }},
      {h:"Fuel",get:function(v){return v.fuel||"—";}},
      {h:"Registered to",get:function(v){return v.owner||"— none on file";}},
      {h:"Renewal",get:function(v){return v.regMonth||"—";}},
      {h:"Papers",get:function(v){
        var ms=papersMissing(v);
        if(!ms.length) return el("span","chip ok","On file");
        return el("span","chip warn",ms.length+" missing"); }},
      {h:"Drive",get:function(v){
        if(!v.drive) return el("span","chip mute","no folder");
        var a=el("a","btn sm","Open ↗"); a.href=v.drive; a.target="_blank";
        a.rel="noopener noreferrer";
        a.addEventListener("click",function(e){ e.stopPropagation(); });
        return a; }},
      {h:"State",get:function(v){
        if(down[v.code]) return el("span","chip crit","Down");
        if(v.status==="SOLD") return el("span","chip mute","Sold");
        if(v.status==="Personal") return el("span","chip mute","Personal");
        return el("span","chip ok","Active"); }}
    ],list,{empty:"No unit matches that.",onRow:function(v){ S.sel=v.code; render(); window.scrollTo(0,0); }}));
  }
  q.addEventListener("input",draw); draw();

  var gaps=paperGaps();
  w.appendChild(archive("Papers to chase",
    function(shown,total){ return shown===total
      ? total+" unit"+(total===1?"":"s")+" short of a document"
      : shown+" of "+total+" units"; },
    gaps,
    function(e){ return (e.v.code+" "+(e.v.desc||"")+" "+(e.v.plate||"")+" "+
      (e.v.site||"")+" "+e.miss.join(" ")).toLowerCase(); },
    function(list){
      return table([
        {h:"Unit",get:function(e){ var s=el("span","mono",e.v.code);
          s.style.fontWeight="600"; return s; }},
        {h:"Description",get:function(e){ return e.v.desc||"—"; }},
        {h:"Plate",get:function(e){ return el("span","mono",e.v.plate||"—"); }},
        {h:"Nothing on file for",get:function(e){
          var d=el("div"); d.style.cssText="display:flex;gap:4px;flex-wrap:wrap";
          e.miss.forEach(function(t){
            d.appendChild(el("span","chip warn",t.replace(/\s*\(.*\)$/,""))); });
          return d; }},
        {h:"Kind",get:function(e){
          return el("span","chip mute",isPlant(e.v)?"plant":"registered"); }},
        {h:"Drive",get:function(e){
          if(!e.v.drive) return el("span","chip mute","no folder");
          var a=el("a","btn sm","Open ↗"); a.href=e.v.drive; a.target="_blank";
          a.rel="noopener noreferrer"; return a; }},
        {h:"",get:function(e){
          var b=el("button","btn sm","Open file");
          b.addEventListener("click",function(){
            S.sel=e.v.code; render(); window.scrollTo(0,0); });
          return b; }}
      ],list,{empty:"Nothing matches that."});
    },
    {placeholder:"unit, plate, site or the document you are after…",
     filters:[["","Every unit"],["registered","On the road (CR, OR, insurance)"],
              ["plant","Plant (deed of sale)"]],
     filterBy:function(e){ return isPlant(e.v)?"plant":"registered"; }}));

  w.appendChild(q); w.appendChild(card("Units",S.vehicles.length+" on the books",host));
  return w;
}

/* Add or correct a unit. The alpha list was the only way in until now. */
function openUnitEdit(code){
  var ex=document.getElementById("unSheet"); if(ex) ex.remove();
  var v=code?vehicle(code):null;
  var isNew=!v;
  if(isNew) v={code:"",desc:"",make:"",model:"",year:"",color:"",fuel:"Diesel",plate:"",
    engine:"",chassis:"",owner:"",cr:"",orno:"",regMonth:"",status:"Active",site:"",
    lastOil:"",schedOil:"",newTire:"",battery:"",insurance:"",insuranceExp:"",
    acquired:"",notes:"",drive:""};
  var m=el("div","modal"); m.id="unSheet";
  var sheet=el("div","sheet"); sheet.style.maxWidth="820px";
  var b=el("div"); b.style.padding="var(--space-5) var(--space-6)";
  b.appendChild(el("h3",null,isNew?"New unit":("Edit "+v.code)));
  b.appendChild(el("div","hint",isNew
    ?"The code is how this unit is known on every VRF and job order — keep to the yard's pattern."
    :"Correcting the record here changes it everywhere the unit appears."));
  var F={};
  function fieldRow(defs){
    var r=el("div","f3"); r.style.marginTop="var(--space-3)";
    defs.forEach(function(d){
      var x=el("div","field");
      x.appendChild(el("label",null,d[1]));

        inp=el("select");
        d[3].forEach(function(o){ inp.appendChild(new Option(o||"—",o)); });
      }else{
        inp=el("input");
        if(d[2]==="date") inp.type="date";
        if(d[3]) inp.placeholder=d[3];
      }
      inp.value=v[d[0]]||"";
      F[d[0]]=inp; x.appendChild(inp);
      if(d[4]) x.appendChild(el("div","hint",d[4]));
      r.appendChild(x);
    });
    b.appendChild(r);
    return r;
  }
  b.appendChild(el("h4",null,"Identity"));
  fieldRow([["code","Unit code","text","SV-19"],["desc","Description","text","TOYOTA HILUX (WHITE)"],
            ["plate","Plate no.","text","ABC 1234"]]);
  fieldRow([["make","Make","text","Toyota"],["model","Model","text","Hilux"],
            ["year","Year model","text","2019"]]);
  fieldRow([["color","Colour","text",""],
            ["fuel","Fuel","select",["Diesel","Gasoline",""]],
            ["status","Status","select",["Active","SOLD","Personal","For disposal"]]]);
  var h2=el("h4",null,"Registration"); h2.style.marginTop="var(--space-5)"; b.appendChild(h2);
  fieldRow([["engine","Engine no.","text",""],["chassis","Chassis no.","text",""],
            ["owner","Registered owner","text","whose name it is in"]]);
  fieldRow([["cr","CR no.","text",""],["orno","OR no.","text",""],
            ["regMonth","Renewal month","select",["","January","February","March","April","May",
              "June","July","August","September","October","November","December"]]]);
  fieldRow([["insurance","Insurer","text",""],["insuranceExp","Insurance expires","date",""],
            ["acquired","Acquired","date",""]]);
  var h3=el("h4",null,"Service and posting"); h3.style.marginTop="var(--space-5)"; b.appendChild(h3);
  fieldRow([["site","Assigned site","text",""],["lastOil","Last change oil","text",""],
            ["schedOil","Change oil due","text",""]]);
  fieldRow([["newTire","New tires","text",""],["battery","Battery","text",""],["notes","Notes","text",""]]);
  fieldRow([["drive","Drive folder","text","https://drive.google.com/drive/folders/…",
             "The unit's own folder — where the OR, CR and insurance scans are kept."]]);

  var msg=el("div","hint"); msg.style.marginTop="var(--space-3)"; b.appendChild(msg);
  var acts=el("div"); acts.style.cssText="display:flex;gap:var(--space-2);justify-content:flex-end;margin-top:var(--space-5)";
  var cb=el("button","btn","Cancel"); cb.addEventListener("click",function(){ m.remove(); });
  acts.appendChild(cb);
  var sv=el("button","btn pri",isNew?"Add the unit":"Save changes");
  sv.addEventListener("click",async function(){
    var codeV=String(F.code.value||"").trim().toUpperCase();
    if(!codeV){ msg.textContent="A unit needs a code."; msg.style.color="var(--danger)"; return; }
    if(isNew&&vehicle(codeV)){
      msg.textContent=codeV+" already exists."; msg.style.color="var(--danger)"; return; }
    if(!String(F.desc.value||"").trim()){
      msg.textContent="Give it a description so people recognise it in a dropdown.";
      msg.style.color="var(--danger)"; return; }
    sv.disabled=true; sv.textContent="Saving…";
    var row={};
    Object.keys(F).forEach(function(k){ row[k]=String(F[k].value||"").trim(); });
    row.code=codeV;
    var next=S.vehicles.filter(function(x){ return x.code!==(code||codeV); }).concat([row]);
    next.sort(function(a,b2){ return a.code.localeCompare(b2.code); });
    try{ await saveVehicles(next); }

      msg.textContent="Could not save: "+(e&&e.message||""); msg.style.color="var(--danger)"; return; }

    m.remove(); S.sel=codeV; S.view="fleet"; render();
  });
  acts.appendChild(sv); b.appendChild(acts);
  sheet.appendChild(b); m.appendChild(sheet);
  m.addEventListener("click",function(e){ if(e.target===m) m.remove(); });
  document.body.appendChild(m);
}

function fuelEconView(){
  var f=fifo();
  var w=el("div");

    "Bulk diesel costed first-in-first-out, so a litre burned in September is charged at the price of the lot it actually came from."));
  var g=el("div","grid"); g.style.gap="16px";
  var avgOnHand = f.onHand>0.01 ? f.onHandValue/f.onHand : null;
  g.appendChild(stats([
    ["Inventory value", peso(f.onHandValue), nnum(f.onHand,0)+" L on hand"],
    ["Avg cost / L on hand", avgOnHand!=null?"₱ "+avgOnHand.toFixed(2):"—", "FIFO basis", true],
    ["Purchase spend", peso(f.purchasedValue), nnum(f.purchasedL,0)+" L received"],
    ["Cost of fuel used", peso(f.costOfUse), nnum(f.consumedL,0)+" L dispensed"],
    ["Avg cost / L used", f.consumedL?"₱ "+(f.costOfUse/f.consumedL).toFixed(2):"—","across all withdrawals",true]

  var pts=S.purchases.slice().sort(function(a,b){return (parseDate(a.date)||0)-(parseDate(b.date)||0);})
    .map(function(p){ return {date:p.date, rate:p.pricePerL||(p.total/p.liters)||0,
      liters:p.liters, total:p.total, vrf:p.vrf}; });
  if(pts.length>1){
    var first=pts[0].rate, last=pts[pts.length-1].rate;

    var note=el("p","hint","Buy price has moved from ₱"+first.toFixed(2)+" to ₱"+last.toFixed(2)+
      " per litre — "+(last>first?"+":"")+(((last-first)/first)*100).toFixed(0)+"% across "+pts.length+" deliveries. "+
      "Older, cheaper litres are still being consumed, which is why cost of use trails the current buy price.");
    note.style.margin="0 0 8px"; note.style.maxWidth="72ch";
    pc.appendChild(note);
    pc.appendChild(priceLine(pts));
    g.appendChild(card("Diesel buy price","per litre, by delivery",pc));

  var byVeh={}, byProj={}, unmapped={};
