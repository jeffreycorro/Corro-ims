<!doctype html><html><head><script src="/claude-shim.js"></script><link rel="manifest" href="/manifest.json"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/favicon.svg"><link rel="stylesheet" href="/pwa.css"><script src="/pwa.js"></script><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><title>Corcondev Motorpool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   Corcondev house style (corro.css v1) applied to the motorpool
   portal. Tokens, type, colour and component looks come from the
   kit; the second block maps this app's own token names onto them
   so nothing is hard-coded past the ramp.
   The kit is a light-only system — no dark variants here by design.
   ============================================================ */
:root{
  --corro-teal:#2aa0c0; --corro-graphite:#4d4d4d;
  --accent-100:#ecf8fb; --accent-200:#cdeef5; --accent-300:#a5dfec; --accent-400:#74c8dc;
  --accent-500:#45b0c9; --accent:#2aa0c0; --accent-600:#2394b3; --accent-700:#1b7690;
  --accent-800:#13556a; --accent-900:#0d3947;
  --grey-100:#f4f5f5; --grey-200:#e6e8e8; --grey-300:#d3d5d5; --grey-400:#b5b8b8;
  --grey-500:#969999; --grey-600:#787b7b; --grey-700:#5b5e5e; --grey-800:#404343; --grey-900:#292c2c;
  --bg:#f2f2f3; --surface:#fbfbfc; --chrome:#f4f5f5;
  --text:#2e2e2e; --text-muted:#5b5e5e;
  --divider:color-mix(in srgb,#2e2e2e 14%,transparent);
  --rule:color-mix(in srgb,#2e2e2e 7%,transparent);
  --ok:#2f7d55; --ok-bg:#eaf5ee; --warn:#9a6b1a; --warn-bg:#fbf3e4;
  --danger:#9c3131; --danger-bg:#fbeceb;
  --font-heading:"Archivo Narrow",system-ui,sans-serif;
  --font-body:"Archivo",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,monospace;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:24px; --space-6:32px; --space-7:48px;
  --radius:4px; --radius-lg:8px;
  --shadow-sm:0 1px 2px rgba(24,30,32,.05),0 1px 3px rgba(24,30,32,.07);
  --shadow-md:0 2px 4px rgba(24,30,32,.05),0 4px 12px rgba(24,30,32,.08);
  --shadow-lg:0 8px 28px rgba(24,30,32,.13);
  --header-h:56px; --sidebar-w:224px;

  /* app-local names mapped onto the house ramp */
  --ground:var(--bg); --surface-2:var(--grey-100); --surface-3:var(--grey-200);
  --ink:var(--text); --ink-2:var(--text-muted); --ink-3:var(--grey-600);
  --line:var(--rule); --line-2:var(--divider);
  --accent-ink:var(--accent-700); --accent-wash:var(--accent-100);
  --good:var(--ok); --good-wash:var(--ok-bg);
  --crit:var(--danger); --crit-wash:var(--danger-bg);
  --warn-wash:var(--warn-bg);
  --shadow:var(--shadow-sm); --r:var(--radius);
  --steel:var(--accent-700);

  /* chart series — teal-anchored, validated light-mode categorical set */
  --s1:#1E8FAE; --s2:#BE5A1B; --s3:#8A4A86; --s4:#5F7A25; --s5:#4d4d4d;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5,h6{font-family:var(--font-heading);font-weight:600;line-height:1.15;
  margin:0;text-wrap:balance}
h1{font-size:40px} h2{font-size:30px} h3{font-size:23px} h4{font-size:19px}
p{margin:0;text-wrap:pretty}
a{color:var(--accent-700);text-decoration:none}
a:hover{color:var(--accent-900);text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--accent-200)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--grey-300);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.rail{display:flex;flex-direction:column;background:var(--chrome);
  border-right:1px solid var(--divider);box-shadow:var(--shadow-sm);z-index:2;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4);
  border-bottom:1px solid var(--divider)}
.brand img{width:34px;height:34px;flex:none;object-fit:contain}
.brand .name{font-family:var(--font-heading);font-weight:600;font-size:16px;line-height:1.1}
.brand .sub{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.navgrp{padding:var(--space-2)}
.navgrp .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);
  padding:var(--space-3) var(--space-2) var(--space-1)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav button{position:relative;display:flex;align-items:center;gap:var(--space-3);width:100%;
  padding:9px 10px;border:0;border-radius:var(--radius);background:transparent;
  font-family:var(--font-heading);font-weight:600;font-size:15px;color:var(--text);
  text-align:left;cursor:pointer}
.nav button .ic{width:17px;text-align:center;font-size:14px;flex:none;color:var(--text-muted)}
.nav button:hover{background:color-mix(in srgb,var(--text) 6%,transparent)}
.nav button[aria-current="true"]{background:var(--accent-100);
  box-shadow:inset 3px 0 0 var(--accent);color:var(--accent-900)}
.nav button[aria-current="true"] .ic{color:var(--accent-700)}
.nav button .cnt{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--accent-700)}
.nav button.locked .ic{opacity:.45}
.railfoot{margin-top:auto;padding:var(--space-3) var(--space-4);border-top:1px solid var(--divider)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:var(--space-4);min-height:var(--header-h);
  padding:var(--space-3) var(--space-6);background:var(--chrome);
  border-bottom:1px solid var(--divider);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar .zone{font-family:var(--font-heading);font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;font-size:11px;padding:3px 9px;border-radius:var(--radius);
  box-shadow:inset 0 0 0 1px var(--divider);color:var(--text-muted)}
.topbar .zone.office{background:var(--accent);box-shadow:none;color:#fff}
.topbar .spacer{flex:1}
.content{padding:var(--space-6);max-width:1260px;width:100%}
.page-head{margin-bottom:var(--space-5)}
.page-head .eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-700)}
.page-head h2{margin-top:2px}
.page-head p{color:var(--text-muted);margin-top:var(--space-2);max-width:68ch;font-size:14px}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);
  box-shadow:var(--shadow-sm)}
.card>.hd{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--rule);
  display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap}
.card>.hd h3{font-size:19px}
.card>.hd .note{font-size:11px;color:var(--text-muted);margin-left:auto}
.card>.bd{padding:var(--space-4)}
.card>.bd.flush{padding:0}
.grid{display:grid;gap:var(--space-4)}
.row{display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);
  padding:8px 14px;border:1px solid var(--divider);border-radius:var(--radius);
  background:var(--surface);box-shadow:var(--shadow-sm);
  font-family:var(--font-heading);font-weight:600;font-size:14px;line-height:1.2;
  color:var(--text);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--grey-100)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none}
.btn.pri:hover{background:var(--accent-600)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:var(--space-1)}
.field label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted)}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;background:#fff;
  border:1px solid var(--divider);border-radius:var(--radius);font-family:var(--font-body);
  font-size:14px;color:var(--text)}
.field input[type="number"],.field input[type="date"]{font-family:var(--font-mono);
  font-variant-numeric:tabular-nums}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-100)}
.field input::placeholder,.field textarea::placeholder{color:var(--grey-500)}
.field textarea{resize:vertical}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--radius);
  font-size:11px;font-weight:500;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--danger-bg);color:var(--danger)}
.chip.mute{background:var(--grey-200);color:var(--grey-800)}
.chip.accent{background:var(--accent-100);color:var(--accent-800)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--font-heading);font-weight:600;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-muted);text-align:left;
  padding:var(--space-2) var(--space-3);border-bottom:1px solid var(--divider);white-space:nowrap}
td{padding:var(--space-3);border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--text) 3%,transparent)}
.num{text-align:right;white-space:nowrap}
th.num{text-align:right}
.scroll{overflow-x:auto}
.empty{padding:var(--space-7) var(--space-4);text-align:center;color:var(--text-muted);font-size:14px}
.hint{font-size:12px;color:var(--text-muted)}

/* stat tiles — the kit's teal cap rule */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:var(--space-3)}
.stat{background:var(--surface);border:1px solid var(--rule);border-top:2px solid var(--accent);
  border-radius:var(--radius);box-shadow:var(--shadow-md);padding:var(--space-4);
  display:flex;flex-direction:column;gap:var(--space-1)}
.stat .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-700)}
.stat .v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:500;
  font-size:34px;line-height:1.1;letter-spacing:-.02em}
.stat .v.sm{font-size:26px}
.stat .m{font-size:11px;color:var(--text-muted)}

/* unit tiles */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:var(--space-3)}
.unit{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--grey-300);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:var(--space-3);
  cursor:pointer;text-align:left;font:inherit;color:inherit}
.unit:hover{background:var(--grey-100)}
.unit.down{border-left-color:var(--danger)}
.unit.due{border-left-color:var(--warn)}
.unit.ok{border-left-color:var(--accent)}
.unit.off{border-left-color:var(--grey-300);opacity:.55}
.unit .code{font-family:var(--font-mono);font-weight:600;font-size:14px}
.unit .desc{font-size:11px;color:var(--text-muted);margin-top:2px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;min-height:2.7em}

/* VRF line editor */
.lines{width:100%;border-collapse:collapse;font-size:13px}
.lines th{padding:6px 7px;font-size:10px}
.lines td{padding:3px;border-bottom:1px solid var(--rule)}
.lines input,.lines select{width:100%;border:1px solid transparent;background:transparent;
  padding:5px 6px;border-radius:var(--radius);font-family:var(--font-body);font-size:13px;color:var(--text)}
.lines input:hover,.lines select:hover{border-color:var(--divider)}
.lines input:focus,.lines select:focus{background:#fff;border-color:var(--accent);
  outline:none;box-shadow:0 0 0 2px var(--accent-100)}
.lines .num input{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* charts */
.legend{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:12px;color:var(--text-muted);align-items:center}
.legend .k{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:10px;height:10px;border-radius:2px;flex:none}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--divider);
  border-radius:var(--radius);padding:7px 10px;font-size:12px;box-shadow:var(--shadow-lg);
  z-index:90;display:none;max-width:260px}
.tip .t{font-family:var(--font-heading);font-weight:600;margin-bottom:3px}
.tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--text-muted)}
.tip .r b{font-family:var(--font-mono);color:var(--text);font-weight:500}
svg text{font-family:var(--font-body)}
.bar-row{display:grid;grid-template-columns:104px 1fr 86px;gap:var(--space-2);align-items:center;
  font-size:13px;padding:3px 0}
.bar-track{background:var(--grey-200);border-radius:3px;height:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px}

/* misc */
.banner{border-radius:var(--radius);padding:var(--space-3) var(--space-4);font-size:13px;
  display:flex;gap:var(--space-2);align-items:flex-start}
.banner.warn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px currentColor}
.banner.crit{background:var(--danger-bg);color:var(--danger);box-shadow:inset 0 0 0 1px currentColor}
.banner.info{background:var(--surface);color:var(--text-muted);border:1px solid var(--rule);
  box-shadow:var(--shadow-sm)}
.gate{max-width:440px;margin:var(--space-7) auto}
.modal{position:fixed;inset:0;background:rgba(24,30,32,.5);z-index:100;display:flex;
  align-items:flex-start;justify-content:center;padding:var(--space-6) var(--space-4);overflow-y:auto}
.modal .sheet{background:var(--surface);border:1px solid var(--divider);border-radius:var(--radius);
  width:100%;max-width:780px;box-shadow:var(--shadow-lg)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--grey-900);
  color:#fff;padding:9px 16px;border-radius:var(--radius);font-size:13px;font-weight:500;
  z-index:120;box-shadow:var(--shadow-lg)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3)}
.f2{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-3)}

@media(max-width:900px){
  #app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;
    border-right:0;border-bottom:1px solid var(--divider);padding:var(--space-2)}
  .brand{border-bottom:0;padding:var(--space-1) var(--space-2)}
  .brand .txt{display:none}
  .navgrp{padding:var(--space-1)}
  .navgrp .lbl{display:none}
  .nav{flex-direction:row;flex-wrap:wrap}
  .railfoot{margin-top:0;border-top:0;padding:var(--space-1) var(--space-2)}
  .split,.f3,.f2{grid-template-columns:1fr}
  .content{padding:var(--space-4)}
  h2{font-size:24px} .stat .v{font-size:26px}
}
/* the printable VRF form */
#printArea{display:none}
.vrfdoc{background:#fff;color:#111;font-family:var(--font-body);padding:14mm 12mm;max-width:210mm;margin:0 auto}
.vrfdoc .vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  border-bottom:2px solid #111;padding-bottom:8px}
.vrfdoc .vco{font-family:var(--font-heading);font-weight:700;font-size:16px;letter-spacing:.02em;line-height:1.2}
.vrfdoc .vaddr{font-size:10px;color:#444;margin-top:2px}
.vrfdoc .vtitle{font-family:var(--font-heading);font-weight:700;font-size:20px;letter-spacing:.14em;
  text-transform:uppercase;text-align:right;line-height:1}
.vrfdoc .vno{font-family:var(--font-mono);font-size:22px;font-weight:600;text-align:right;margin-top:4px}
.vrfdoc .vno small{display:block;font-family:var(--font-body);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:#555;font-weight:400}
.vrfdoc .vmeta{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 14px;margin:12px 0 10px}
.vrfdoc .vmeta .k{font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:#666}
.vrfdoc .vmeta .v{font-size:11.5px;font-weight:600;border-bottom:1px solid #bbb;padding-bottom:2px;min-height:16px}
.vrfdoc table{width:100%;border-collapse:collapse;font-size:10px;margin-top:4px}
.vrfdoc th{background:#f0f0f0;border:1px solid #999;padding:4px 5px;font-family:var(--font-heading);
  font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:#333;text-align:left}
.vrfdoc td{border:1px solid #bbb;padding:4px 5px;vertical-align:top}
.vrfdoc td.n{text-align:right;font-family:var(--font-mono);white-space:nowrap}
.vrfdoc .scoperow td{background:#f7f7f7;font-family:var(--font-heading);font-weight:700;
  font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.vrfdoc .vtot{display:flex;justify-content:flex-end;gap:14px;align-items:baseline;margin-top:8px;
  font-family:var(--font-mono);font-size:14px;font-weight:600}
.vrfdoc .vsig{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
.vrfdoc .vsig .line{border-bottom:1px solid #111;height:30px}
.vrfdoc .vsig .nm{font-size:10.5px;font-weight:700;margin-top:3px}
.vrfdoc .vsig .rl{font-size:9px;color:#555}
.vrfdoc .vsig .cap{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#666}
.vrfdoc .vph{margin-top:14px;page-break-before:always}
.vrfdoc .vph h4{font-family:var(--font-heading);font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;border-bottom:1px solid #111;padding-bottom:3px;margin-bottom:8px}
.vrfdoc .vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.vrfdoc .vgrid figure{margin:0;break-inside:avoid}
.vrfdoc .vgrid img{width:100%;border:1px solid #999;display:block}
.vrfdoc .vgrid figcaption{font-size:9px;color:#444;margin-top:3px}
.vrfdoc .vfoot{margin-top:10px;font-size:8.5px;color:#666;border-top:1px solid #ddd;padding-top:5px}

/* photo strip in the app */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:var(--space-2)}
.pcell{border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.pcell img{width:100%;height:104px;object-fit:cover;display:block;cursor:zoom-in;background:var(--grey-200)}
.pcell .cap{padding:5px 6px;font-size:11px;color:var(--text-muted);line-height:1.3}
.lightbox{position:fixed;inset:0;background:rgba(10,12,14,.9);z-index:140;display:flex;
  align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain}

@media print{
  .rail,.topbar,.noprint,.btn{display:none!important}
  body.printing>*{display:none!important}
  body.printing>#printArea{display:block!important}
  #printArea{display:none}
  @page{size:A4;margin:0}
  #app{display:block}
  body{background:#fff;font-size:11pt}
  .content{max-width:none;padding:0}
  .card,.stat{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
}
</style>

<div id="app">

<script>
(function(){

/* Shown on the Ask screen, so a screenshot says which version someone is on. */

var DAY = 86400000, MO = 30.44;

/* Part categories that were entered under two spellings and so split a unit's
   history in the sheet. Left side is what staff typed; right side is the catalog. */
var CAT_ALIAS = {
  "Engine Oil":"Engine / Gear Oil",
  "Fan / Belt / Water Pump":"Fan / Belt / Pumps",
  "Hydraulic Hose / Hydraulic Line":"Hydraulic Hose / Hydraulic Line / Hydravaux",

};
/* Fuel-reserve withdrawals were tagged with site nicknames, the ledger with
   project codes. Only pairs confirmed from the data are mapped; the rest are
   reported in Data Health rather than guessed. */
var PROJ_ALIAS = {
  "Labangon - LP Balaga":"26HH0083 - Labangon",
  "26HH0083 - Labangon Rd.":"26HH0083 - Labangon",
  "CTU Ved Med":"CTU-Barili Vet Med",
  "CTU Dumanjug":"CTU-Dumanjug HM3",
  "UP She Shelter":"UP- She Shelter",
  "Tagbao FMR P3":"26HH0078 - Tagbao FMR P3"
};

/* ============================ state ============================ */
var S = {
  vehicles:[], parts:[], suppliers:[], projects:[], drivers:[], worktypes:[], ambig:[], items:[],
  purchases:[], withdrawals:[], ledger:{}, breakdowns:[], mechanic:[], tasks:[], papers:[],
  cfg:{nextVrf:5793, pass:null, varianceTol:0.10, nextReserve:1}, sample:null, chat:[], asking:false, voiceOut:true, voiceLang:"en-PH", hearing:false, micBlocked:false, ttsReady:false,
  voiceName:"", voices:[], photoCounts:{}, reserves:[], rsvYears:[], lens:"job", selUnit:"", selCat:"", selWork:"", regWork:"", regUnit:"", regSrc:"", regStatus:"", logQ:"",
  view:"yard", office:false, db:null, ready:false, sel:null, draft:null, stale:false,
  hist:[]
};
var SID = "s"+Math.random().toString(36).slice(2,9);

/* ============================ utils ============================ */
function $(s,r){return (r||document).querySelector(s);}
function el(t,c,txt){var e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});}
function peso(n){ if(n==null||isNaN(n)) return "—";
  return "₱ "+Number(n).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pesoK(n){ if(n==null||isNaN(n)) return "—";
  if(Math.abs(n)>=1e6) return "₱ "+(n/1e6).toFixed(2)+"M";
  if(Math.abs(n)>=1e3) return "₱ "+(n/1e3).toFixed(0)+"k";
  return "₱ "+Math.round(n); }
function litres(n){ return (n==null||isNaN(n))?"—":Number(n).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})+" L"; }
function nnum(n,d){ if(n==null||isNaN(n))return "—";
  return Number(n).toLocaleString("en-PH",{minimumFractionDigits:d==null?0:d,maximumFractionDigits:d==null?0:d}); }
/* local-date ISO: never build this from UTC getters, it shifts the day */
function iso(d){ d=d||new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseDate(s){
  if(!s) return null;
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(s));
  if(m) return new Date(+m[3],+m[1]-1,+m[2]);
  return null;
}
function daysSince(s){ var d=parseDate(s); return d? Math.floor((Date.now()-d.getTime())/DAY) : null; }
function monthKey(s){ var d=parseDate(s); return d? d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0") : null; }
function monthLabel(k){ var p=String(k).split("-");
  return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1]+" "+p[0]; }
function normCat(c){ c=(c||"").trim(); return CAT_ALIAS[c]||c; }
function normProj(p){ p=(p||"").trim(); return PROJ_ALIAS[p]||p; }
/* Only actual fuel — "Fuel — Diesel", "Fuel — Gasoline". The old test was
   /^Fuel\b/ which also matched "Fuel Filter", so a filter on a change-oil VRF
   was read as a tank of diesel: it triggered the fuel gate, demanded a reserve,
   was classified as a station purchase, and was counted as one litre in the
   consumption maths. The dash is what separates the two. */
function isFuel(c){ return /^\s*fuel\s*[—–-]/i.test(c||""); }

/* ---------- work types ----------
   A VRF says WHAT WAS BOUGHT on each line but, until now, never WHY it was
   raised. Twenty-seven "Labor — General Mechanical" lines and seventeen
   "Bolts / Screws / Nuts" lines cannot tell you whether the unit had a change
   oil or an aircon repair. The work type is that missing header: one job per
   VRF, overridable per line for the odd mixed form. Anything the portal works
   out for itself is marked as inferred and never presented as recorded. */
function workBy(code){
  for(var i=0;i<S.worktypes.length;i++) if(S.worktypes[i].code===code) return S.worktypes[i];
  return null;
}
function workName(code){ var w=workBy(code); return w?w.name:(code||"—"); }
function isAmbiguous(cat){ return S.ambig.indexOf(normCat(cat))>=0; }

/* Score the work types on one VRF and hand every LINE a scope of its own.
   A VRF routinely covers more than one job — VRF 5599 on SV-01 is a change oil
   AND an aircon repair AND shock mounting AND belts — so the unit of work is
   the line, not the form.

   Two signals, because the part category alone is not enough: "Labor — General
   Mechanical / Cleaning AC" carries the whole answer in the ITEM NAME. Key
   category wins, then the longest matching keyword in the item text (so
   "expansion valve" beats a bare "valve"), then supporting materials attach to
   whatever the VRF is mostly about. Labour, fasteners and tape score nothing —
   that is precisely why they can never classify a VRF on their own. */
function scopeOfLine(r,keyOwner,wordIdx){
  var c=normCat(r.cat);
  if(keyOwner[c]&&keyOwner[c].length) return {codes:keyOwner[c],how:"category "+c,strong:true};
  var hay=((r.item||"")+" "+(r.notes||"")).toLowerCase();
  var best=null;
  wordIdx.forEach(function(e){
    if(hay.indexOf(e.word)<0) return;
    if(!best||e.word.length>best.word.length) best={code:e.code,word:e.word};
  });
  if(best) return {codes:[best.code],how:'"'+best.word+'" in the description',strong:true};
  return null;
}
function inferScopes(rows){
  var lineWork=new Array(rows.length), lineWhy=new Array(rows.length), pending=[], fallback=0;
  rows.forEach(function(r,i){
    if(r.supplier==="FUEL RESERVE"){ lineWork[i]="FUEL-RES"; lineWhy[i]="drawn from the reserve"; return; }
    if(r.veh==="AV"){ lineWork[i]="STOCK"; lineWhy[i]="coded AV"; return; }
    if(isFuel(r.cat)){ lineWork[i]="FUEL-STN"; lineWhy[i]="fuel line"; return; }
    pending.push(i);
  });
  var keyOwner={}, supOwner={}, wordIdx=[];
  S.worktypes.forEach(function(w){
    (w.key||[]).forEach(function(k){ (keyOwner[normCat(k)]=keyOwner[normCat(k)]||[]).push(w.code); });
    (w.cats||[]).forEach(function(k){ (supOwner[normCat(k)]=supOwner[normCat(k)]||[]).push(w.code); });
    (w.words||[]).forEach(function(t){ wordIdx.push({code:w.code,word:String(t).toLowerCase()}); });
  });
  var votes={};
  pending.forEach(function(i){
    var m=scopeOfLine(rows[i],keyOwner,wordIdx);
    if(m) m.codes.forEach(function(c){ votes[c]=(votes[c]||0)+1; });
  });
  var dom=null;
  Object.keys(votes).forEach(function(c){ if(!dom||votes[c]>votes[dom]) dom=c; });
  pending.forEach(function(i){
    var m=scopeOfLine(rows[i],keyOwner,wordIdx);
    if(!m) return;
    var best=m.codes[0];
    m.codes.forEach(function(c){ if((votes[c]||0)>(votes[best]||0)) best=c; });
    /* greasing inside a change oil is part of the change oil, not a second job */
    var c0=normCat(rows[i].cat);
    if(dom&&dom!==best&&(supOwner[c0]||[]).indexOf(dom)>=0&&(votes[dom]||0)>(votes[best]||0)) best=dom;
    lineWork[i]=best; lineWhy[i]=m.how;
  });
  pending.forEach(function(i){
    if(lineWork[i]) return;
    var c=normCat(rows[i].cat), sup=supOwner[c]||[], b=null;
    sup.forEach(function(o){ if(votes[o]&&(!b||votes[o]>votes[b])) b=o; });
    if(b){ lineWork[i]=b; lineWhy[i]="supports the "+workName(b); return; }
    if(dom){ lineWork[i]=dom; lineWhy[i]="no job of its own — put with the "+workName(dom); fallback++; return; }
    lineWork[i]="UNCLASS"; lineWhy[i]="names no job";
  });
  var unresolved=lineWork.filter(function(c){ return c==="UNCLASS"; }).length;
  var why;
  if(unresolved===rows.length) why="nothing on this VRF names a job — only labour, fasteners or consumables";
  else if(fallback) why=fallback+" line"+(fallback>1?"s":"")+" name no job of their own";
  else why="every line names its own job";
  return {lineWork:lineWork, lineWhy:lineWhy,
    confidence: unresolved===rows.length?"none":fallback?"medium":"high", why:why};
}

/* One entry per VRF, plus the per-line scope map every screen reads from. */
var _vrfs=null, _lw=null;
function buildIndex(){
  if(_vrfs) return;
  _lw=new Map();
  var by={};
  allLines().forEach(function(r){
    var k=r.vrf||("no-vrf-"+r.date+"-"+r.veh);
    (by[k]=by[k]||[]).push(r);
  });
  _vrfs=Object.keys(by).map(function(k){
    var rows=by[k];
    rows.sort(function(a,b){ return (parseDate(a.date)||0)-(parseDate(b.date)||0); });
    var inf=inferScopes(rows);
    var works=[], seen={}, nConf=0;
    rows.forEach(function(r,i){
      var conf=!!r.work;
      var codeV=r.work||inf.lineWork[i]||"UNCLASS";
      if(conf) nConf++;
      _lw.set(r,{work:codeV,confirmed:conf,why:conf?"entered on the VRF":(inf.lineWhy[i]||"")});
      if(!seen[codeV]){ seen[codeV]=1; works.push(codeV); }
    });
    var scopes=works.map(function(codeV){
      var rs=rows.filter(function(r){ return _lw.get(r).work===codeV; });
      return {code:codeV, name:workName(codeV), rows:rs,
        confirmed: rs.every(function(r){ return _lw.get(r).confirmed; }),
        total: rs.reduce(function(a,r){ return a+(r.total||0); },0)};
    });
    var units={}; rows.forEach(function(r){ if(r.veh) units[r.veh]=1; });
    /* Every movement is a VRF, and a VRF has a life: raised → liquidated → closed.
       Rows carried in from the old workbooks have no status at all; they are
       history, not a backlog, so they are marked legacy and never chased. */
    var st=null, liq=null, reserve="";
    rows.forEach(function(r){
      if(!st&&r.vstatus) st=r.vstatus;
      if(!liq&&r.liq) liq=r.liq;
      if(!reserve&&r.reserve) reserve=String(r.reserve);
    });
    return {vrf:k, date:rows[0].date, month:rows[0].month, rows:rows,
      status: st||"Legacy", legacy:!st, liq:liq, reserve:reserve,
      units:Object.keys(units), veh:rows[0].veh,
      works:works, scopes:scopes, multi:works.length>1,
      confirmed:nConf===rows.length, partial:nConf>0&&nConf<rows.length,
      confidence: nConf===rows.length?"confirmed":inf.confidence,
      why: nConf===rows.length?"":inf.why,
      total: rows.reduce(function(a,r){ return a+(r.total||0); },0),
      project: rows[0].project, notes: rows[0].notes, src: rows[0].src||""};
  }).sort(function(a,b){ return (parseDate(b.date)||0)-(parseDate(a.date)||0); });
}
function vrfIndex(){ buildIndex(); return _vrfs; }
function vrfByNo(no){
  var vi=vrfIndex();
  for(var i=0;i<vi.length;i++) if(String(vi[i].vrf)===String(no)) return vi[i];
  return null;
}
function openVrfs(){ return vrfIndex().filter(function(v){ return v.status==="Open"; }); }
/* A VRF closes against evidence when it spends a fuel reserve; the photos live
   on the VRF, which is where finance looks for them. */
function vrfEvidence(v){
  var r=v.reserve?reserveBy(v.reserve):null;
  var need = r ? needsEvidence(r) : v.rows.some(function(x){ return isFuel(x.cat); });
  var n=photoCount(v.vrf);
  return {need:need,count:n,ok:!need||n>0};
}
/* Liquidating is where the estimate meets the receipt. Amounts move, a part
   turns out to have come from someone else, and small things get picked up
   along the way — so lines can be corrected, dropped and added here, all under
   the one VRF. */
async function liquidateVrf(entry,edits,added,by,note){
  var stamp={at:iso(),by:by||"",note:note||""};
  var touched={};
  entry.rows.forEach(function(r,i){
    var mk=r.month, arr=S.ledger[mk]; if(!arr) return;
    var idx=arr.indexOf(r); if(idx<0) return;
    var e=edits[i]||{};
    if(e.remove){ arr.splice(idx,1); touched[mk]=1; return; }
    var qty=(e.qty!=null)?e.qty:r.qty;
    var price=(e.price!=null)?e.price:r.price;
    arr[idx]=Object.assign({},r,{
      qty:qty, price:price,
      supplier:(e.supplier!=null)?e.supplier:r.supplier,
      total:(qty!=null&&price!=null)?qty*price:r.total,
      vstatus:"Closed", liq:stamp});
    touched[mk]=1;
  });
  if(added&&added.length){
    var base=entry.rows[0]||{};
    var mk0=base.month||monthKey(entry.date)||iso().slice(0,7);
    var v=vehicle(entry.veh);
    var extra=added.filter(function(a2){ return a2.cat; }).map(function(a2){
      var sp=partSpec(a2.cat);
      var qty=parseFloat(a2.qty)||0, price=parseFloat(a2.price)||0;
      return {month:mk0, date:entry.date, vrf:String(entry.vrf), veh:entry.veh,
        name:v?v.desc:(base.name||""),
        cat:a2.cat, sub:sp?sp.sub:(isFuel(a2.cat)?"Fuel":""),
        grp:isFuel(a2.cat)?"Fuel":"Maintenance",
        work:a2.work||base.work||"", item:a2.item||"",
        qty:qty, price:price, total:qty*price,
        supplier:a2.supplier||"", unit:a2.unit||"pc",
        project:base.project||"", liters:parseFloat(a2.liters)||null,
        odo:base.odo||null, reserve:base.reserve||"",
        vstatus:"Closed", liq:stamp, addedAtLiquidation:true,
        notes:base.notes||""};
    });
    if(extra.length){ S.ledger[mk0]=(S.ledger[mk0]||[]).concat(extra); touched[mk0]=1; }
  }
  for(var mk in touched){
    if(!touched.hasOwnProperty(mk)) continue;
    await writeDoc("ledger/"+mk,{month:mk,rows:S.ledger[mk]});
  }
  _vrfs=null; _lw=null; _cons=null; _inv=null;
  if(entry.reserve) await settleReserve(entry.reserve);
}

/* Approving IS the VRF. The held number goes live the moment the office says
   yes, with the requested lines already on it, so the yard does the work and
   liquidates — there is no second approval to wait for. */
async function postReserveVrf(r){
  if((r.vrfs||[]).length) return String(r.vrfs[0]);
  var lines=(r.draftLines||[]).filter(function(l){ return l.cat; });
  if(!lines.length) return null;
  var no=r.vrfNo||String(await claimVrf());
  var mk=monthKey(r.date)||iso().slice(0,7);
  var v=vehicle(r.veh);
  var rows=lines.map(function(l){
    var sp=partSpec(l.cat);
    var qty=parseFloat(l.qty)||0, price=parseFloat(l.price)||0;
    return {month:mk, date:r.date||iso(), vrf:String(no), veh:r.veh, name:v?v.desc:"",
      cat:l.cat, sub:sp?sp.sub:(isFuel(l.cat)?"Fuel":""),
      grp:isFuel(l.cat)?"Fuel":"Maintenance",
      work:l.work||r.work||"", item:l.item||"", qty:qty, price:price, total:qty*price,
      supplier:l.supplier||"", unit:l.unit||"pc", project:r.project||"",
      liters:parseFloat(l.liters)||null,
      odo:parseFloat(String(r.draftOdo||"").replace(/,/g,""))||null,
      reserve:String(r.no), vstatus:"Open",
      notes:r.draftPurpose||r.scope||""};
  });
  await appendLedger(mk,rows);
  return String(no);
}

/* When every VRF against a reserve is closed, the reserve settles itself. */
async function settleReserve(no){
  var r=reserveBy(no); if(!r||r.status!=="Approved") return;
  var linked=(r.vrfs||[]).map(vrfByNo).filter(Boolean);
  if(!linked.length) return;
  if(linked.some(function(v){ return v.status==="Open"; })) return;
  var actual=linked.reduce(function(a,v){ return a+v.total; },0);
  var rv=reserveVariance(Object.assign({},r,{actual:actual}));
  r.actual=actual; r.liquidatedAt=iso();
  r.status = rv.over ? "Flagged" : "Closed";
  await saveReserves();
}
function lineWork(r){ buildIndex(); var e=_lw.get(r); return e?e.work:"UNCLASS"; }
function lineConfirmed(r){ buildIndex(); var e=_lw.get(r); return e?!!e.confirmed:false; }
function lineWhy(r){ buildIndex(); var e=_lw.get(r); return e?e.why:""; }

/* Every VRF on which one job was carried out — matched on any of its scopes. */
function jobHistory(code,work){
  return vrfIndex().filter(function(v){
    if(work && v.works.indexOf(work)<0) return false;
    if(code){
      if(v.units.indexOf(code)<0) return false;
      if(work){
        var sc=v.scopes.filter(function(x){ return x.code===work; })[0];
        if(sc && !sc.rows.some(function(r){ return r.veh===code; })) return false;
      }
    }
    return true;
  });
}
function jobsForUnit(code){
  var m={};
  vrfIndex().forEach(function(v){
    v.scopes.forEach(function(sc){
      if(sc.code==="FUEL-STN"||sc.code==="FUEL-RES"||sc.code==="STOCK") return;
      if(!sc.rows.some(function(r){ return r.veh===code; })) return;
      var d=parseDate(v.date); if(!d) return;
      if(!m[sc.code]) m[sc.code]={work:sc.code,times:0,last:d,vrf:v.vrf,confirmed:sc.confirmed};
      m[sc.code].times++;
      if(d>m[sc.code].last){ m[sc.code].last=d; m[sc.code].vrf=v.vrf; m[sc.code].confirmed=sc.confirmed; }
    });
  });
  return Object.keys(m).map(function(k){
    var e=m[k], w=workBy(k), iv=w&&w.intervalMo;
    var ago=Math.floor((Date.now()-e.last.getTime())/DAY);
    return {work:k, name:workName(k), family:w?w.family:"", times:e.times,
      last:iso(e.last), ago:ago, vrf:e.vrf, confirmed:e.confirmed,
      intervalMo:iv||null, due: iv? ago>=iv*MO : null};
  }).sort(function(a,b){ return b.ago-a.ago; });
}

function toast(msg){
  var t=el("div","toast",msg); document.body.appendChild(t);
  setTimeout(function(){ t.remove(); },2600);
}
function allLines(){
  var out=[], k;
  for(k in S.ledger){ if(S.ledger.hasOwnProperty(k)) out=out.concat(S.ledger[k]); }
  return out;
}
function vehicle(code){
  for(var i=0;i<S.vehicles.length;i++) if(S.vehicles[i].code===code) return S.vehicles[i];
  return null;
}
function partSpec(cat){
  cat=normCat(cat);
  for(var i=0;i<S.parts.length;i++) if(normCat(S.parts[i].cat)===cat) return S.parts[i];
  return null;
}
function months(n){
  var v=parseFloat(n); return (isFinite(v)&&v>0)?v:null;   /* "as needed"/"service"/"" -> null */
}

/* ============================ persistence ============================ */
var PATHS = {
  vehicles:"master/vehicles", parts:"master/parts", suppliers:"master/suppliers",
  projects:"master/projects", drivers:"master/drivers", worktypes:"master/worktypes",
  items:"master/items",
  purchases:"fuel/purchases", withdrawals:"fuel/withdrawals",
  breakdowns:"ops/breakdowns", mechanic:"ops/mechanic", tasks:"ops/tasks",
  photoIdx:"ops/photoindex", papers:"ops/papers", cfg:"config/app"
};

function lsGet(k,f){ try{ var v=localStorage.getItem("mp_"+k); return v?JSON.parse(v):f; }catch(e){ return f; } }
function lsSet(k,v){ try{ localStorage.setItem("mp_"+k,JSON.stringify(v)); }catch(e){} }

async function boot(){
  try{ S.db = await claude.use("db"); }catch(e){ S.db=null; }
  try{ S.sample = await claude.use("sample"); }catch(e){ S.sample=null; }
  $("#dbBadge").textContent = S.db ? "shared" : "local";
  $("#dbBadge").className = (S.db ? "chip ok" : "chip mute");
  await loadAll();
  S.ready=true;
  $("#syncNote").textContent = S.db
    ? "Shared workbook · live"
    : "This device only — shared storage unavailable";
  if(S.db) watch();
  render();
  /* Banner compare is not needed for the first paint. Running it in the
     same turn as yardView() (full VRF index) made the tab look frozen, and
     writing #buildBanner from here used to trip the host MutationObserver. */
  setTimeout(checkBuild, 0);
  /* Outside Claude (a plain web host) there is no claude runtime at all: the page
     runs on this device's storage, with no shared records and no assistant. */
  if(typeof claude!=="undefined"&&claude&&typeof claude.use==="function"){
    claude.use("sample").then(function(fn){ S.sample=fn; if(S.ready) buildNav(); },function(){});
  }
}

/* An open page never learns on its own that a newer version was published, and
   the in-page Refresh only re-reads records — so staff kept asking questions of an
   old copy. Every publish ADDS one record to builds/ ({build, seq}); a record is never
   overwritten, because a publish can create a record but not change an existing one.
   The page takes the highest seq and says so if it is not this page's own BUILD. */
function checkBuild(){
  if(!S.db) return;
  function hide(){
    var b=$("#buildBanner"); if(!b) return;
    b.hidden=true;
    try{ b.style.setProperty("display","none","important"); }catch(e){}
  }
  function rowsOf(snap){
    return ((snap&&snap.docs)||[]).map(function(d){
      try{ return typeof d.data==="function"?d.data():d; }catch(e){ return null; } });
  }
  function apply(rows){
    var best=null;
    (rows||[]).forEach(function(d){
      if(d&&d.build&&(!best||(+d.seq||0)>(+best.seq||0))) best=d; });
    var b=$("#buildBanner"); if(!b) return;
    var mine=String(BUILD||"").trim();
    var latest=best&&best.build!=null?String(best.build).trim():"";
    var behind=!!(mine&&latest&&latest!==mine);
    var mineEl=$("#buildMine"), latestEl=$("#buildLatest");
    if(behind&&mineEl&&latestEl){
      mineEl.textContent=mine;
      latestEl.textContent=latest;
      try{ b.style.removeProperty("display"); }catch(e){}
      b.hidden=false;
    }else{
      hide();
    }
  }
  try{
    var col=S.db.collection("builds");
    col.get().then(function(s){ apply(rowsOf(s)); },function(){ hide(); });
    col.onSnapshot(function(s){ apply(rowsOf(s)); },function(){ hide(); });
  }catch(e){ hide(); }
}

/* The store hands back FROZEN documents — its snapshots are shared, immutable
   objects. Anything we intend to edit in place (a reserve being approved, a
   ledger line being liquidated) has to be our own copy, or the assignment
   throws inside an async handler and the button silently does nothing. */
function thaw(v){ return v==null ? v : JSON.parse(JSON.stringify(v)); }
async function readDoc(path){
  if(!S.db) return lsGet(path,null);
  try{ var s = await S.db.doc(path).get(); return s.exists ? thaw(s.data()) : null; }
  catch(e){ return lsGet(path,null); }
}
async function writeDoc(path,body){
  lsSet(path,body);
  if(!S.db) return;
  try{ await S.db.doc(path).set(body); }
  catch(e){ toast("Could not save to the shared workbook — kept on this device."); }
}

async function loadAll(){
  var keys=["vehicles","parts","suppliers","projects","drivers","worktypes","items","purchases","withdrawals","breakdowns","mechanic","tasks","papers"];
  var got = await Promise.all(keys.map(function(k){ return readDoc(PATHS[k]); }));
  keys.forEach(function(k,i){ S[k] = (got[i]&&got[i].rows)||[]; });
  var rix = await readDoc("reserves/index");
  var yrs = (rix&&rix.years)||[String(new Date().getFullYear())];
  var rdocs = await Promise.all(yrs.map(function(y){ return readDoc("reserves/"+y); }));
  S.rsvYears=yrs;
  S.reserves=[];
  rdocs.forEach(function(dd){ if(dd&&dd.rows) S.reserves=S.reserves.concat(dd.rows); });
  var pix = await readDoc(PATHS.photoIdx);
  S.photoCounts=(pix&&pix.counts)||{};
  var wt = await readDoc(PATHS.worktypes);
  S.ambig = (wt&&wt.ambiguous)||[];
  var cfg = await readDoc(PATHS.cfg);
  if(cfg) S.cfg = {nextVrf: cfg.nextVrf||5793, pass: cfg.pass||null, fuel: cfg.fuel||null,
    varianceTol: (typeof cfg.varianceTol==="number")?cfg.varianceTol:VARIANCE_TOL_DEFAULT,
    nextReserve: cfg.nextReserve||1, driveFolder: cfg.driveFolder||""};
  /* ledger months live in their own documents so no single doc grows unbounded */
  var idx = await readDoc("ledger/index");
  var mks = (idx&&idx.months)||["2026-05","2026-06","2026-07","2026-08","2026-09"];
  var docs = await Promise.all(mks.map(function(m){ return readDoc("ledger/"+m); }));
  S.ledger={};
  mks.forEach(function(m,i){ S.ledger[m]=(docs[i]&&docs[i].rows)||[]; });
}

/* Screens where someone may be typing. A live update must never wipe a
   half-filled form, so on these the change is banked and a pill appears
   instead of a silent re-render. */
var ENTRY_VIEWS={vrf:1,rsv:1,down:1,tasks:1,fuel:1};
function markStale(){
  S.stale=true;
  var b=$("#staleBtn"); if(b) b.hidden=false;
}
function liveRender(){
  if(!S.ready) return;
  if(document.querySelector(".modal")||ENTRY_VIEWS[S.view]){ markStale(); return; }
  render();
}
function watch(){
  ["breakdowns","mechanic","tasks","withdrawals"].forEach(function(k){
    try{
      S.db.doc(PATHS[k]).onSnapshot(function(snap){
        if(!snap.exists) return;
        var d=snap.data();
        if(d&&d.rows&&!snap.metadata.hasPendingWrites){
          S[k]=thaw(d.rows);
          if(k==="withdrawals") _cons=null;
          liveRender();
        }
      }, function(){});
    }catch(e){}
  });
  /* Reserves are the one queue two people watch from different devices — the
     yard raises, the office approves — so they have to arrive without a reload. */
  (S.rsvYears||[]).forEach(function(y){
    try{
      S.db.doc("reserves/"+y).onSnapshot(function(snap){
        if(!snap.exists||snap.metadata.hasPendingWrites) return;
        var d=snap.data(); if(!d||!d.rows) return;
        var others=S.reserves.filter(function(r){
          return String((parseDate(r.date)||new Date()).getFullYear())!==String(y); });
        S.reserves=others.concat(thaw(d.rows));
        liveRender();
      }, function(){});
    }catch(e){}
  });
  try{
    S.db.doc(PATHS.photoIdx).onSnapshot(function(snap){
      if(!snap.exists||snap.metadata.hasPendingWrites) return;
      var d=snap.data();
      if(d&&d.counts){ S.photoCounts=thaw(d.counts); liveRender(); }
    }, function(){});
  }catch(e){}
}

/* Everything else — the ledger months, the master lists — is re-read on demand. */
async function refreshAll(btn){
  if(btn){ btn.disabled=true; btn.textContent="Reading…"; }
  try{ await loadAll(); }catch(e){}
  _vrfs=null; _lw=null; _cons=null; _oil=null;
  S.stale=false;
  var sb=$("#staleBtn"); if(sb) sb.hidden=true;
  if(btn){ btn.disabled=false; btn.textContent="↻ Refresh"; }
  render();
