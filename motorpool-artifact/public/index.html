    if(d.vehicle) byVeh[d.vehicle]=byVeh[d.vehicle]||{L:0,c:0};
    if(d.vehicle){ byVeh[d.vehicle].L+=d.liters; byVeh[d.vehicle].c+=d.fifoCost; }
    var p=normProj(d.project);
    if(p){
      var known=S.projects.some(function(x){return x.code===p;});
      if(!known) unmapped[d.project]=(unmapped[d.project]||0)+d.liters;
      byProj[p]=byProj[p]||{L:0,c:0};
      byProj[p].L+=d.liters; byProj[p].c+=d.fifoCost;
    }
  });
  var tv=Object.keys(byVeh).map(function(k){return [k,byVeh[k].c];})
    .sort(function(a,b){return b[1]-a[1];}).slice(0,12);
  var tp=Object.keys(byProj).map(function(k){return [k,byProj[k].c];})
    .sort(function(a,b){return b[1]-a[1];}).slice(0,10);
  var sp=el("div","split");
  sp.appendChild(card("Reserve fuel by unit","FIFO cost, top 12",barList(tv,f.costOfUse,"var(--s2)")));
  sp.appendChild(card("Reserve fuel by project","FIFO cost",barList(tp,f.costOfUse,"var(--s4)")));
  g.appendChild(sp);

  var un=Object.keys(unmapped);
  if(un.length){
    var bn=el("div","banner warn");
    bn.innerHTML="<b>"+un.length+" site name"+(un.length>1?"s":"")+" on withdrawals do not match a project code</b> — "+
      esc(un.slice(0,4).join(", "))+(un.length>4?" and "+(un.length-4)+" more":"")+
      ". Their litres are costed but land outside the project split. Add them to the project list or correct the tag.";
    g.appendChild(bn);
  }

  g.appendChild(card("Delivery lots","oldest first · what is left of each",
    table([
      {h:"Received",get:function(r){return r.date;}},
      {h:"VRF",get:function(r){return r.vrf||"—";}},
      {h:"Price / L",num:true,get:function(r){return "₱ "+r.rate.toFixed(2);}},
      {h:"Remaining",num:true,get:function(r){return nnum(r.left,2)+" L";}},
      {h:"Value left",num:true,get:function(r){return peso(r.left*r.rate);}},
      {h:"",get:function(r){ return el("span","chip "+(r.left>0.01?"ok":"mute"),r.left>0.01?"open":"drawn down"); }}
    ],f.lots,{empty:"No deliveries recorded."})));
  w.appendChild(g);
  return w;
}

function consumeView(){
  var C=consumption().filter(function(c){ return c.n>0; });
  var road=C.filter(function(c){ return c.meter==="km"; }).sort(function(a,b){ return a.avg-b.avg; });
  var eq=C.filter(function(c){ return c.meter==="hr"; }).sort(function(a,b){ return b.avg-a.avg; });
  var fk=fleetAvg("km"), fh=fleetAvg("hr");
  var w=el("div");
  w.appendChild(pageHead("Office · Consumption","What each unit burns",
    "Worked out fill to fill: the fuel put in at one stop is what carried the unit to the next. Excavators, rollers and mixers run on an hour meter, so they are measured in litres per hour; everything that drives is measured in kilometres per litre. The two are never put on one scale."));
  var g=el("div","grid"); g.style.gap="var(--space-5)";

  var noMeter=consumption().filter(function(c){ return !c.n; }).length;
  g.appendChild(stats([
    ["Units measurable", String(C.length), noMeter+" more have fills but no usable meter readings"],
    ["Road fleet average", fk?fk.toFixed(2)+" km/L":"—", road.length+" units", true],
    ["Equipment average", fh?fh.toFixed(2)+" L/hr":"—", eq.length+" units", true],
    ["Intervals used", String(C.reduce(function(a,c){return a+c.n;},0)),
      C.reduce(function(a,c){return a+c.dropped;},0)+" dropped as unusable"]
  ]));

  function tbl(list,meter,worstFirst){
    var fa = meter==="km"?fk:fh;
    return table([
      {h:"Unit",get:function(c){ return el("span","mono",c.code); }},
      {h:"Description",get:function(c){ return (c.desc||"").slice(0,34)||"—"; }},
      {h:meterUnit(meter),num:true,get:function(c){
        var d=el("div");
        var v=el("div","mono",c.avg.toFixed(2)); v.style.fontWeight="600"; d.appendChild(v);
        var tr=el("div","bar-track"); tr.style.marginTop="3px";
        var fi=el("div","bar-fill");
        var mx=Math.max.apply(null,list.map(function(x){return x.avg;}));
        fi.style.width=Math.max(3,(c.avg/mx)*100)+"%";
        var bad = meter==="km" ? (fa&&c.avg<fa*0.7) : (fa&&c.avg>fa*1.4);
        fi.style.background=bad?"var(--warn)":"var(--accent)";
        tr.appendChild(fi); d.appendChild(tr);
        return d; }},
      {h:"vs fleet",num:true,get:function(c){
        if(!fa) return "—";
        var pct=((c.avg-fa)/fa)*100;
        var good = meter==="km" ? pct>=0 : pct<=0;
        var sp=el("span",null,(pct>0?"+":"")+pct.toFixed(0)+"%");
        sp.style.color=Math.abs(pct)<10?"var(--text-muted)":(good?"var(--ok)":"var(--warn)");
        return sp; }},
      {h:"Best",num:true,get:function(c){ return c.best.toFixed(2); }},
      {h:"Worst",num:true,get:function(c){ return c.worst.toFixed(2); }},
      {h:"Latest",num:true,get:function(c){ return c.latest.toFixed(2); }},
      {h:meter==="km"?"Cost / km":"Cost / hr",num:true,get:function(c){
        return c.costPer?peso(c.costPer):"—"; }},
      {h:"Intervals",num:true,get:function(c){
        return el("span","chip "+(c.reliable?"ok":"mute"),
          c.n+(c.reliable?"":" · thin")); }},
      {h:meter==="km"?"Km covered":"Hours run",num:true,get:function(c){ return nnum(c.distance); }},
      {h:"Litres",num:true,get:function(c){ return nnum(c.litres,0); }}
    ],list,{empty:"No unit of this kind has two fills with meter readings."});
  }

  var rc=el("div");
  if(fk){
    var n1=el("p","hint","Higher is better. Anything more than 30% under the fleet average is bar-flagged — that is the observation worth chasing, either a heavy right foot, a fault, or fuel going somewhere else.");
    n1.style.margin="0 0 var(--space-3)"; rc.appendChild(n1);
  }
  rc.appendChild(tbl(road,"km"));
  g.appendChild(card("Road units — kilometres per litre",
    road.length+" units · worst first",rc));

  var ec=el("div");
  if(fh){
    var n2=el("p","hint","Lower is better here — this is burn rate against hours run. A unit well above the fleet average is either working harder, idling far more, or leaking.");
    n2.style.margin="0 0 var(--space-3)"; ec.appendChild(n2);
  }
  ec.appendChild(tbl(eq,"hr"));
  g.appendChild(card("Equipment — litres per hour",
    eq.length+" units · thirstiest first",ec));

  var rules=fuelRules();
  var lim=el("div","card");
  var lh=el("div","hd"); lh.appendChild(el("h3",null,"Limits on a fuel request"));
  lh.appendChild(el("span","note","Applied on the VRF form and on a reserve dispense."));
  lim.appendChild(lh);
  var lb2=el("div","bd");
  var lr=el("div","f3");
  function lf2(l,n,h){ var x=el("div","field"); x.appendChild(el("label",null,l)); x.appendChild(n);
    if(h) x.appendChild(el("div","hint",h)); return x; }
  var tOver=el("input"); tOver.type="number"; tOver.min="0"; tOver.max="300"; tOver.step="5";
  tOver.value=Math.round(rules.overTol*100);
  var tBand=el("input"); tBand.type="number"; tBand.min="0"; tBand.max="300"; tBand.step="5";
  tBand.value=Math.round(rules.bandTol*100);
  var tKm=el("input"); tKm.type="number"; tKm.min="0"; tKm.step="1"; tKm.value=rules.minMove.km;
  lr.appendChild(lf2("Over-request allowance %",tOver,
    "How far above the litres its own average says it needs before the request is stopped."));
  lr.appendChild(lf2("Out-of-range allowance %",tBand,
    "How far outside the unit's own best-to-worst band a fill may land."));
  lr.appendChild(lf2("Minimum km before a refill",tKm,
    "Equipment uses "+rules.minMove.hr+" hours as its floor."));
  lb2.appendChild(lr);
  var lact=el("div","row"); lact.style.marginTop="var(--space-3)";
  var lsv=el("button","btn pri","Save limits");
  lsv.addEventListener("click",async function(){
    S.cfg.fuel={overTol:(parseFloat(tOver.value)||0)/100,
      bandTol:(parseFloat(tBand.value)||0)/100,
      minMove:{km:parseFloat(tKm.value)||0,hr:rules.minMove.hr},
      enabled:rules.enabled};
    await writeDoc(PATHS.cfg,{nextVrf:S.cfg.nextVrf,pass:S.cfg.pass,fuel:S.cfg.fuel,
      varianceTol:S.cfg.varianceTol,nextReserve:S.cfg.nextReserve,driveFolder:S.cfg.driveFolder||""});
    toast("Limits saved."); render();
  });
  var ltog=el("button","btn",rules.enabled?"Checks are on":"Checks are off");
  ltog.addEventListener("click",async function(){
    S.cfg.fuel=Object.assign({},rules,{enabled:!rules.enabled});
    await writeDoc(PATHS.cfg,{nextVrf:S.cfg.nextVrf,pass:S.cfg.pass,fuel:S.cfg.fuel,
      varianceTol:S.cfg.varianceTol,nextReserve:S.cfg.nextReserve,driveFolder:S.cfg.driveFolder||""});
    toast(S.cfg.fuel.enabled?"Fuel checks switched on.":"Fuel checks switched off.");
    render();
  });
  lact.appendChild(lsv); lact.appendChild(ltog);
  lb2.appendChild(lact);
  lim.appendChild(lb2);
  g.appendChild(lim);

  var ovr=[];
  allLines().forEach(function(r){ if(r.override) ovr.push(r); });
  S.withdrawals.forEach(function(x){ if(x.override) ovr.push(
    {date:x.date,vrf:x.vrf,veh:x.vehicle,liters:x.liters,override:x.override,cat:"Fuel — reserve"}); });
  ovr.sort(function(a,b){ return (parseDate(b.date)||0)-(parseDate(a.date)||0); });
  g.appendChild(card("Overrides","every fuel request let through past a stop",
    table([
      {h:"Date",get:function(r){return r.date;}},
      {h:"VRF",get:function(r){ return el("span","mono",r.vrf||"—"); }},
      {h:"Unit",get:function(r){ return el("span","mono",r.veh||"—"); }},
      {h:"Litres",num:true,get:function(r){ return r.liters!=null?nnum(r.liters,2):"—"; }},
      {h:"Stopped on",get:function(r){
        var d2=el("div"); d2.style.cssText="display:flex;flex-wrap:wrap;gap:3px";
        (r.override.codes||[]).forEach(function(c){ d2.appendChild(el("span","chip crit",c)); });
        return d2; }},
      {h:"Reason",get:function(r){return r.override.reason||"—";}},
      {h:"Note",get:function(r){return r.override.note||"—";}},
      {h:"Approved by",get:function(r){return (r.override.by||"—")+" · "+(r.override.at||"");}}
    ],ovr,{empty:"No fuel request has been overridden."})));

  var thin=C.filter(function(c){ return !c.reliable; });
  var nom=consumption().filter(function(c){ return !c.n; });
  if(thin.length||nom.length){
    var b=el("div","banner info");
    b.innerHTML="<b>Read these with care.</b> "+
      (thin.length?thin.length+" unit"+(thin.length>1?"s are":" is")+" working from fewer than three intervals. ":"")+
      (nom.length?nom.length+" unit"+(nom.length>1?"s have":" has")+" fuel logged but no usable meter readings — the odometer or hour meter was blank, marked NF, or went backwards. ":"")+
      "Recording the meter on every fuel VRF is what makes this table dependable.";
    g.appendChild(b);
  }
  w.appendChild(g);
  return w;
}

function planView(){
  var F=forecast();
  var w=el("div");
  w.appendChild(pageHead("Office · Maintenance plan","What falls due next",
    "Two separate questions. Due: the last replacement is older than the catalog lifespan. Replaced too soon: two replacements landed closer together than the alert window — which needs a pair of dates, not one."));
  var g=el("div","grid"); g.style.gap="16px";
  var over=F.filter(function(r){return r.status==="overdue";});
  var due=F.filter(function(r){return r.status==="due";});
  var soon=F.filter(function(r){return r.status==="due soon";});
  var soonRep=F.filter(function(r){return r.tooSoon!=null;});
  g.appendChild(stats([
    ["Overdue", String(over.length), "past 125% of lifespan", false, over.length?"var(--crit)":"var(--good)"],
    ["Due now", String(due.length), "past lifespan", false, due.length?"var(--warn)":"var(--good)"],
    ["Due soon", String(soon.length), "inside the last 20%"],
    ["Replaced too soon", String(soonRep.length), "a pair inside the alert window"],
    ["Tracked combinations", String(F.length), "unit × part with history"]
  ]));
  function statusChip(r){
    var m={overdue:["crit","Overdue"],due:["warn","Due"],"due soon":["mute","Due soon"],
      ok:["ok","OK"],tracked:["mute","No lifespan set"]};
    var s=m[r.status]||["mute",r.status];
    return el("span","chip "+s[0],s[1]);
  }
  var cols=[
    {h:"Unit",get:function(r){return r.veh;}},
    {h:"Part category",get:function(r){return r.cat;}},
    {h:"Last replaced",get:function(r){return r.last;}},
    {h:"Days ago",num:true,get:function(r){return nnum(r.ago);}},
    {h:"Lifespan",num:true,get:function(r){return r.lifeMo?r.lifeMo+" mo":"—";}},
    {h:"Times",num:true,get:function(r){return nnum(r.times);}},
    {h:"Status",get:statusChip},
    {h:"Last supplier",get:function(r){return r.supplier||"—";}},
    {h:"Last price",num:true,get:function(r){return r.price!=null?peso(r.price):"—";}}
  ];
  g.appendChild(card("Due and overdue",(over.length+due.length)+" items",
    table(cols,over.concat(due),{empty:"Nothing is past its lifespan."})));
  if(soon.length) g.appendChild(card("Coming up",soon.length+" items",table(cols,soon,{})));
  if(soonRep.length){
    g.appendChild(card("Replaced sooner than expected",soonRep.length+" combinations",
      table([
        {h:"Unit",get:function(r){return r.veh;}},
        {h:"Part category",get:function(r){return r.cat;}},
        {h:"Shortest gap",num:true,get:function(r){return r.tooSoon+" d";}},
        {h:"Alert window",num:true,get:function(r){return r.alertMo+" mo";}},
        {h:"Times replaced",num:true,get:function(r){return nnum(r.times);}},
        {h:"Last supplier",get:function(r){return r.supplier||"—";}}
      ],soonRep.sort(function(a,b){return a.tooSoon-b.tooSoon;}),
      {empty:"No part came back inside its window."})));
  }
  var noSpec=F.filter(function(r){return !r.lifeMo;});
  if(noSpec.length){
    var b=el("div","banner info");
    b.innerHTML="<b>"+noSpec.length+" combinations have no numeric lifespan</b> in the parts catalog "+
      "(“as needed”, “service”, “consumable” or blank). They are tracked but never fall due — "+
      "that is deliberate, not an error.";
    g.appendChild(b);
  }
  w.appendChild(g);
  return w;
}

function healthView(){
  var w=el("div");
  w.appendChild(pageHead("Office · Data health","What the numbers cannot answer yet",
    "Each row is a gap that makes a figure elsewhere wrong or incomplete. Fixing these is worth more than any new screen."));
  var g=el("div","grid"); g.style.gap="14px";
  var lines=allLines(), f=fifo();
  var issues=[];

  var noVrf=lines.filter(function(r){return !r.vrf;}).length;
  if(noVrf) issues.push(["Lines with no VRF number",noVrf,"Cannot be traced to a paper form or reconciled with finance.","crit"]);

  var noCat=lines.filter(function(r){return r.vrf&&!r.cat;}).length;
  if(noCat) issues.push(["Lines with no part category",noCat,"Fall out of the maintenance plan and the category rollups.","warn"]);

  var noSup=lines.filter(function(r){return r.vrf&&!r.supplier&&(r.total||0)>0;}).length;
  if(noSup) issues.push(["Priced lines with no supplier",noSup,"Missing from supplier price comparison.","warn"]);

  var codes={}; S.vehicles.forEach(function(v){codes[v.code]=1;});
  var ghost={};
  lines.forEach(function(r){ if(r.veh&&r.veh!=="AV"&&!codes[r.veh]) ghost[r.veh]=(ghost[r.veh]||0)+1; });
  var gk=Object.keys(ghost);
  if(gk.length) issues.push(["Unit codes not in the alpha list",gk.length,
    "Encoded as: "+gk.slice(0,6).join(", ")+(gk.length>6?"…":"")+". Their spend lands nowhere.","warn"]);

  var catalog={}; S.parts.forEach(function(p){catalog[normCat(p.cat)]=1;});
  var offCat={};
  lines.forEach(function(r){
    var c=normCat(r.cat);
    if(c&&!isFuel(c)&&!catalog[c]) offCat[c]=(offCat[c]||0)+1;
  });
  var ok=Object.keys(offCat);
  if(ok.length) issues.push(["Part categories not in the catalog",ok.length,
    ok.slice(0,5).join("; ")+(ok.length>5?"…":"")+". No lifespan, so they never fall due.","warn"]);

  if(f.shortfall>0.01) issues.push(["Litres dispensed with no delivery behind them",Math.round(f.shortfall),
    "Either a fuel delivery was never encoded or a withdrawal was entered twice. The FIFO valuation is understated until this clears.","crit"]);

  var unmappedProj={};
  S.withdrawals.forEach(function(d){
    var p=normProj(d.project);
    if(p && !S.projects.some(function(x){return x.code===p;})) unmappedProj[d.project]=1;
  });
  var upk=Object.keys(unmappedProj);
  if(upk.length) issues.push(["Withdrawal site names with no project code",upk.length,
    upk.slice(0,5).join("; ")+(upk.length>5?"…":"")+". Their fuel is costed but sits outside the per-project split.","warn"]);

  var vi=vrfIndex();
  var inferred=vi.filter(function(v){ return !v.confirmed; }).length;
  if(inferred) issues.push(["VRFs with no type of job entered",inferred,
    "The portal reads the job from the materials. That guess is right often but not always — it is the same assumption that made the old sheet unreliable. Confirm them on History → VRF register.","warn"]);
  var cannot=vi.filter(function(v){ return v.works.indexOf("UNCLASS")>=0; }).length;
  if(cannot) issues.push(["VRFs that cannot be classified at all",cannot,
    "Only labour, fasteners or consumables on the lines — nothing that names a job. These need a person to say what they were for.","crit"]);

  var repaired=lines.filter(function(r){ return r.dateFixed; }).length;
  if(repaired) issues.push(["Dates repaired on import",repaired,
    "In the legacy monthly tabs the day and month were swapped on these rows — a row on the JAN tab dated 2026-08-01 is 8 January, not 1 August. They were corrected only where swapping produced a date matching the tab's own month; the rest were left alone.","mute"]);

  var future=lines.filter(function(r){
    var d=parseDate(r.date); return d && d.getTime()>Date.now()+86400000; }).length;
  if(future) issues.push(["Lines dated in the future",future,
    "Almost certainly a typing slip in the source sheet. They inflate whatever period they land in.","warn"]);

  var noOwner=S.vehicles.filter(function(v){return !v.owner&&v.status!=="SOLD";}).length;
  if(noOwner) issues.push(["Units with no registered owner on file",noOwner,
    "Government and LGU bids ask for equipment documentation — these cannot be evidenced.","warn"]);

  var noPapers=S.vehicles.filter(function(v){
    return v.status!=="SOLD" && !v.cr && !v.orno; }).length;
  if(noPapers) issues.push(["Units with neither CR nor OR recorded",noPapers,
    "Same exposure on bids and on any roadside check.","warn"]);

  var staleOil=S.vehicles.filter(function(v){
    var d=daysSince(v.schedOil); return v.status!=="SOLD" && d!=null && d>365; }).length;
  if(staleOil) issues.push(["Units whose change-oil schedule is over a year old",staleOil,
    "The alpha list column has not been updated since 2025, so it flags almost every unit. Oil status here is taken from the service log instead.","mute"]);

  var noDriverDetail=S.drivers.filter(function(d){return !d.lic;}).length;
  if(noDriverDetail) issues.push(["Drivers with no licence on file",noDriverDetail,
    "Licence numbers and expiry dates are blank in the master list.","mute"]);

  g.appendChild(card("Open issues",issues.length+" found",
    table([
      {h:"Issue",get:function(r){return r[0];}},
      {h:"Count",num:true,get:function(r){return nnum(r[1]);}},
      {h:"Why it matters",get:function(r){return r[2];}},
      {h:"",get:function(r){ return el("span","chip "+r[3],r[3]==="crit"?"Blocking":r[3]==="warn"?"Distorts":"Incomplete"); }}
    ],issues,{empty:"Nothing outstanding — the ledger is clean."})));

  var b=el("div","banner info");
  b.innerHTML="<b>Loaded from the workbook:</b> "+nnum(lines.length)+" ledger lines across "+
    Object.keys(S.ledger).length+" months, "+S.vehicles.length+" units, "+S.parts.length+" part categories, "+
    S.suppliers.length+" suppliers, "+S.purchases.length+" fuel deliveries and "+S.withdrawals.length+
    " withdrawals. The Drive export caps each sheet, so the monthly logs are partial — figures here are for the lines present, not the full year.";
  g.appendChild(b);
  w.appendChild(g);
  return w;
}
