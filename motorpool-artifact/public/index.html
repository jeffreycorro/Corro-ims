<!doctype html>
<html lang="en">
<head>
  <script src="/claude-shim.js"></script>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link rel="stylesheet" href="/pwa.css">
  <script src="/pwa.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Corcondev Motorpool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <span class="brand-mark">C</span>
        <div>
          <div class="brand-name">Corcondev Motorpool</div>
          <div class="brand-sub">Corro Const. Development</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="rail-foot">
        <div class="dbdot" id="dbdot"><i></i>Starting</div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn sm" id="back-btn" hidden type="button">← Back</button>
        <div class="crumb" id="crumb">Yard board</div>
        <button class="pill activity" id="activity-pill" hidden type="button">New activity</button>
      </header>
      <div class="wrap" id="view"></div>
    </div>
  </div>
  <script src="/js/rules.js"></script>
  <script src="/js/worktypes.js"></script>
  <script src="/js/seed.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
