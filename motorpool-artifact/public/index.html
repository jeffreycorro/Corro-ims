}

/* VRF numbers are the spine of the paper trail, so the counter is taken under a
   short lease rather than read-modify-written by whoever is fastest. */
async function claimVrf(){
  if(!S.db){ var n=S.cfg.nextVrf; S.cfg.nextVrf=n+1; await writeDoc(PATHS.cfg,S.cfg); return n; }
  for(var i=0;i<6;i++){
    try{
      var r = await S.db.doc("config/counter").acquire({holder:SID, ttlMs:6000});
      if(r.acquired){
        var s = await S.db.doc(PATHS.cfg).get();
        var cur = (s.exists && s.data().nextVrf) || S.cfg.nextVrf;
        S.cfg.nextVrf = cur+1;
        await writeDoc(PATHS.cfg,{nextVrf:cur+1, pass:S.cfg.pass, fuel:S.cfg.fuel||null,
          varianceTol:S.cfg.varianceTol, nextReserve:S.cfg.nextReserve, driveFolder:S.cfg.driveFolder||""});
        return cur;
      }
    }catch(e){ break; }
    await new Promise(function(r){ setTimeout(r,450); });
  }
  var f=S.cfg.nextVrf; S.cfg.nextVrf=f+1; await writeDoc(PATHS.cfg,S.cfg); return f;
}

async function appendLedger(month,rows){
  var doc = await readDoc("ledger/"+month);
  var cur = (doc&&doc.rows)||S.ledger[month]||[];
  var next = cur.concat(rows);
  S.ledger[month]=next;
  _vrfs=null; _lw=null; _cons=null;   /* the derived views are stale the moment a line lands */
  await writeDoc("ledger/"+month,{month:month,rows:next});
  var idx = await readDoc("ledger/index");
  var ms = (idx&&idx.months)||Object.keys(S.ledger);
  if(ms.indexOf(month)<0){ ms.push(month); ms.sort(); await writeDoc("ledger/index",{months:ms}); }
}
async function appendRows(key,rows){
  var doc = await readDoc(PATHS[key]);
  var cur = (doc&&doc.rows)||S[key]||[];
  var next = cur.concat(rows);
  S[key]=next;
  if(key==="withdrawals"||key==="purchases") _cons=null;
  await writeDoc(PATHS[key],{rows:next});
}
async function replaceRows(key,rows){
  S[key]=rows;
  if(key==="withdrawals"||key==="purchases") _cons=null;
  await writeDoc(PATHS[key],{rows:rows});
}

/* ============================ reserves ============================
   A reserve is the ask that comes BEFORE the money is spent: this unit needs
   this job done, here is what we think it will cost. It is approved on its own
   merits, the work is then carried out against it, and the VRF that lands is
   liquidated back onto it. Actuals never match estimates exactly, so the gate
   is a tolerance, not equality — and going past it needs a justification a
   person signs, not a silent adjustment. */
var VARIANCE_TOL_DEFAULT=0.10;
function varianceTol(){
  var v=(S.cfg&&S.cfg.varianceTol);
  return (typeof v==="number"&&v>=0)?v:VARIANCE_TOL_DEFAULT;
}
/* Fuel goes through the same gate as everything else: nothing is drawn from a
   pump or from the drums without an approved reserve behind it, and a fuel
   reserve cannot be closed on a number alone — the gauge or the meter has to be
   photographed. Bulk deliveries into the reserve are approved the same way. */
var RSV_KINDS={
  "job":       {label:"Job / repair",              evidence:false},
  "fuel-issue":{label:"Fuel for a unit",           evidence:true},
  "fuel-bulk": {label:"Bulk fuel into the reserve",evidence:true}
};
function rsvKind(r){ return (r&&r.kind)||"job"; }
function needsEvidence(r){
  var k=RSV_KINDS[rsvKind(r)];
  return !!(k&&k.evidence);
}
/* Photos live on the VRFs attached to the reserve; that is the liquidation file. */
function reserveEvidence(r){
  var n=0;
  (r.vrfs||[]).forEach(function(no){ n+=photoCount(no); });
  return {need:needsEvidence(r), count:n, ok: !needsEvidence(r) || n>0};
}

/* A fuel request has to show the tank before it is filled. The gauge reading
   and a picture of it travel with the request, so the approver is looking at
   the same needle the driver was. */
var GAUGE_LEVELS=[
  {v:"E",   label:"Empty",           pct:0},
  {v:"RES", label:"On reserve light",pct:8},
  {v:"1/8", label:"1/8",             pct:12},
  {v:"1/4", label:"1/4",             pct:25},
  {v:"3/8", label:"3/8",             pct:37},
  {v:"1/2", label:"Half",            pct:50},
  {v:"5/8", label:"5/8",             pct:62},
  {v:"3/4", label:"3/4",             pct:75},
  {v:"7/8", label:"7/8",             pct:87},
  {v:"F",   label:"Full",            pct:100},
  {v:"NG",  label:"Gauge not working",pct:null}
];
function gaugeLabel(v){
  for(var i=0;i<GAUGE_LEVELS.length;i++) if(GAUGE_LEVELS[i].v===v) return GAUGE_LEVELS[i].label;
  return v||"—";
}
function gaugePct(v){
  for(var i=0;i<GAUGE_LEVELS.length;i++) if(GAUGE_LEVELS[i].v===v) return GAUGE_LEVELS[i].pct;
  return null;
}
function rsvOwner(no){ return "RSV-"+no; }
/* Fuel cannot be approved on a number alone — the tank has to be shown. */
function rsvReadyToApprove(r){
  if(rsvKind(r)==="job") return {ok:true,missing:[]};
  var miss=[];
  if(!r.gauge) miss.push("no gauge reading");
  if(!photoCount(rsvOwner(r.no))) miss.push("no photo of the gauge");
  return {ok:!miss.length, missing:miss};
}

var RSV_STATES={
  "Requested":["warn","Waiting for approval"],
  "Approved":["accent","Approved — work may start"],
  "Rejected":["mute","Rejected"],
  "Flagged":["crit","Over budget — needs a decision"],
  "Closed":["ok","Closed"]
};
function rsvChip(r){
  var m=RSV_STATES[r.status]||["mute",r.status||"—"];
  return el("span","chip "+m[0],r.status);
}
function reserveBy(no){
  for(var i=0;i<S.reserves.length;i++) if(String(S.reserves[i].no)===String(no)) return S.reserves[i];
  return null;
}
function openReserves(){
  return S.reserves.filter(function(r){ return r.status==="Requested"; });
}
function approvedReserves(veh){
  return S.reserves.filter(function(r){
    return r.status==="Approved" && (!veh||r.veh===veh);
  });
}
function flaggedReserves(){ return S.reserves.filter(function(r){ return r.status==="Flagged"; }); }

/* What the linked VRFs actually came to. */
function reserveActual(r){
  var t=0, found=[];
  (r.vrfs||[]).forEach(function(no){
    var v=vrfByNo(no);
    if(v){ t+=v.total; found.push(v); }
  });
  return {total:t,vrfs:found};
}
function reserveVariance(r){
  var appr=(r.approvedBudget!=null?r.approvedBudget:r.budget)||0;
  var act=(r.actual!=null)?r.actual:reserveActual(r).total;
  var diff=act-appr;
  return {approved:appr, actual:act, diff:diff,
    pct: appr>0 ? diff/appr : (act>0?1:0),
    over: appr>0 ? diff>appr*varianceTol() : act>0};
}
async function saveReserves(){
  var byYear={};
  S.reserves.forEach(function(r){
    var y=String((parseDate(r.date)||new Date()).getFullYear());
    (byYear[y]=byYear[y]||[]).push(r);
  });
  var years=Object.keys(byYear).sort();
  for(var i=0;i<years.length;i++){
    await writeDoc("reserves/"+years[i],{year:years[i],rows:byYear[years[i]]});
  }
  if(years.join(",")!==S.rsvYears.join(",")){
    S.rsvYears=years;
    await writeDoc("reserves/index",{years:years});
  }
}
async function claimReserveNo(){
  if(!S.db){
    var n=(S.cfg.nextReserve||1); S.cfg.nextReserve=n+1;
    await writeDoc(PATHS.cfg,{nextVrf:S.cfg.nextVrf,pass:S.cfg.pass,fuel:S.cfg.fuel||null,
      varianceTol:S.cfg.varianceTol,nextReserve:S.cfg.nextReserve,driveFolder:S.cfg.driveFolder||""});
    return n;
  }
  for(var i=0;i<6;i++){
    try{
      var got=await S.db.doc("config/rsvcounter").acquire({holder:SID,ttlMs:6000});
      if(got.acquired){
        var snap=await S.db.doc(PATHS.cfg).get();
        var cur=(snap.exists&&snap.data().nextReserve)||S.cfg.nextReserve||1;
        S.cfg.nextReserve=cur+1;
        await writeDoc(PATHS.cfg,{nextVrf:S.cfg.nextVrf,pass:S.cfg.pass,fuel:S.cfg.fuel||null,
          varianceTol:S.cfg.varianceTol,nextReserve:cur+1,driveFolder:S.cfg.driveFolder||""});
        return cur;
      }
    }catch(e){ break; }
    await new Promise(function(rz){ setTimeout(rz,420); });
  }
  var f=(S.cfg.nextReserve||1); S.cfg.nextReserve=f+1; return f;
}

/* ============================ attachments ============================
   Receipts and job photos live in the portal itself, not only as links:
   the file never leaves the device un-resized — it is drawn onto a canvas,
   scaled to 1400px on its long edge and stepped down in JPEG quality until it
   fits comfortably inside one document. Full-resolution originals still belong
   in Drive; a link field is there for that. */
var PHOTO_MAX_EDGE=1400, PHOTO_MAX_BYTES=150*1024, PHOTO_PER_VRF=24;

function shrinkImage(file){
  return new Promise(function(resolve,reject){
    if(!/^image\//.test(file.type)) return reject(new Error("not an image"));
    var fr=new FileReader();
    fr.onerror=function(){ reject(new Error("could not read the file")); };
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){ reject(new Error("could not open the image")); };
      img.onload=function(){
        var w=img.naturalWidth, h=img.naturalHeight;
        var scale=Math.min(1,PHOTO_MAX_EDGE/Math.max(w,h));
        var cw=Math.max(1,Math.round(w*scale)), ch=Math.max(1,Math.round(h*scale));
        var cv=document.createElement("canvas"); cv.width=cw; cv.height=ch;
        var cx=cv.getContext("2d");
        cx.fillStyle="#fff"; cx.fillRect(0,0,cw,ch);
        cx.drawImage(img,0,0,cw,ch);
        var q=0.72, out=cv.toDataURL("image/jpeg",q);
        while(out.length>PHOTO_MAX_BYTES*1.37&&q>0.32){
          q-=0.1; out=cv.toDataURL("image/jpeg",q);
        }
        if(out.length>PHOTO_MAX_BYTES*1.37&&Math.max(cw,ch)>900){
          var s2=900/Math.max(cw,ch);
          var c2=document.createElement("canvas");
          c2.width=Math.round(cw*s2); c2.height=Math.round(ch*s2);
          var x2=c2.getContext("2d");
          x2.fillStyle="#fff"; x2.fillRect(0,0,c2.width,c2.height);
          x2.drawImage(cv,0,0,c2.width,c2.height);
          out=c2.toDataURL("image/jpeg",0.6); cw=c2.width; ch=c2.height;
        }
        resolve({data:out,w:cw,h:ch,bytes:Math.round(out.length*0.75)});
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function photoKey(vrf,n){ return "vrf-"+String(vrf).replace(/[^A-Za-z0-9_.~:@+-]/g,"_")+"__"+n; }
async function listPhotos(vrf){
  if(!S.db){
    var loc=lsGet("photos/"+vrf,null);
    return (loc&&loc.items)||[];
  }
  try{
    var snap=await S.db.collection("photos").where("vrf","==",String(vrf)).get();
    return snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); })
      .sort(function(a,b){ return (a.idx||0)-(b.idx||0); });
  }catch(e){ return []; }
}
async function bumpPhotoCount(vrf,delta){
  var c=Object.assign({},S.photoCounts);
  c[vrf]=Math.max(0,(c[vrf]||0)+delta);
  if(!c[vrf]) delete c[vrf];
  S.photoCounts=c;
  await writeDoc(PATHS.photoIdx,{counts:c});
}
/* A phone clip is 10-30 MB — orders of magnitude past what a record can hold,
   and there is no file store on this account. So video lives where it was
   filmed (Drive, Photos) and the portal keeps the link, the caption and who put
   it there. Photos stay stored and printable; links open in a new tab. */
var LINK_KINDS={video:"Video",doc:"Document",photo:"Photo (link)",other:"Link"};
function guessLinkKind(u){
  if(/\.(mp4|mov|m4v|avi|mkv|webm|3gp)(\?|#|$)/i.test(u||"")) return "video";
  if(/\.(pdf|docx?|xlsx?|csv)(\?|#|$)/i.test(u||"")) return "doc";
  if(/\.(jpe?g|png|heic|webp|gif)(\?|#|$)/i.test(u||"")) return "photo";
  return "other";
}
async function addLink(owner,rec){
  var existing=await listPhotos(owner);
  var idx=existing.reduce(function(a,x){ return Math.max(a,x.idx||0); },0)+1;
  var body={vrf:String(owner), idx:idx, kind:"link", url:rec.url,
    linkKind:rec.linkKind||guessLinkKind(rec.url),
    caption:rec.caption||"", by:rec.by||"", at:iso()};
  if(!S.db){
    var loc=lsGet("photos/"+owner,{items:[]});
    loc.items.push(Object.assign({id:photoKey(owner,idx)},body));
    lsSet("photos/"+owner,loc);
  }else{
    await S.db.doc("photos/"+photoKey(owner,idx)).set(body);
  }
  await bumpPhotoCount(String(owner),1);
  return idx;
}
async function addPhoto(vrf,rec){
  var existing=await listPhotos(vrf);
  if(existing.length>=PHOTO_PER_VRF) throw new Error("This VRF already has "+PHOTO_PER_VRF+" photos.");
  var idx=existing.reduce(function(a,x){ return Math.max(a,x.idx||0); },0)+1;
  var body={vrf:String(vrf),idx:idx,caption:rec.caption||"",by:rec.by||"",at:iso(),
    data:rec.data,w:rec.w,h:rec.h,bytes:rec.bytes,link:rec.link||""};
  if(!S.db){
    var loc=lsGet("photos/"+vrf,{items:[]});
    loc.items.push(Object.assign({id:photoKey(vrf,idx)},body));
    lsSet("photos/"+vrf,loc);
  }else{
    await S.db.doc("photos/"+photoKey(vrf,idx)).set(body);
  }
  await bumpPhotoCount(String(vrf),1);
  return idx;
}
async function removePhoto(vrf,id){
  if(!S.db){
    var loc=lsGet("photos/"+vrf,{items:[]});
    loc.items=(loc.items||[]).filter(function(x){ return x.id!==id; });
    lsSet("photos/"+vrf,loc);
  }else{
    try{ await S.db.doc("photos/"+id).delete(); }catch(e){}
  }
  await bumpPhotoCount(String(vrf),-1);
}
function photoCount(vrf){ return S.photoCounts[String(vrf)]||0; }

/* A unit picker you can type into. Eighty-nine codes in a dropdown is a scroll;
   the yard thinks in plates and names as often as codes, so the list carries
   "SV-05 — TOYOTA LAND CRUISER 100 (WHITE)" and matches on any part of it. */
function unitLabel(v){ return v.code+" — "+(v.desc||""); }
function unitPicker(value,onPick,opts){
  opts=opts||{};
  var wrap=el("div");
  var inp=el("input");
  inp.placeholder=opts.placeholder||"type a code, name or plate…";
  inp.setAttribute("autocomplete","off");
  var dlId="up-"+Math.random().toString(36).slice(2,8);
  var dl=document.createElement("datalist"); dl.id=dlId;
  var pool=S.vehicles.filter(function(v){ return opts.includeSold||v.status!=="SOLD"; });
  pool.forEach(function(v){
    var o=document.createElement("option");
    o.value=unitLabel(v);
    o.label=(v.plate||"")+(v.site?" · "+v.site:"");
    dl.appendChild(o);
  });
  inp.setAttribute("list",dlId);
  var hint=el("div","hint");
  var current="";
  /* The callback belongs to the form, and half of that form is not built yet
     while this picker is being made. So the first paint stays silent — the
     caller wires its own state up once everything exists. */
  var settling=true;
  function paint(v){
    current=v?v.code:"";
    if(v){
      hint.textContent=v.code+" · "+(v.plate||"no plate")+" · "+(v.status||"Active")+
        (v.site?" · "+v.site:"");
      hint.style.color="";
    }else if(String(inp.value||"").trim()){
      hint.textContent="No unit matches that."; hint.style.color="var(--warn)";
    }else{
      hint.textContent=opts.hint||""; hint.style.color="";
    }
    if(onPick&&!settling) onPick(current);
  }
  function resolve(){
    var t=String(inp.value||"").trim();
    if(!t){ paint(null); return; }
    var head=t.split("—")[0].split(" - ")[0].trim().toUpperCase();
    var v=vehicle(head);
    if(!v){
      var low=t.toLowerCase();
      var hits=pool.filter(function(x){
        return (x.code+" "+(x.desc||"")+" "+(x.plate||"")).toLowerCase().indexOf(low)>=0; });
      if(hits.length===1) v=hits[0];
      else {
        var exact=pool.filter(function(x){ return x.code.toLowerCase()===low; });
        if(exact.length) v=exact[0];
      }
    }
    paint(v||null);
  }
  inp.addEventListener("input",resolve);
  inp.addEventListener("change",resolve);
  wrap.appendChild(inp); wrap.appendChild(dl); wrap.appendChild(hint);
  wrap.getCode=function(){ return current; };
  wrap.setCode=function(c){
    var v=c?vehicle(c):null;
    inp.value=v?unitLabel(v):"";
    paint(v||null);
  };
  wrap.focusInput=function(){ try{ inp.focus(); }catch(e){} };
  if(value) wrap.setCode(value); else paint(null);
  settling=false;
  return wrap;
}

/* ============================ the unit's own file ============================
   A 201 file for a vehicle: its identity, its photographs, and its papers.
   Photos and documents ride the same store as VRF attachments, under their own
   owner keys, so a scan is held and a bulky original is linked. */
function unitOwner(code){ return "UNIT-"+code; }
function docOwner(code){ return "DOC-"+code; }
var DOC_TYPES=["Certificate of Registration (CR)","Official Receipt (OR)",
  "Registration papers (OR + CR)","Insurance",
  "Emission certificate","LTO renewal receipt","Stencil / macro-etching",
  "Deed of sale","Delivery permit","Other"];
/* A backhoe or a roller never sees the LTO, so asking it for a CR would put
   every machine permanently in the red. Plant is held to its deed of sale. */
function isPlant(v){
  if(!v) return false;
  var pl=String(v.plate||"").trim().toUpperCase();
  return /^(BH|RR)-/.test(v.code||"") || !pl || pl==="NA" || pl==="N/A";
}
function papersExpected(v){
  return isPlant(v) ? ["Deed of sale"]
    : ["Certificate of Registration (CR)","Official Receipt (OR)","Insurance"];
}
/* A single OR+CR scan answers for both. */
function papersHeld(code){
  var s={};
  (S.papers||[]).forEach(function(d){
    if(d.code!==code) return;
    if(!d.url&&!d.hasScan&&!d.docNo) return;
    if(!d.url&&!d.hasScan) return;
    if(d.docType==="Registration papers (OR + CR)"){
      s["Official Receipt (OR)"]=1; s["Certificate of Registration (CR)"]=1;
    }
    s[d.docType]=1;
  });
  return s;
}
function papersMissing(v){
  var held=papersHeld(v.code);
  return papersExpected(v).filter(function(t){ return !held[t]; });
}
/* Everything still on the road that is short of a paper. */
function paperGaps(){
  return S.vehicles.filter(function(v){
    return v.status!=="SOLD" && v.code!=="AV" && !/^Equipment/i.test(v.code||"");
  }).map(function(v){ return {v:v, miss:papersMissing(v)}; })
    .filter(function(e){ return e.miss.length; })
    .sort(function(a,b){ return b.miss.length-a.miss.length ||
      String(a.v.code).localeCompare(String(b.v.code)); });
}
/* The paper itself can be a heavy scan, so it lives in the attachment store;
   only its particulars sit in ops/papers. That keeps every expiry date in
   memory for the reminders without dragging a hundred images along. */
async function addDoc(code,rec){
  var owner=docOwner(code);
  var idx=(S.papers||[]).reduce(function(a,x){
    return (x.code===code)?Math.max(a,x.idx||0):a; },0)+1;
  var pid=photoKey(owner,idx);
  if(rec.data){
    var body={vrf:String(owner), idx:idx, kind:"doc", caption:rec.docType+" "+(rec.docNo||""),
      by:rec.by||"", at:iso(), data:rec.data, w:rec.w||null, h:rec.h||null, bytes:rec.bytes||null};
    if(!S.db){
      var loc=lsGet("photos/"+owner,{items:[]});
      loc.items.push(Object.assign({id:pid},body)); lsSet("photos/"+owner,loc);
    }else{
      await S.db.doc("photos/"+pid).set(body);
    }
    await bumpPhotoCount(String(owner),1);
  }
  var meta={id:pid, code:code, idx:idx, docType:rec.docType||"Other", docNo:rec.docNo||"",
    issued:rec.issued||"", expires:rec.expires||"", url:rec.url||"",
    year:rec.year||"", file:rec.file||"",
    hasScan:!!rec.data, by:rec.by||"", at:iso(), notes:rec.notes||""};
  await replaceRows("papers",(S.papers||[]).concat([meta]));
  return idx;
}
async function removeDoc(meta){
  if(meta.hasScan){
    if(!S.db){
      var owner=docOwner(meta.code);
      var loc=lsGet("photos/"+owner,{items:[]});
      loc.items=(loc.items||[]).filter(function(x){ return x.id!==meta.id; });
      lsSet("photos/"+owner,loc);
    }else{
      try{ await S.db.doc("photos/"+meta.id).delete(); }catch(e){}
    }
    await bumpPhotoCount(docOwner(meta.code),-1);
  }
  await replaceRows("papers",(S.papers||[]).filter(function(x){ return x.id!==meta.id; }));
}
function papersFor(code){
  return (S.papers||[]).filter(function(x){ return x.code===code; })
    .sort(function(a,b){
      var t=String(a.docType).localeCompare(String(b.docType));
      if(t) return t;
      return String(b.year||"").localeCompare(String(a.year||""));
    });
}
/* Every paper across the fleet that has run out or is about to. */
function expiringPapers(withinDays){
  var lim=withinDays==null?45:withinDays;
  return (S.papers||[]).map(function(x){
    return {meta:x, st:docStatus(x)};
  }).filter(function(e){
    return e.st.days!=null && e.st.days<=lim;
  }).sort(function(a,b){ return a.st.days-b.st.days; });
}
function docStatus(d){
  if(!d.expires) return {k:"mute",label:"no expiry recorded",days:null};
  var days=daysSince(d.expires);
  if(days==null) return {k:"mute",label:"no expiry recorded",days:null};
  if(days>0) return {k:"crit",label:"expired "+days+"d ago",days:-days};
  var left=-days;
  if(left<=30) return {k:"warn",label:"expires in "+left+"d",days:left};
  return {k:"ok",label:"valid",days:left};
}
async function saveVehicles(rows){
  await replaceRows("vehicles",rows);
}

/* ============================ derived ============================ */
/* FIFO across fuel-reserve lots: each withdrawal eats the oldest litres first. */
function fifo(){
  var lots = S.purchases.slice().filter(function(p){return p.liters>0;})
    .sort(function(a,b){ return (parseDate(a.date)||0)-(parseDate(b.date)||0); })
    .map(function(p){ return {date:p.date, left:p.liters, rate:(p.pricePerL|| (p.total/p.liters) ||0), vrf:p.vrf}; });
  var draws = S.withdrawals.slice().filter(function(w){return w.liters>0;})
    .sort(function(a,b){ return (parseDate(a.date)||0)-(parseDate(b.date)||0); });
  var li=0, costed=[], short=0;
  draws.forEach(function(w){
    var need=w.liters, cost=0;
    while(need>0.0001 && li<lots.length){
      if(lots[li].left<=0.0001){ li++; continue; }
      var take=Math.min(need,lots[li].left);
      cost += take*lots[li].rate; lots[li].left-=take; need-=take;
    }
    if(need>0.0001){ short+=need; }
    costed.push(Object.assign({},w,{fifoCost:cost, fifoRate: w.liters? cost/w.liters : 0}));
  });
  var onHand=0, onHandValue=0;
  lots.forEach(function(l){ onHand+=l.left; onHandValue+=l.left*l.rate; });
  return {
    lots:lots, draws:costed, onHand:onHand, onHandValue:onHandValue, shortfall:short,
    purchasedL: S.purchases.reduce(function(a,p){return a+(p.liters||0);},0),
    purchasedValue: S.purchases.reduce(function(a,p){return a+(p.total||0);},0),
    consumedL: draws.reduce(function(a,d){return a+(d.liters||0);},0),
    costOfUse: costed.reduce(function(a,d){return a+d.fifoCost;},0)
  };
}

/* The sheet flagged nearly every part "REPLACED TOO SOON" because it tested one
   date against the window. Two separate questions, answered separately here:
   is it due (last replacement older than its lifespan), and was any pair of
   replacements closer together than the alert window. */
function forecast(){
  var byKey={};
  allLines().forEach(function(r){
    if(!r.veh||r.veh==="AV") return;
    var c=normCat(r.cat); if(!c||isFuel(c)) return;
    var d=parseDate(r.date); if(!d) return;
    var k=r.veh+"␀"+c;
    (byKey[k]=byKey[k]||[]).push({d:d, price:r.price, supplier:r.supplier, qty:r.qty});
  });
  var out=[];
  Object.keys(byKey).forEach(function(k){
    var p=k.split("␀"), veh=p[0], cat=p[1];
    var hist=byKey[k].sort(function(a,b){return a.d-b.d;});
    var last=hist[hist.length-1];
    var spec=partSpec(cat);
    var lifeMo = spec? months(spec.lifeMo) : null;
    var alertMo = spec? months(spec.alertMo) : null;
    var ago = Math.floor((Date.now()-last.d.getTime())/DAY);
    var status="tracked", sev=0;
    if(lifeMo){
      var lifeDays = lifeMo*MO;
      if(ago >= lifeDays*1.25){ status="overdue"; sev=3; }
      else if(ago >= lifeDays){ status="due"; sev=2; }
      else if(ago >= lifeDays*0.8){ status="due soon"; sev=1; }
      else status="ok";
    }
    var tooSoon=null;
    if(alertMo && hist.length>1){
      var win=alertMo*MO;
      for(var i=1;i<hist.length;i++){
        var gap=Math.round((hist[i].d-hist[i-1].d)/DAY);
        if(gap<win && (tooSoon==null||gap<tooSoon)) tooSoon=gap;
      }
    }
    out.push({veh:veh,cat:cat,last:iso(last.d),ago:ago,lifeMo:lifeMo,alertMo:alertMo,
      status:status,sev:sev,times:hist.length,tooSoon:tooSoon,
      price:last.price,supplier:last.supplier});
  });
  return out.sort(function(a,b){ return (b.sev-a.sev)||(b.ago-a.ago); });
}

function spendRollup(){
  var byMonth={}, byVeh={}, bySup={}, byProj={}, total=0, fuel=0, maint=0, inv=0;
  var vrfs={};
  allLines().forEach(function(r){
    var t=r.total||0, f=isFuel(r.cat);
    var mk = monthKey(r.date)||r.month;
    /* Buying into the store moves cash into stock; it is not what the fleet
       cost to run. The issue out of the store is the cost, charged to the unit
       that took it — counting both would be the same peso twice. It is kept
       out of the monthly chart and the totals alike, and reported on its own. */
    if(r.veh==="AV"){ inv+=t; return; }
    if(!byMonth[mk]) byMonth[mk]={fuel:0,maint:0,n:0,vrfs:{}};
    byMonth[mk][f?"fuel":"maint"]+=t; byMonth[mk].n++;
    if(r.vrf){ byMonth[mk].vrfs[r.vrf]=1; vrfs[r.vrf]=1; }
    total+=t; if(f) fuel+=t; else maint+=t;
    if(r.veh) byVeh[r.veh]=(byVeh[r.veh]||0)+t;
    if(r.supplier){
      if(!bySup[r.supplier]) bySup[r.supplier]={n:0,total:0};
      bySup[r.supplier].n++; bySup[r.supplier].total+=t;
    }
    var pj=normProj(r.project); if(pj) byProj[pj]=(byProj[pj]||0)+t;
  });
  return {byMonth:byMonth,byVeh:byVeh,bySup:bySup,byProj:byProj,
    total:total,fuel:fuel,maint:maint,inv:inv,vrfCount:Object.keys(vrfs).length};
}

/* "DT-03 battery — when was the last purchase?" Every line for one unit and one
   part category, newest first, with the gap between fittings worked out. */
function partHistory(code,cat){
  var want=cat?normCat(cat):null;
  return allLines().filter(function(r){
    if(code && r.veh!==code) return false;
    if(want && normCat(r.cat)!==want) return false;
    if(!code && !want) return false;
    return !!parseDate(r.date);
  }).sort(function(a,b){ return parseDate(b.date)-parseDate(a.date); });
}
/* Every part category ever fitted to one unit, with how long ago. */
function catsForUnit(code){
  var m={};
  allLines().forEach(function(r){
    if(r.veh!==code) return;
    var c=normCat(r.cat); if(!c) return;
    var d=parseDate(r.date); if(!d) return;
    if(!m[c]) m[c]={cat:c,times:0,last:d,supplier:r.supplier,item:r.item,qty:r.qty};
    m[c].times++;
    if(d>m[c].last){ m[c].last=d; m[c].supplier=r.supplier; m[c].item=r.item; m[c].qty=r.qty; }
  });
  return Object.keys(m).map(function(k){
    var e=m[k], spec=partSpec(k), life=spec?months(spec.lifeMo):null;
    var ago=Math.floor((Date.now()-e.last.getTime())/DAY);
    return {cat:k,times:e.times,last:iso(e.last),ago:ago,supplier:e.supplier,item:e.item,
      qty:e.qty,lifeMo:life,due:life?ago>=life*MO:null};
  }).sort(function(a,b){ return b.ago-a.ago; });
}
/* Every unit that has had one part category, oldest fitting first. */
function unitsForCat(cat){
  var want=normCat(cat), m={};
  allLines().forEach(function(r){
    if(!r.veh||normCat(r.cat)!==want) return;
    var d=parseDate(r.date); if(!d) return;
    if(!m[r.veh]) m[r.veh]={veh:r.veh,times:0,last:d,supplier:r.supplier,item:r.item};
    m[r.veh].times++;
    if(d>m[r.veh].last){ m[r.veh].last=d; m[r.veh].supplier=r.supplier; m[r.veh].item=r.item; }
  });
  var spec=partSpec(want), life=spec?months(spec.lifeMo):null;
  return Object.keys(m).map(function(k){
    var e=m[k], ago=Math.floor((Date.now()-e.last.getTime())/DAY);
    return {veh:k,times:e.times,last:iso(e.last),ago:ago,supplier:e.supplier,item:e.item,
      lifeMo:life,due:life?ago>=life*MO:null};
  }).sort(function(a,b){ return b.ago-a.ago; });
}

/* Heavy equipment runs on an hour meter, road units on an odometer, so the two
   are never mixed on one scale: litres per hour for excavators, rollers and
   mixers; kilometres per litre for everything that drives. */
var HOUR_METER=/^(BH|RR|TM|MBC|Equipment)/i;
function meterOf(code){ return HOUR_METER.test(code||"")?"hr":"km"; }
function meterUnit(m){ return m==="hr"?"L / hr":"km / L"; }

/* Fill to fill: the fuel put in at one stop is what carried the unit to the
   next. Intervals with a meter that went backwards, a missing reading or an
   impossible result are dropped and counted, never quietly averaged in. */
var _cons=null;
function consumption(){
  if(_cons) return _cons;
  var byU={};
  allLines().forEach(function(r){
    if(!isFuel(r.cat)||!r.veh||r.veh==="AV") return;
    /* Litres only — never fall back to qty. A driver reimbursement is booked as
       a fuel line with qty 1 and no litres, and that was being read as a
       one-litre fill, which quietly wrecked the km/L for that unit. */
    var L=r.liters;
    if(!L||L<=0) return;
    var d=parseDate(r.date); if(!d) return;
    (byU[r.veh]=byU[r.veh]||[]).push({d:d,date:r.date,L:L,odo:r.odo,prevOdo:r.prevOdo,
      total:r.total,vrf:r.vrf,project:r.project});
  });
  _cons=Object.keys(byU).map(function(code){
    var ev=byU[code].sort(function(a,b){ return a.d-b.d; });
    var meter=meterOf(code), pts=[], dropped=0, dSum=0, lSum=0, cSum=0;
    for(var i=1;i<ev.length;i++){
      var cur=ev[i], prev=ev[i-1];
      var start=(cur.prevOdo!=null)?cur.prevOdo:prev.odo;
      var L=prev.L;
      if(cur.odo==null||start==null||!L||L<=0){ dropped++; continue; }
      var delta=cur.odo-start;
      if(delta<=0){ dropped++; continue; }
      var v=meter==="km"?delta/L:L/delta;
      if(meter==="km"&&(v<0.3||v>60)){ dropped++; continue; }
      if(meter==="hr"&&(v<0.3||v>80)){ dropped++; continue; }
      pts.push({date:cur.date,v:v,delta:delta,L:L,cost:prev.total||0,vrf:cur.vrf,project:cur.project});
      dSum+=delta; lSum+=L; cSum+=(prev.total||0);
    }
    if(!pts.length) return {code:code,meter:meter,n:0,dropped:dropped,fills:ev.length};
    var vals=pts.map(function(x){ return x.v; }).slice().sort(function(a,b){ return a-b; });
    var avg = meter==="km" ? dSum/lSum : lSum/dSum;
    var v0=vehicle(code);
    return {code:code, desc:v0?v0.desc:"", meter:meter, n:pts.length, dropped:dropped,
      fills:ev.length, avg:avg,
      best: meter==="km"?vals[vals.length-1]:vals[0],
      worst: meter==="km"?vals[0]:vals[vals.length-1],
      latest: pts[pts.length-1].v, latestDate: pts[pts.length-1].date,
      spread: vals[vals.length-1]-vals[0],
      distance:dSum, litres:lSum, cost:cSum,
      costPer: dSum? cSum/dSum : null,
      points:pts, reliable: pts.length>=3};
  }).filter(Boolean);
  return _cons;
}
/* ---------- fuel request limits ----------
   A unit asking for fuel when its meter has barely moved is either a misread
   odometer, a tank already full, or fuel going somewhere it should not. The
   check is a gate, not a score: a stop has to be overridden by a person who
   gives a reason, and the override is kept. */
var FUEL_DEFAULTS={ overTol:0.60, bandTol:0.40, minMove:{km:5,hr:0.5}, enabled:true };
function fuelRules(){
  var r=Object.assign({},FUEL_DEFAULTS,(S.cfg&&S.cfg.fuel)||{});
  r.minMove=Object.assign({},FUEL_DEFAULTS.minMove,(S.cfg&&S.cfg.fuel&&S.cfg.fuel.minMove)||{});
  return r;
}
function lastFuel(code){
  var best=null;
  allLines().forEach(function(r){
    if(r.veh!==code||!isFuel(r.cat)) return;
    var d=parseDate(r.date); if(!d) return;
    if(!best||d>=best.d) best={d:d,date:r.date,odo:r.odo,L:r.liters||r.qty,vrf:r.vrf};
  });
  return best;
}
function fuelCheck(code,odo,litres){
  var rules=fuelRules();
  var out={gates:[],meter:meterOf(code),rules:rules};
  if(!rules.enabled||!code) return out;
  var c=consumption().filter(function(x){ return x.code===code; })[0];
  var last=lastFuel(code);
  var meter=out.meter, unitLbl=meter==="km"?"km":"hours";
  out.avg=c&&c.n?c.avg:null;
  out.last=last;
  litres=parseFloat(litres)||0;

  if(odo==null||odo===""||isNaN(parseFloat(odo))){
    out.gates.push({level:"warn",code:"NO_METER",
      msg:"No meter reading on this request",
      detail:"Without the "+(meter==="km"?"odometer":"hour meter")+" this fill cannot be checked, and it will not count towards consumption."});
    return out;
  }
  odo=parseFloat(odo);
  if(!last||last.odo==null){
    out.gates.push({level:"warn",code:"NO_BASELINE",
      msg:"No previous fill with a meter reading",
      detail:"First measurable fill for "+code+" — nothing to compare against yet."});
    return out;
  }
  var move=odo-last.odo;
  out.move=move; out.lastOdo=last.odo; out.lastDate=last.date; out.lastL=last.L;
  if(move<0){
    out.gates.push({level:"stop",code:"METER_BACKWARDS",
      msg:"The meter reads lower than last time",
      detail:nnum(odo)+" now against "+nnum(last.odo)+" on "+last.date+". Either the reading is wrong or the meter was replaced."});
  }else if(move===0){
    out.gates.push({level:"stop",code:"METER_NOT_MOVED",
      msg:"The unit has not moved since its last fill",
      detail:"Same reading as "+last.date+" ("+nnum(odo)+"). It should not need fuel yet."});
  }else if(move<(rules.minMove[meter]||0)){
    out.gates.push({level:"stop",code:"BARELY_MOVED",
      msg:"Only "+nnum(move,meter==="km"?0:1)+" "+unitLbl+" since the last fill",
      detail:"Filled on "+last.date+" at "+nnum(last.odo)+". Below the "+
        nnum(rules.minMove[meter],meter==="km"?0:1)+" "+unitLbl+" floor for a new request."});
  }
  if(move>0&&c&&c.n){
    var expected = meter==="km" ? move/c.avg : move*c.avg;
    out.expected=expected;
    if(litres>0&&expected>0&&litres>expected*(1+rules.overTol)){
      out.gates.push({level:"stop",code:"OVER_EXPECTED",
        msg:nnum(litres,2)+" L asked for, about "+nnum(expected,2)+" L used",
        detail:code+" averages "+c.avg.toFixed(2)+" "+meterUnit(meter)+", so "+
          nnum(move,meter==="km"?0:1)+" "+unitLbl+" needs roughly "+nnum(expected,2)+
          " L. Over the "+Math.round(rules.overTol*100)+"% allowance."});
    }
    if(last.L>0){
      var implied = meter==="km" ? move/last.L : last.L/move;
      out.implied=implied;
      var lo=c.worst*(1-rules.bandTol), hi=c.best*(1+rules.bandTol);
      if(meter==="hr"){ lo=c.best*(1-rules.bandTol); hi=c.worst*(1+rules.bandTol); }
      if(implied<lo||implied>hi){
        out.gates.push({level:"stop",code:"OUT_OF_RANGE",
          msg:"That interval works out at "+implied.toFixed(2)+" "+meterUnit(meter),
          detail:code+" has run between "+Math.min(c.best,c.worst).toFixed(2)+" and "+
            Math.max(c.best,c.worst).toFixed(2)+" over "+c.n+" intervals. This one falls outside that by more than "+
            Math.round(rules.bandTol*100)+"%."});
      }
    }
    if(!c.reliable) out.gates.push({level:"warn",code:"THIN_HISTORY",
      msg:"Only "+c.n+" measured interval"+(c.n===1?"":"s")+" for this unit",
      detail:"The limits above are indicative until there is more history."});
  }else if(move>0){
    out.gates.push({level:"warn",code:"NO_BASELINE",
      msg:"No consumption baseline for "+code+" yet",
      detail:"Nothing to measure this request against."});
  }
  out.stops=out.gates.filter(function(g){ return g.level==="stop"; });
  return out;
}
var OVERRIDE_REASONS=["Meter not working / not readable","Unit idled or ran stationary on site",
  "Tank was run down before this fill","Meter was replaced or reset","Reading corrected after this VRF",
  "Emergency dispatch","Fuel for an attachment or generator","Other — see the note"];

/* ---------- the store ----------
   Movements are VRFs, not a separate form — that is already the yard's habit.
   IN  = a VRF line coded to unit AV            (a receipt into the store)
   OUT = a VRF line on the real unit whose      (an issue from the store)
         supplier is MOTORPOOL INVENTORY
   Value is weighted average, not FIFO: FIFO earns its keep on one commodity
   with a moving price (the diesel), not on a hundred part numbers.
   A receipt is NOT project cost — it moves cash into stock. The issue is the
   cost, charged to the unit that took it. Counting both is the same peso twice. */
var STORE_SUPPLIER="MOTORPOOL INVENTORY";
/* Bulk diesel is coded to AV as well, but it is not the parts store — it is the
   drums, already carried as FIFO lots on the fuel reserve. Counting it here too
   was the same ₱344,544 twice and made the store look four times its size. */
function isStoreIssue(r){
  return !isFuel(r.cat) && String(r.supplier||"").trim().toUpperCase()===STORE_SUPPLIER;
}
function isStoreReceipt(r){ return (r.veh||"")==="AV" && !isFuel(r.cat); }
/* The item master is what stops the store drifting. "Brake Fluild" going out
   and "Brake & Clutch Fluid National" coming in are the same tin; without a
   master they read as two items, one of them permanently negative. Every master
   row can carry the other spellings it has been written under. */
var _itemIdx=null;
function itemIndex(){
  if(_itemIdx) return _itemIdx;
  var m={};
  (S.items||[]).forEach(function(it){
    var nm=String(it.name||"").trim().toLowerCase();
    if(nm){ m[normCat(it.cat)+"|"+nm]=it; if(!m["*|"+nm]) m["*|"+nm]=it; }
    (it.aliases||[]).forEach(function(a){
      var an=String(a||"").trim().toLowerCase();
      if(!an) return;
      m[normCat(it.cat)+"|"+an]=it;
      if(!m["*|"+an]) m["*|"+an]=it;
    });
  });
  _itemIdx=m; return m;
}
function resolveItem(r){
  var idx=itemIndex();
  var nm=String(r.item||"").trim().toLowerCase();
  if(!nm) return null;
  return idx[normCat(r.cat)+"|"+nm] || idx["*|"+nm] || null;
}
function itemKey(r){
  var it=resolveItem(r);
  if(it) return "id:"+it.id;
  return normCat(r.cat)+" | "+String(r.item||"").trim().toLowerCase();
}
function itemById(id){
  for(var i=0;i<(S.items||[]).length;i++) if(S.items[i].id===id) return S.items[i];
  return null;
}
function onHandOf(cat,name){
  var inv=inventory();
  var probe=itemKey({cat:cat,item:name});
  for(var i=0;i<inv.length;i++) if(inv[i].key===probe) return inv[i];
  return null;
}
var _inv=null;
function inventory(){
  if(_inv) return _inv;
  var m={};
  function slot(r){
    var k=itemKey(r);
    if(!m[k]){
      var mi=resolveItem(r);
      m[k]={key:k, master:mi||null,
        cat: mi?normCat(mi.cat):normCat(r.cat),
        item: mi?mi.name:String(r.item||"").trim(),
        partNo: mi?(mi.partNo||""):"", fits: mi?(mi.fits||""):"",
        reorder: mi?(mi.reorder||0):0,
      inQty:0, inValue:0, outQty:0, outValue:0, receipts:[], issues:[], lastIn:null, lastOut:null};
    }
    return m[k];
  }
  allLines().forEach(function(r){
    if(!String(r.item||"").trim() && !normCat(r.cat)) return;
    if(isStoreReceipt(r)){
      var e=slot(r);
      e.inQty+=(r.qty||0); e.inValue+=(r.total||0);
      e.receipts.push(r);
      var d=parseDate(r.date); if(d&&(!e.lastIn||d>e.lastIn)) e.lastIn=d;
    }else if(isStoreIssue(r)){
      var e2=slot(r);
      e2.outQty+=(r.qty||0); e2.outValue+=(r.total||0);
      e2.issues.push(r);
      var d2=parseDate(r.date); if(d2&&(!e2.lastOut||d2>e2.lastOut)) e2.lastOut=d2;
    }
  });
  _inv=Object.keys(m).map(function(k){
    var e=m[k];
    e.avgCost = e.inQty>0 ? e.inValue/e.inQty : null;
    e.onHand = e.inQty-e.outQty;
    e.onHandValue = (e.avgCost!=null) ? e.onHand*e.avgCost : 0;
    e.neverReceived = e.inQty===0 && e.outQty>0;
    e.negative = e.onHand<-0.0001;
    e.belowReorder = (e.reorder>0) && e.onHand<=e.reorder && !e.neverReceived;
    e.lastInISO = e.lastIn?iso(e.lastIn):"";
    e.lastOutISO = e.lastOut?iso(e.lastOut):"";
    return e;
  }).sort(function(a,b){ return (b.onHandValue||0)-(a.onHandValue||0); });
  return _inv;
}
function storeTotals(){
  var inv=inventory();
  return {
    items: inv.length,
    inValue: inv.reduce(function(a,e){ return a+e.inValue; },0),
    outValue: inv.reduce(function(a,e){ return a+e.outValue; },0),
    onHandValue: inv.reduce(function(a,e){ return a+(e.onHandValue>0?e.onHandValue:0); },0),
    exceptions: inv.filter(function(e){ return e.neverReceived||e.negative; })
  };
}
/* Money spent buying INTO the store, month by month — its own ledger, kept
   apart from what the fleet costs to run. */
function inventoryInByMonth(){
  var by={};
  allLines().forEach(function(r){
    if(!isStoreReceipt(r)) return;   /* fuel into the drums is not the store */
    var mk=monthKey(r.date)||r.month;
    if(!mk) return;
    if(!by[mk]) by[mk]={month:mk, value:0, lines:0, vrfs:{}, suppliers:{}};
    by[mk].value+=(r.total||0); by[mk].lines++;
    if(r.vrf) by[mk].vrfs[r.vrf]=1;
    if(r.supplier) by[mk].suppliers[r.supplier]=(by[mk].suppliers[r.supplier]||0)+(r.total||0);
  });
  return Object.keys(by).sort().map(function(k){
    var e=by[k];
    e.vrfCount=Object.keys(e.vrfs).length;
    e.topSupplier=Object.keys(e.suppliers).sort(function(a,b){
      return e.suppliers[b]-e.suppliers[a]; })[0]||"";
    return e;
  });
}

function fleetAvg(meter){
  var d=0,l=0;
  consumption().forEach(function(c){
    if(c.meter!==meter||!c.n) return;
    d+=c.distance; l+=c.litres;
  });
  if(!d||!l) return null;
  return meter==="km"? d/l : l/d;
}

function openTasks(){ return S.tasks.filter(function(t){ return t.status!=="Done"; }); }
/* A task carries its own photographs and links, on the same store as VRF and
   unit attachments, under its own owner key. */
function taskOwner(no){ return "TASK-"+no; }
function taskBy(no){
  for(var i=0;i<S.tasks.length;i++) if(String(S.tasks[i].no)===String(no)) return S.tasks[i];
  return null;
}
async function saveTask(no,patch){
  await replaceRows("tasks",S.tasks.map(function(x){
    return String(x.no)===String(no) ? Object.assign({},x,patch) : x; }));
}
async function removeTask(no){
  await replaceRows("tasks",S.tasks.filter(function(x){
    return String(x.no)!==String(no); }));
}
function taskProofCount(no){ return photoCount(taskOwner(no)); }
function mechFor(code){ return S.mechanic.filter(function(m){ return m.vehicle===code; }); }
function openJOs(){ return S.mechanic.filter(function(j){ return j.status!=="Closed"; }); }
function joBy(no){
  for(var i=0;i<S.mechanic.length;i++) if(String(S.mechanic[i].no)===String(no)) return S.mechanic[i];
  return null;
}
/* A job order is only "done" when the work is evidenced: every checklist line
   ticked, proof attached, and the resolution written up. These are the gates. */
function joBlockers(j){
  var out=[];
  var open=(j.checklist||[]).filter(function(c){ return !c.done; });
  if(open.length) out.push(open.length+" checklist item"+(open.length>1?"s":"")+" not ticked");
  if(!(j.proofs||[]).length) out.push("no proof attached");
  if(!(j.resolution||"").trim()) out.push("resolution not written up");
  return out;
}
/* An errand is done when someone says it is done — no checklist, no photo. */
function joGates(j){ return joKind(j)==="Admin" ? [] : joBlockers(j); }
/* Workshop work and admin errands were two screens doing the same thing. They
   are one record now — a job order — so a unit's whole history of being worked
   on sits in one place and can be read back years later. An admin errand skips
   the checklist and the proof; work on a unit does not. */
var JO_KINDS={"Workshop":"Work on a unit","Admin":"Admin / follow-up"};
function joKind(j){ return (j&&j.kind)||"Workshop"; }
function adminJOs(){ return S.mechanic.filter(function(j){ return joKind(j)==="Admin"; }); }
function joForVrf(no){
  return S.mechanic.filter(function(j){ return String(j.vrf||"")===String(no); });
}
/* A reserve is the money; a job order or a task is the work it was for. Both
   ride on the VRF, and neither stands in for the other. */
function linesForWorkRef(kind,no){
  return allLines().filter(function(r){
    return String(r[kind]||"")===String(no); });
}
function vrfsForWorkRef(kind,no){
  var by={};
  linesForWorkRef(kind,no).forEach(function(r){
    var k=String(r.vrf||"");
    if(!k) return;
    if(!by[k]) by[k]={vrf:k,date:r.date,total:0,lines:0,veh:r.veh};
    by[k].total+=(r.total||0); by[k].lines++;
  });
  return Object.keys(by).map(function(k){ return by[k]; })
    .sort(function(a,b){ return (parseDate(a.date)||0)-(parseDate(b.date)||0); });
}
function workRefLabel(ref){
  if(!ref) return "";
  if(ref.indexOf("JO:")===0){ var j=joBy(ref.slice(3));
    return "JO-"+ref.slice(3)+(j?"  ·  "+(j.action||"")+"  ·  "+(j.vehicle||""):""); }
  if(ref.indexOf("T:")===0){ var t=taskBy(ref.slice(2));
    return "T-"+ref.slice(2)+(t?"  ·  "+(t.title||""):""); }
  return ref;
}
var JO_CHECKS={
  "Repair":["Fault confirmed on the unit","Parts drawn / VRF raised","Repair carried out",
            "Road tested","Area cleaned, tools returned"],
  "Inspection":["Unit inspected","Findings recorded","Defects listed for action"],
  "PMS / service":["Oil and filters changed","Levels topped up","Greasing done",
                   "Lights and brakes checked","Road tested"],
  "Fabrication":["Measurements taken","Fabrication done","Fitted to the unit","Function tested"],
  "Road test":["Route completed","Behaviour recorded"],
  "Towing":["Unit secured","Delivered to workshop"]
};
function vrfChip(v){

    "Closed":["ok","Liquidated"],"Legacy":["mute","From the old workbooks"]};

}
function joStatusChip(j){

    "For verification":["warn","For verification"],"Closed":["ok","Closed"],
    "Reopened":["crit","Reopened"]};

function isUrl(u){ return /^https?:\/\/\S+$/i.test((u||"").trim()); }

var MONTHS=["January","February","March","April","May","June","July",
  "August","September","October","November","December"];

/* Every reminder is derived from the ledger and the master lists — nothing to
   tick over by hand, so the board cannot go stale the way a reminder tab does. */
function reminders(){
  var out=[], now=new Date(), mi=now.getMonth(), yr=now.getFullYear();
  var down=downCodes(), OM=oilMap(), f=fifo();

  openBreakdowns().forEach(function(b){
    var d=daysSince(b.date)||0;
    out.push({sev:d>3||b.severity==="Critical"?"crit":"warn",kind:"Off the road",
      unit:b.vehicle,what:b.problem,since:b.date,ago:d,go:"down"});
  });

  /* renewal: due if the unit's month has arrived and no LTO Renewal line was
     posted for it this year */
  var renewed={};
  allLines().forEach(function(r){
    if(!r.veh||!/LTO Renewal/i.test(r.cat||"")) return;
    var d=parseDate(r.date); if(d&&d.getFullYear()===yr) renewed[r.veh]=iso(d);
  });
  S.vehicles.forEach(function(v){
    if(v.status==="SOLD"||v.status==="Personal") return;
    var m=MONTHS.indexOf((v.regMonth||"").trim());
    if(m<0||renewed[v.code]) return;
    if(m<mi) out.push({sev:"crit",kind:"Registration overdue",unit:v.code,
      what:"Renewal month was "+MONTHS[m]+" — no LTO renewal posted this year",
      since:MONTHS[m]+" "+yr,ago:null,go:"fleet"});
    else if(m===mi) out.push({sev:"warn",kind:"Registration due",unit:v.code,
      what:"Renewal month is "+MONTHS[m],since:MONTHS[m]+" "+yr,ago:null,go:"fleet"});
  });

  /* service intervals now key on the JOB, not on spotting an oil line */
  S.vehicles.forEach(function(v){
    if(v.status==="SOLD"||v.status==="Personal") return;
    jobsForUnit(v.code).forEach(function(j){
      if(!j.due) return;
      out.push({sev:"warn",kind:j.name+" due",unit:v.code,
        what:"Last done "+j.ago+" days ago on VRF "+j.vrf+", interval is "+j.intervalMo+" months"+
          (j.confirmed?"":" (work type inferred)"),
        since:j.last,ago:j.ago,go:"parts"});
    });
  });

  forecast().forEach(function(r){
    if(r.status!=="overdue") return;
    out.push({sev:"warn",kind:"Part overdue",unit:r.veh,
      what:r.cat+" — "+r.lifeMo+" month lifespan, last bought "+r.ago+" days ago",
      since:r.last,ago:r.ago,go:"parts"});
  });

  if(f.onHand<REORDER_L) out.push({sev:f.onHand<CRITICAL_L?"crit":"warn",
    kind:"Fuel reserve low",unit:"—",
    what:nnum(f.onHand,0)+" L on hand, below the "+
      (f.onHand<CRITICAL_L?CRITICAL_L:REORDER_L)+" L threshold",since:"",ago:null,go:"fuel"});

  adminJOs().forEach(function(t){
    if(t.status==="Closed"||!t.due) return;
    var d=daysSince(t.due);
    if(d==null||d<0) return;
    out.push({sev:d>0?"crit":"warn",kind:d>0?"Follow-up overdue":"Follow-up due today",
      unit:t.vehicle||"—",what:"JO-"+t.no+" — "+(t.rootCause||t.action),
      since:t.due,ago:d,go:"down"});
  });

  expiringPapers(45).forEach(function(e){
    var d=e.meta, st=e.st;
    out.push({sev: st.days<0?"crit":"warn",
      kind: st.days<0?"Paper expired":"Paper about to expire",
      unit:d.code,
      what:d.docType+(d.docNo?" "+d.docNo:"")+" — "+st.label,
      since:d.expires, ago:st.days<0?-st.days:null, go:"fleet"});
  });

  openVrfs().forEach(function(v){
    var d=daysSince(v.date);
    var ev=vrfEvidence(v);
    out.push({sev:(d!=null&&d>3)?"crit":"warn",kind:"VRF awaiting liquidation",
      unit:v.units.join(", ")||"—",
      what:"VRF "+v.vrf+" — "+peso(v.total)+" posted"+(v.reserve?" against RSV-"+v.reserve:"")+
        (ev.need&&!ev.ok?", no proof attached yet":""),
      since:v.date,ago:d,go:"parts"});
  });

  openReserves().forEach(function(r){
    var d=daysSince(r.date);
    var rd=rsvReadyToApprove(r);
    if(!rd.ok){
      out.push({sev:"crit",kind:"Fuel request cannot be approved",unit:r.veh,
        what:"RSV-"+r.no+" — "+rd.missing.join(" and ")+". It will sit there until the yard adds it.",
        since:r.date,ago:d,go:"rsv"});
      return;
    }
    out.push({sev:(d!=null&&d>2)?"crit":"warn",kind:"Reserve waiting for approval",unit:r.veh,
      what:"RSV-"+r.no+" — "+(r.work?workName(r.work):"job")+" for "+peso(r.budget)+
        ", raised by "+(r.requestedBy||"—"),
      since:r.date,ago:d,go:"rsv"});
  });
  flaggedReserves().forEach(function(r){
    var rv=reserveVariance(r);
    out.push({sev:"crit",kind:"Reserve over budget",unit:r.veh,
      what:"RSV-"+r.no+" came in "+peso(rv.diff)+" ("+(rv.pct*100).toFixed(1)+"%) over"+
        (r.justification?" — explained, waiting on the office":" — no explanation written yet"),
      since:r.liquidatedAt||r.date,ago:daysSince(r.liquidatedAt||r.date),go:"rsv"});
  });
  approvedReserves().forEach(function(r){
    var d=daysSince(r.approvedAt||r.date);
    if(d==null||d<14||(r.vrfs||[]).length) return;
    out.push({sev:"warn",kind:"Approved reserve unused",unit:r.veh,
      what:"RSV-"+r.no+" was approved "+d+" days ago at "+
        peso(r.approvedBudget!=null?r.approvedBudget:r.budget)+" and nothing has been spent against it",
      since:r.approvedAt||r.date,ago:d,go:"rsv"});
  });

  openJOs().forEach(function(j){
    var d=daysSince(j.raised);
    if(j.status==="For verification"){
      out.push({sev:"warn",kind:"Job order awaiting sign-off",unit:j.vehicle,
        what:"JO-"+j.no+" — "+(j.resolution||j.action)+" · done by "+(j.doneBy||"—")+", needs a checker",
        since:j.doneAt||j.raised,ago:daysSince(j.doneAt||j.raised),go:"down"});
    }else if(d!=null&&d>3){
      out.push({sev:d>7?"crit":"warn",kind:"Job order still open",unit:j.vehicle,
        what:"JO-"+j.no+" — "+(j.action||"work")+" raised "+d+" days ago",
        since:j.raised,ago:d,go:"down"});
    }
  });

  var rank={crit:0,warn:1,info:2};
  return out.sort(function(a,b){ return (rank[a.sev]-rank[b.sev])||((b.ago||0)-(a.ago||0)); });
}

/* A breakdown is not a separate record any more — it is a job order raised with
   the unit off the road. One form at the moment the mechanic is standing at it.
   Legacy rows in ops/breakdowns are still read so nothing is lost. */
function openBreakdowns(){
  var fromJO=S.mechanic.filter(function(j){ return j.down && !j.downTo; })
    .map(function(j){
      return {no:j.no, date:j.downFrom||j.raised, vehicle:j.vehicle, driver:j.driver||"",
        problem:j.rootCause||j.action||"", severity:j.severity||"Major",
        location:j.location||"", reportedBy:j.reportedBy||j.mechanic||"",
        status:"Open", jo:j};
    });
  var legacy=S.breakdowns.filter(function(b){ return b.status!=="Resolved"; });
  return legacy.concat(fromJO);
}
function downCodes(){ var m={}; openBreakdowns().forEach(function(b){ m[b.vehicle]=b; }); return m; }

function regDueThisMonth(){
  var m=["January","February","March","April","May","June","July","August","September",
    "October","November","December"][new Date().getMonth()];
  return S.vehicles.filter(function(v){ return (v.regMonth||"").trim()===m && v.status!=="SOLD"; });
}

/* The alpha list's "Schedule for Change Oil" column stopped being maintained in
   2025, so every unit reads overdue against it. Oil status is taken from the
   service log instead — the data the yard actually keeps current. */
var _oil=null;
function oilMap(){
  if(_oil) return _oil;
  var m={}, spec=partSpec("Engine / Gear Oil"), life=(spec&&months(spec.lifeMo))||6;
  allLines().forEach(function(r){
    var c=normCat(r.cat);
    if(!r.veh||r.veh==="AV") return;
    if(c!=="Engine / Gear Oil"&&c!=="Oil Filter") return;
    var d=parseDate(r.date); if(!d) return;
    if(!m[r.veh]||d>m[r.veh]) m[r.veh]=d;
  });
  var out={};
  Object.keys(m).forEach(function(k){
    var ago=Math.floor((Date.now()-m[k].getTime())/DAY);
    out[k]={last:iso(m[k]),ago:ago,due:ago>=life*MO};
  });
  _oil=out; return out;
}
function lastOdo(code){
  var best=null, bd=null;
  allLines().forEach(function(r){
    if(r.veh!==code||!r.odo) return;
    var d=parseDate(r.date); if(!d) return;
    if(!bd||d>=bd){ bd=d; best=r.odo; }
  });
  return best;
}

var tipEl=$("#tip");
function showTip(evt,title,rows){
  tipEl.innerHTML='<div class="t">'+esc(title)+'</div>'+rows.map(function(r){
    return '<div class="r"><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>';}).join("");
  tipEl.style.display="block";
  var x=evt.clientX+13, y=evt.clientY+13;
  var w=tipEl.offsetWidth, h=tipEl.offsetHeight;
  if(x+w>innerWidth-8) x=evt.clientX-w-13;
  if(y+h>innerHeight-8) y=evt.clientY-h-13;
  tipEl.style.left=x+"px"; tipEl.style.top=y+"px";
}
function hideTip(){ tipEl.style.display="none"; }
document.addEventListener("scroll",hideTip,true);

function svgNS(t,attrs){
  var e=document.createElementNS("http://www.w3.org/2000/svg",t);
  for(var k in attrs) if(attrs.hasOwnProperty(k)) e.setAttribute(k,attrs[k]);
  return e;
}
function niceMax(v){
  if(v<=0) return 1;
  var mag=Math.pow(10,Math.floor(Math.log10(v))), n=v/mag;
  var step = n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;
  return step*mag;
}

/* Stacked monthly bars: fuel vs maintenance, one scale, 2px surface gap. */
function stackedMonths(keys,data){
  var W=640,H=230, pad={t:14,r:14,b:34,l:66};
  var iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  var max=niceMax(Math.max.apply(null,keys.map(function(k){return data[k].fuel+data[k].maint;}).concat([1])));
  var svg=svgNS("svg",{viewBox:"0 0 "+W+" "+H,width:"100%",height:H,role:"img",
    "aria-label":"Monthly motorpool spend, fuel and maintenance"});
  [0,.25,.5,.75,1].forEach(function(f){
    var y=pad.t+ih-ih*f;
    svg.appendChild(svgNS("line",{x1:pad.l,x2:W-pad.r,y1:y,y2:y,stroke:"var(--line)","stroke-width":1}));
    var tx=svgNS("text",{x:pad.l-8,y:y+4,"text-anchor":"end","font-size":11,fill:"var(--ink-3)"});
    tx.textContent=pesoK(max*f); svg.appendChild(tx);
  });
  var bw=Math.min(52, iw/keys.length*0.62), gap=iw/keys.length;
  keys.forEach(function(k,i){
    var d=data[k], x=pad.l+gap*i+(gap-bw)/2;
    var hf=ih*(d.fuel/max), hm=ih*(d.maint/max);
    var yM=pad.t+ih-hm, yF=yM-hf-(hm>0&&hf>0?2:0);
    if(hm>0){
      var rm=svgNS("rect",{x:x,y:yM,width:bw,height:Math.max(hm,1),fill:"var(--s2)",rx:3});
      rm.style.cursor="pointer"; svg.appendChild(rm);
      rm.addEventListener("mousemove",function(e){ showTip(e,monthLabel(k),
        [["Maintenance",peso(d.maint)],["Fuel",peso(d.fuel)],["Total",peso(d.fuel+d.maint)],
         ["VRFs",String(Object.keys(d.vrfs).length)]]); });
      rm.addEventListener("mouseleave",hideTip);
    }
    if(hf>0){
      var rf=svgNS("rect",{x:x,y:yF,width:bw,height:Math.max(hf,1),fill:"var(--s1)",rx:3});
      rf.style.cursor="pointer"; svg.appendChild(rf);
      rf.addEventListener("mousemove",function(e){ showTip(e,monthLabel(k),
        [["Fuel",peso(d.fuel)],["Maintenance",peso(d.maint)],["Total",peso(d.fuel+d.maint)],
         ["VRFs",String(Object.keys(d.vrfs).length)]]); });
      rf.addEventListener("mouseleave",hideTip);
    }
    var lab=svgNS("text",{x:x+bw/2,y:H-14,"text-anchor":"middle","font-size":11,fill:"var(--ink-2)"});
    lab.textContent=monthLabel(k).replace(" 20"," '"); svg.appendChild(lab);
    var v=svgNS("text",{x:x+bw/2,y:yF-5,"text-anchor":"middle","font-size":11,
      fill:"var(--ink-2)","font-weight":600});
    v.textContent=pesoK(d.fuel+d.maint); svg.appendChild(v);
  });
  return svg;
}

/* Fuel buy price per litre, one line, endpoint emphasised. */
function priceLine(points){
  var W=640,H=205, pad={t:16,r:52,b:32,l:52};
  var iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  var vals=points.map(function(p){return p.rate;});
  var lo=Math.floor(Math.min.apply(null,vals)/10)*10, hi=Math.ceil(Math.max.apply(null,vals)/10)*10;
  if(hi===lo) hi=lo+10;
  var svg=svgNS("svg",{viewBox:"0 0 "+W+" "+H,width:"100%",height:H,role:"img",
    "aria-label":"Diesel reserve buy price per litre over time"});
  var X=function(i){ return pad.l + (points.length<2?iw/2: iw*i/(points.length-1)); };
  var Y=function(v){ return pad.t + ih - ih*(v-lo)/(hi-lo); };
  [lo,(lo+hi)/2,hi].forEach(function(v){
    var y=Y(v);
    svg.appendChild(svgNS("line",{x1:pad.l,x2:W-pad.r,y1:y,y2:y,stroke:"var(--line)","stroke-width":1}));
    var t=svgNS("text",{x:pad.l-8,y:y+4,"text-anchor":"end","font-size":11,fill:"var(--ink-3)"});
    t.textContent="₱"+v.toFixed(0); svg.appendChild(t);
  });
  var d=points.map(function(p,i){ return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.rate).toFixed(1); }).join(" ");
  svg.appendChild(svgNS("path",{d:d,fill:"none",stroke:"var(--s3)","stroke-width":2,
    "stroke-linejoin":"round","stroke-linecap":"round"}));
  points.forEach(function(p,i){
    var isLast=i===points.length-1;
    var c=svgNS("circle",{cx:X(i),cy:Y(p.rate),r:isLast?5.5:4,fill:isLast?"var(--s3)":"var(--surface)",
      stroke:"var(--s3)","stroke-width":2});
    c.style.cursor="pointer"; svg.appendChild(c);
    c.addEventListener("mousemove",function(e){ showTip(e,p.date,
      [["Price / litre","₱ "+p.rate.toFixed(2)],["Litres",litres(p.liters)],
       ["Lot cost",peso(p.total)],["VRF",String(p.vrf||"—")]]); });
    c.addEventListener("mouseleave",hideTip);
  });
  var last=points[points.length-1], first=points[0];
  [[0,first],[points.length-1,last]].forEach(function(pr,n){
    var t=svgNS("text",{x:X(pr[0])+(n?9:-2),y:Y(pr[1].rate)-11,"font-size":11,
      "font-weight":600,fill:"var(--ink-2)","text-anchor":n?"start":"middle"});
    t.textContent="₱"+pr[1].rate.toFixed(2); svg.appendChild(t);
  });
  var lx=svgNS("text",{x:pad.l,y:H-10,"font-size":11,fill:"var(--ink-3)"});
  lx.textContent=first.date; svg.appendChild(lx);
  var rx=svgNS("text",{x:W-pad.r,y:H-10,"font-size":11,fill:"var(--ink-3)","text-anchor":"end"});
  rx.textContent=last.date; svg.appendChild(rx);
  return svg;
}

function barList(entries,total,color,fmt){
  var box=el("div");
  var max=Math.max.apply(null,entries.map(function(e){return e[1];}).concat([1]));
  entries.forEach(function(e){
    var r=el("div","bar-row");
    var l=el("div",null,e[0]); l.style.overflow="hidden"; l.style.textOverflow="ellipsis";
    l.style.whiteSpace="nowrap"; l.title=e[0];
    var tr=el("div","bar-track"), fi=el("div","bar-fill");
    fi.style.width=Math.max(2,(e[1]/max)*100)+"%"; fi.style.background=color;
    tr.appendChild(fi);
    var v=el("div","num",(fmt||pesoK)(e[1]));
    r.appendChild(l); r.appendChild(tr); r.appendChild(v);
    r.addEventListener("mousemove",function(ev){ showTip(ev,e[0],
      [["Amount",(fmt===litres?litres(e[1]):peso(e[1]))],
       ["Share",total?((e[1]/total)*100).toFixed(1)+"%":"—"]]); });
    r.addEventListener("mouseleave",hideTip);
    box.appendChild(r);
  });
  return box;
}
function legend(items){

/* A closed-work archive: the list only grows, so it is no use without a search.
   Hay(r) returns everything worth matching on for that row, lower-cased. */
function archive(title,note,rows,hay,build,opts){
  opts=opts||{};
  var c=el("div","card"), h=el("div","hd");
  h.appendChild(el("h3",null,title));
  var cnt=el("span","note",note(rows.length,rows.length));
  h.appendChild(cnt); c.appendChild(h);
  var b=el("div","bd");
  var bar=el("div","row"); bar.style.cssText="gap:var(--space-2);margin-bottom:var(--space-3)";
  var q=el("input"); q.placeholder=opts.placeholder||"search…"; q.style.flex="1";
  bar.appendChild(q);
  var sel=null;
  if(opts.filters&&opts.filters.length){
    sel=el("select");
    opts.filters.forEach(function(o){ sel.appendChild(new Option(o[1],o[0])); });
    sel.style.maxWidth="220px";
    bar.appendChild(sel);
  }
  b.appendChild(bar);
  var host=el("div"); b.appendChild(host);
  function draw(){
    var t=String(q.value||"").trim().toLowerCase();
    var words=t?t.split(/\s+/):[];
    var fv=sel?sel.value:"";
    var list=rows.filter(function(r){
      if(fv&&opts.filterBy&&opts.filterBy(r)!==fv) return false;
      if(!words.length) return true;
      var s=hay(r);
      return words.every(function(wd){ return s.indexOf(wd)>=0; });
    });
    cnt.textContent=note(list.length,rows.length);
    host.innerHTML="";
    host.appendChild(build(list));
  }
  q.addEventListener("input",draw);
  if(sel) sel.addEventListener("change",draw);
  draw();
  c.appendChild(b); return c;
}
function table(cols,rows,opts){
  opts=opts||{};
  var wrap=el("div","scroll"), t=el("table"), th=el("thead"), tr=el("tr");
  cols.forEach(function(c){
    var h=el("th",null,c.h);
    if(c.num) h.style.textAlign="right";
    tr.appendChild(h);
  });
  th.appendChild(tr); t.appendChild(th);
  var tb=el("tbody");
  if(!rows.length){
    var er=el("tr"), ed=el("td",null,opts.empty||"Nothing here yet.");
    ed.colSpan=cols.length; ed.className="empty"; er.appendChild(ed); tb.appendChild(er);
  }
  rows.forEach(function(r){
    var x=el("tr");
    cols.forEach(function(c){
      var d=el("td",c.num?"num":null);
      var v=c.get(r);
      if(v instanceof Node) d.appendChild(v); else d.textContent=(v==null?"—":v);
      x.appendChild(d);
    });
    if(opts.onRow) { x.style.cursor="pointer"; x.addEventListener("click",function(){opts.onRow(r);}); }
    tb.appendChild(x);
  });
  t.appendChild(tb); wrap.appendChild(t); return wrap;
}
function card(title,note,body){
  var c=el("div","card"), h=el("div","hd");
  h.appendChild(el("h3",null,title));
  if(note) h.appendChild(el("span","note",note));
  c.appendChild(h);
  var b=el("div","bd"+(body&&body.nodeName==="DIV"&&body.className==="scroll"?" flush":""));
  if(body) b.appendChild(body);
  c.appendChild(b); return c;
}

function buildNav(){

function go(v){ S.view=v; S.sel=null; hideTip(); render(); window.scrollTo(0,0); }

/* ---------------------------------------------------------------
   Going back.
   A screen is reached from a dozen places — a row in the fleet list,
   a chip on the yard board, a job order opened out of a reserve — so
   rather than teach every one of them to remember where it came from,
   render() watches the location itself. Anything that changes where
   you are is a step, and the step you were standing on is kept.
--------------------------------------------------------------- */
var VIEW_NAMES={yard:"the yard board",ask:"Ask the log",remind:"Reminders",
  rsv:"Reserves",vrf:"the VRF form",fuel:"Fuel reserve",down:"Workshop",
  tasks:"Tasks",store:"Store",vrflog:"the VRF log",parts:"History",fleet:"Fleet",
  approve:"Approvals",spend:"Spend",fuelecon:"Fuel economics",consume:"Consumption",
  inv:"Inventory",plan:"Maintenance plan",health:"Data health"};
var _loc=null;
function locKey(s){
  return [s.view,s.sel||"",s.lens||"",s.selUnit||"",s.selWork||"",s.selCat||""].join("|");
}
function locNow(){
  return {view:S.view,sel:S.sel,lens:S.lens,selUnit:S.selUnit,
    selWork:S.selWork,selCat:S.selCat,y:0};
}
function locName(s){
  if(!s) return "back";
  if(s.view==="fleet"&&s.sel) return s.sel;
  return VIEW_NAMES[s.view]||"where you were";
}
function navTrack(){
  var now=locNow();
  if(_loc && locKey(_loc)!==locKey(now)){
    try{ _loc.y=window.scrollY||0; }catch(e){ _loc.y=0; }
    S.hist.push(_loc);
    if(S.hist.length>40) S.hist.shift();
  }
  _loc=now;
  var b=$("#backBtn");
  if(b){
    var prev=S.hist[S.hist.length-1];
    b.hidden=!prev;
    if(prev) b.textContent="← Back to "+locName(prev);
  }
}
function goBack(){
  var prev=S.hist.pop();
  if(!prev) return;
  _loc=null;                     /* the screen being left is not a new step */
  S.view=prev.view; S.sel=prev.sel; S.lens=prev.lens; S.selUnit=prev.selUnit;
  S.selWork=prev.selWork; S.selCat=prev.selCat;
  hideTip(); render();
  try{ window.scrollTo(0,prev.y||0); }catch(e){}
}

/* ============================ views ============================ */
function render(){
  _oil=null; _cons=null; _inv=null; _itemIdx=null;

     lines on the main thread on every render() is what locked the tab

  buildNav(); navTrack();
  var isOffice = OFFICE.some(function(o){return o.id===S.view;});
  $("#zoneTag").textContent = isOffice ? "Office — figures" : "Yard — staff";

  var fn={yard:yardView,ask:askView,remind:remindView,rsv:rsvView,approve:approveView,vrf:vrfView,fuel:fuelView,down:downView,

    spend:spendView,fuelecon:fuelEconView,consume:consumeView,plan:planView,health:healthView}[S.view]||yardView;

}

function gateView(){

    : "No passcode is set yet. Set one now — whoever needs the figures will use it.");
  p.style.color="var(--ink-2)"; b.appendChild(p);

  f.appendChild(el("label",null,S.cfg.pass?"Passcode":"Choose a passcode"));
  var i=el("input"); i.type="password"; i.autocomplete="off"; f.appendChild(i);
  b.appendChild(f);
  var err=el("div","hint"); err.style.color="var(--crit)"; err.style.marginTop="6px"; b.appendChild(err);
  var btn=el("button","btn pri",S.cfg.pass?"Unlock":"Set passcode");
  btn.style.marginTop="14px";
  btn.addEventListener("click",async function(){
    var val=i.value.trim();
    if(!val){ err.textContent="Type a passcode first."; return; }
    if(S.cfg.pass){
      if(hash(val)===S.cfg.pass){ S.office=true; render(); }
      else err.textContent="That passcode does not match. Try again.";
    }else{
      if(val.length<4){ err.textContent="Use at least 4 characters."; return; }
      S.cfg.pass=hash(val);
      await writeDoc(PATHS.cfg,{nextVrf:S.cfg.nextVrf,pass:S.cfg.pass,fuel:S.cfg.fuel||null,
        varianceTol:S.cfg.varianceTol,nextReserve:S.cfg.nextReserve, driveFolder:S.cfg.driveFolder||""});
      S.office=true; toast("Passcode set."); render();
    }
  });
  i.addEventListener("keydown",function(e){ if(e.key==="Enter") btn.click(); });
  b.appendChild(btn);
  var n=el("p","hint","This keeps the numbers off the yard screens. It is not a security boundary — anyone you share the artifact link with can open the page, so share the link itself deliberately.");
  n.style.marginTop="16px"; b.appendChild(n);
  c.appendChild(b); w.appendChild(c);
  setTimeout(function(){ i.focus(); },30);
  return w;
}
function hash(s){ var h=5381,i; for(i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0; return "h"+h.toString(36); }

        return r.status==="Requested"||r.status==="Approved"||r.status==="Flagged"; }).length),

    ["Job orders open", String(openJOs().length),

        return n?n+" awaiting sign-off":"none awaiting sign-off"; })(), true],

  if(f.onHand<REORDER_L){

        {h:"Problem",get:function(r){ return r.problem; }},
        {h:"Severity",get:function(r){ var s=el("span","chip "+(r.severity==="Critical"?"crit":r.severity==="Major"?"warn":"mute"),r.severity||"—"); return s; }},
        {h:"Reported",get:function(r){ return r.date+(r.reportedBy?" · "+r.reportedBy:""); }},
        {h:"Down",num:true,get:function(r){ var d=daysSince(r.date); return d==null?"—":d+"d"; }}
      ], ob, {empty:"Everything is running."})));

  /* fleet tiles, grouped by class prefix so the yard reads it the way it is parked */

    TM:"Transit mixers",BH:"Excavators",RR:"Rollers",MBC:"Mobile crane",MC:"Motorcycles",Equipment:"Site equipment"};
  Object.keys(groups).forEach(function(pre){
    var list=S.vehicles.filter(function(v){
      if(pre==="Equipment") return /^Equipment/.test(v.code);
      if(pre==="MC") return /^MC-/.test(v.code);

    if(!list.length) return;
    var box=el("div","units");

/* ---- ask the log ---- */
/* The assistant answers from the same data the screens draw on, through tools —
   nothing is pasted into the prompt, so it cannot answer from a stale snapshot.
   Every tool here is deliberately money-free: peso figures live in the Office zone. */
function askTools(){
  function findCat(q){
    if(!q) return null;
    var all={};
    S.parts.forEach(function(p){ all[normCat(p.cat)]=1; });
    allLines().forEach(function(r){ var c=normCat(r.cat); if(c) all[c]=1; });
    var keys=Object.keys(all), t=q.trim().toLowerCase();
    for(var i=0;i<keys.length;i++) if(keys[i].toLowerCase()===t) return keys[i];
    var hits=keys.filter(function(k){ return k.toLowerCase().indexOf(t)>=0; });
    if(hits.length) return hits.sort(function(a,b){return a.length-b.length;})[0];
    hits=keys.filter(function(k){ return t.indexOf(k.toLowerCase())>=0; });
    return hits.length?hits[0]:null;
  }
  /* People name units the way they talk — "fj cruiser", "the red fuego", "sv18",
     a plate. The record says "TOYOTA LAND CRUISER FJ150", so match every word in
     any order, and treat a code or plate typed without its dash or space as exact. */
  function unitHay(v){
    return (v.code+" "+(v.desc||"")+" "+(v.plate||"")+" "+(v.make||"")+" "+(v.model||"")+" "+
      (v.color||"")+" "+(v.site||"")+" "+(v.owner||"")).toLowerCase();
  }
  function squash(s){ return String(s||"").toLowerCase().replace(/[\s\-_.]/g,""); }
  function unitMatches(q){
    var t=String(q||"").trim().toLowerCase(); if(!t) return [];
    var tq=squash(t);
    var exact=S.vehicles.filter(function(v){ return squash(v.code)===tq || (v.plate&&squash(v.plate)===tq); });
    if(exact.length) return exact;
    var words=t.split(/[\s,]+/).filter(function(w){ return w&&["the","ang","na","sa","ng","unit"].indexOf(w)<0; });
    if(!words.length) return [];
    return S.vehicles.filter(function(v){ var h=unitHay(v);
        return words.every(function(w){ return h.indexOf(w)>=0; }); })
      .sort(function(a,b){ return (a.status==="SOLD")-(b.status==="SOLD"); });
  }
  function findUnit(q){ var m=unitMatches(q); return m.length?m[0].code:null; }
  function fleetRows(list){
    return list.map(function(v){ return {code:v.code, description:v.desc, plate:v.plate||"",
      status:v.status||"Active", renewal_month:v.regMonth||"", site:v.site||""}; });
  }
  /* Nine lookups, most-asked first. A question can only offer the assistant a
     limited number of tools, and anything past that limit is simply not there —
     which is how "what do I register this month" came back unanswerable. */
  return [
  {name:"whats_due",
   description:"Exactly what the Reminders tab shows, fleet-wide: registration due or overdue, any service interval due (change oil, battery, greasing …), parts past their lifespan, papers expiring, units off the road, follow-ups due, fuel reserve low. 'Check the reminders tab' means call this. Optional filter.",
   inputSchema:{type:"object",properties:{
     filter:{type:"string",description:"optional word to narrow it, e.g. registration, change oil, battery, paper, fuel, SV-05"}}},
   execute:function(a){
     var k=String(a&&a.filter||"").trim().toLowerCase();
     var list=reminders().filter(function(r){
       return !k || (r.kind+" "+r.what+" "+r.unit).toLowerCase().indexOf(k)>=0; });
     return {as_of:iso(), count:list.length, shown:Math.min(list.length,80),
       items:list.slice(0,80).map(function(r){ return {kind:r.kind,
         severity:r.sev==="crit"?"urgent":(r.sev==="warn"?"due":"info"),
         unit:r.unit, detail:String(r.what||"").replace(/₱\s?[\d,]+(\.\d+)?/g,"(amount in Office)"),
         since:r.since||""}; })};
   }},
  {name:"registration_due",
   description:"Units due for LTO registration renewal in a month (default this month), whether each was already renewed this year, units overdue from earlier months, OR or insurance papers expiring that month, and units with no renewal month on file.",
   inputSchema:{type:"object",properties:{
     month:{type:"string",description:"month name or number; omit for the current month"}}},
   execute:function(a){
     var now=new Date(), yr=now.getFullYear();
     var mi=now.getMonth(), q=String(a&&a.month||"").trim().toLowerCase();
     if(q){
       var byName=MONTHS.findIndex(function(m){ return m.toLowerCase().indexOf(q.slice(0,3))===0; });
       var num=parseInt(q,10);
       if(byName>=0) mi=byName; else if(num>=1&&num<=12) mi=num-1;
       else return {error:"Could not read '"+a.month+"' as a month."};
     }
     var renewed={};
     allLines().forEach(function(r){
       if(!r.veh||!/LTO Renewal/i.test(r.cat||"")) return;
       var d=parseDate(r.date); if(d&&d.getFullYear()===yr) renewed[r.veh]={date:iso(d),vrf:r.vrf};
     });
     var live=S.vehicles.filter(function(v){ return v.status!=="SOLD"&&v.status!=="Personal"; });
     var due=live.filter(function(v){ return MONTHS.indexOf((v.regMonth||"").trim())===mi; })
       .map(function(v){ var rn=renewed[v.code];
         return {code:v.code, description:v.desc, plate:v.plate||"",
           renewed_this_year: rn?("yes, "+rn.date+" on VRF "+rn.vrf):"no"}; });
     var overdue = mi===now.getMonth() ? live.filter(function(v){
         var m=MONTHS.indexOf((v.regMonth||"").trim());
         return m>=0 && m<mi && !renewed[v.code]; })
       .map(function(v){ return {code:v.code, description:v.desc, plate:v.plate||"",
         renewal_month:v.regMonth}; }) : [];
     var papers=(S.papers||[]).filter(function(d){
       if(!d.expires) return false;
       var e=parseDate(d.expires);
       return e && e.getMonth()===mi && e.getFullYear()===yr &&
         /Official Receipt|Insurance|Registration/i.test(d.docType||""); })
       .map(function(d){ return {code:d.code, document:d.docType, expires:d.expires}; });
     var noMonth=live.filter(function(v){ return MONTHS.indexOf((v.regMonth||"").trim())<0; })
       .map(function(v){ return v.code; });
     return {month:MONTHS[mi]+" "+yr, due_this_month:due,
       still_to_renew:due.filter(function(x){ return x.renewed_this_year==="no"; }).length,
       overdue_from_earlier_months:overdue, papers_expiring_this_month:papers,
       units_with_no_renewal_month_on_file:noMonth.length, those_units:noMonth,
       note:"Renewal month comes from the fleet list. A renewal counts as done when an LTO Renewal line was posted for the unit this calendar year."};
   }},
  {name:"fleet",
   description:"List or search the fleet: code, description, plate, status, renewal month, site. Omit the query for every unit. Use this instead of ever asking the user for unit codes.",
   inputSchema:{type:"object",properties:{
     query:{type:"string",description:"optional: code, name, make, plate or site"},
     status:{type:"string",description:"optional: Active, SOLD, Personal or For disposal"}}},
   execute:function(a){
     var t=String(a&&a.query||"").trim().toLowerCase(), st=String(a&&a.status||"").trim().toLowerCase();
     var pool=t?unitMatches(t):S.vehicles;
     var list=pool.filter(function(v){
       return !st || String(v.status||"Active").toLowerCase()===st; });
     return {count:list.length, units:fleetRows(list)};
   }},
  {name:"unit_record",
   description:"Everything on one unit: make, plate, owner, renewal month, CR and OR numbers, status, site, last odometer, open breakdowns, job orders, and the date each type of job was last done.",
   inputSchema:{type:"object",properties:{unit:{type:"string",description:"unit code, name or plate"}},required:["unit"]},
   execute:function(a){
     var u=findUnit(String(a&&a.unit||"")); if(!u) return {error:"No unit matches '"+(a&&a.unit)+"'. Call fleet to search."};
     var v=vehicle(u);
     var others=unitMatches(String(a&&a.unit||"")).map(function(x){ return x.code; })
       .filter(function(c){ return c!==u; }).slice(0,6);
     return {code:u, other_units_that_also_match:others, description:v.desc, make:v.make, model:v.model, year:v.year,
       plate:v.plate, fuel:v.fuel, registered_owner:v.owner||null, cr:v.cr||null, or:v.orno||null,
       renewal_month:v.regMonth||null, status:v.status||"Active", site:v.site||null,
       last_odometer:lastOdo(u),
       open_breakdowns:openBreakdowns().filter(function(b){return b.vehicle===u;}),
       job_orders:mechFor(u).map(function(j){ return {no:j.no, raised:j.raised, work:j.action,
         status:j.status, scope:j.rootCause, resolution:j.resolution,
         proofs:(j.proofs||[]).length}; }),
       jobs_last_done:jobsForUnit(u).slice(0,25).map(function(j){ return {job:j.name,
         last_done:j.last, days_ago:j.ago, interval_months:j.intervalMo, due:j.due,
         source:j.confirmed?"entered":"inferred"}; })};
   }},
  {name:"job_history",
   description:"When a type of job was carried out on a unit — change oil, battery replacement, tire change, registration renewal — every time, newest first. Use for 'when did we last change the battery on DT-03'.",
   inputSchema:{type:"object",properties:{
     unit:{type:"string",description:"unit code, e.g. DT-03"},
     work_type:{type:"string",description:"job name or code, e.g. Battery replacement or BATT"}},
     required:["unit","work_type"]},
   execute:function(a){
     var u=findUnit(String(a&&a.unit||""));
     if(!u) return {error:"No unit matches '"+(a&&a.unit)+"'. Call fleet to search."};
     var t=String(a&&a.work_type||"").trim().toLowerCase(), code=null;
     for(var i=0;i<S.worktypes.length;i++){
       var w=S.worktypes[i];
       if(w.code.toLowerCase()===t||w.name.toLowerCase()===t){ code=w.code; break; }
     }
     if(!code) for(var j=0;j<S.worktypes.length;j++){
       if(S.worktypes[j].name.toLowerCase().indexOf(t)>=0){ code=S.worktypes[j].code; break; }
     }
     if(!code) return {error:"No type of job matches '"+a.work_type+"'. Call names for the list."};
     var hits=jobHistory(u,code), wt=workBy(code);
     return {unit:u, matched_job:wt.name, interval_months:wt.intervalMo, times:hits.length,
       last_done: hits.length?hits[0].date:null,
       days_since: hits.length?daysSince(hits[0].date):null,
       work_type_source: hits.length?(hits[0].confirmed?"entered by the yard":"inferred by the portal from the materials"):null,
       occurrences: hits.slice(0,20).map(function(v){ return {date:v.date, vrf:v.vrf,
         bought:v.rows.map(function(x){return x.item||normCat(x.cat);}).filter(Boolean).slice(0,8),
         confirmed:v.confirmed}; }),
       coverage:"Months loaded: "+Object.keys(S.ledger).sort().join(", ")};
   }},
  {name:"part_history",
   description:"What was BOUGHT. Unit and category: every purchase of that part for that unit. Unit only: every category fitted to it. Category only: every unit that has had it. For what was DONE, use job_history.",
   inputSchema:{type:"object",properties:{
     unit:{type:"string",description:"optional unit code"},
     category:{type:"string",description:"optional part category, e.g. Battery (new)"}}},
   execute:function(a){
     var hasU=!!String(a&&a.unit||"").trim(), hasC=!!String(a&&a.category||"").trim();
     var u=hasU?findUnit(String(a.unit)):null, c=hasC?findCat(String(a.category)):null;
