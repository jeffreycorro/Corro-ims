# CorConDev Finance artifact — deploy as a SEPARATE Netlify site.
# Base directory: finance-artifact
# Proposed site name: corcondev-finance
# Do not point the public company portal at this folder.

[build]
  command = "node -e \"console.log('static Finance artifact — no SPA build')\""
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.dv-pdf]
  timeout = 26

[functions.files]
  timeout = 26

[functions.sheet-import]
  timeout = 26

# Skip PR / branch preview deploys from this config when Netlify honors ignore.
# Also turn Deploy Previews off in the Netlify UI (required):
# Project configuration → Build & deploy → Continuous Deployment →
# Branches and deploy contexts → Disable Deploy Previews.

[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-store"
