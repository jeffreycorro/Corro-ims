<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#102033">
  <title>CorConDev Finance</title>
  <script src="/claude-shim.js"></script>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/pwa.css">
  <script src="/pwa.js"></script>
  <style>
    :root {
      --navy: #102033;
      --navy-2: #1b3048;
      --paper: #f3efe6;
      --card: #fffdf8;
      --ink: #1c1915;
      --muted: #5e584f;
      --line: #e2d9cc;
      --amber: #b86a1b;
      --ok: #1f6b45;
      --warn: #8a5a12;
      --bad: #8d2d2d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
    button, input, select, textarea { font: inherit; }
    .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
    .rail { background: var(--navy); color: #f4f1ea; padding: 18px 12px 28px; }
    .brand { padding: 4px 10px 16px; }
    .brand b { display: block; font-size: 15px; letter-spacing: 0.04em; }
    .brand span { color: #d7c4a4; font-size: 12px; }
    .nav-i { display: block; width: 100%; text-align: left; background: transparent; color: #f4f1ea; border: 0; border-radius: 8px; padding: 9px 10px; margin: 2px 0; cursor: pointer; }
    .nav-i.on { background: var(--navy-2); }
    .nav-i.locked { color: #d7c4a4; }
    .main { padding: 18px 22px 48px; min-width: 0; }
    header.top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 14px; }
    h1 { font-size: 26px; margin: 0; font-weight: 650; }
    .sub { color: var(--muted); margin: 4px 0 0; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .card h2 { margin: 0 0 8px; font-size: 16px; }
    .metric { font-size: 22px; font-weight: 700; }
    .metric small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; color: var(--muted); font-weight: 650; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 12px; }
    .btn { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-height: 40px; cursor: pointer; }
    .btn.pri { background: var(--amber); border-color: var(--amber); color: white; font-weight: 650; }
    .btn.sm { min-height: 32px; padding: 4px 8px; }
    .pill { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 12px; background: #efe8dc; }
    .pill.warn { background: #f3e2c2; color: var(--warn); }
    .pill.ok { background: #dceee4; color: var(--ok); }
    .pill.bad { background: #f4dcdc; color: var(--bad); }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: white; }
    textarea { min-height: 72px; }
    .span2 { grid-column: span 2; }
    .modal { position: fixed; inset: 0; background: rgba(16, 32, 51, 0.45); display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px; overflow: auto; z-index: 20; }
    .sheet { width: min(760px, 100%); background: var(--card); border-radius: 14px; padding: 18px; }
    .err { color: var(--bad); min-height: 1.2em; }
    .soon { color: var(--amber); font-weight: 700; letter-spacing: 0.04em; }
    #buildBanner { background: #3d2a12; color: #fff8ee; padding: 10px 16px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    #buildBanner[hidden] { display: none !important; }
    .pad { width: 100%; height: 120px; background: white; border: 1px dashed var(--line); border-radius: 8px; touch-action: none; }
    .scroll { overflow: auto; }
    .foot { margin-top: 22px; color: var(--muted); font-size: 12px; }
    .chk-banner { background: var(--navy); color: #f4f1ea; border-radius: 14px 14px 0 0; padding: 18px 16px 16px; }
    .chk-banner .co { color: #d7c4a4; font-size: 13px; }
    .chk-banner .big { font-size: clamp(28px, 8vw, 42px); font-weight: 750; letter-spacing: -0.03em; line-height: 1.1; margin: 4px 0; }
    .chk-subbar { background: var(--navy-2); color: #f4f1ea; border-radius: 0 0 14px 14px; margin: 0 0 16px; padding: 10px 16px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .chk-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .chk-filters label { flex: 1; min-width: 120px; }
    .chk select, .chk .btn, .chk-month, .chk-row { min-height: 44px; }
    .chk-chart { overflow-x: auto; -webkit-overflow-scrolling: touch; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
    .chk-chart svg { width: 100%; min-width: 640px; height: auto; display: block; }
    .chk-total { margin: 8px 0; }
    .chk-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; }
    .chk-chip { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 112px; }
    .chk-chip b { display: block; font-size: 15px; }
    .chk-chip span { color: var(--muted); font-size: 11px; }
    .chk-days { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
    .chk-day { min-width: 240px; max-width: 300px; scroll-snap-align: start; flex: 0 0 auto; }
    .chk-day header { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
    .chk-day.today { outline: 2px solid var(--amber); }
    .chk-row { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 8px 0; cursor: pointer; }
    .chk-row .who { flex: 1; min-width: 0; }
    .chk-row .amt, .chk-day .amt { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bank-badge { color: white; border-radius: 6px; padding: 3px 6px; font-size: 11px; font-weight: 700; min-width: 44px; text-align: center; flex: 0 0 auto; }
    .chk-month { display: grid; grid-template-columns: 1fr auto auto; gap: 8px 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; cursor: pointer; }
    .chk-bar-track { grid-column: 1 / -1; height: 8px; background: #efe8dc; border-radius: 99px; overflow: hidden; }
    .chk-bar-fill { display: block; height: 100%; background: var(--navy); }
    .chk-break { padding: 4px 8px 8px 12px; }
    .chk-detail { border: 2px solid var(--navy); margin-bottom: 16px; }
    .chk-photo { display: block; max-width: 100%; max-height: 280px; margin-top: 8px; border-radius: 8px; }
    .chk-issue { margin-top: 16px; }
    .chk-issue summary { cursor: pointer; font-weight: 650; min-height: 44px; display: flex; align-items: center; }
    .chk-foot { margin-top: 18px; }
    .chk-audit { padding-left: 18px; }
    .chk-legend { margin-top: 8px; }
    .bills.dark { --paper: #12161c; --card: #1c2430; --ink: #f4f1ea; --muted: #c4bbae; --line: #314056; background: #12161c; color: #f4f1ea; border-radius: 14px; padding: 12px; }
    .bills.dark .card, .bills.dark .chk-chart { background: #1c2430; color: #f4f1ea; }
    .bills.dark input, .bills.dark select, .bills.dark .btn { background: #12161c; color: #f4f1ea; border-color: #314056; }
    .bills.dark .btn.pri { background: var(--amber); color: white; }
    .bill-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .bill-read { margin-top: 8px; }
    .bill-bar { margin: 8px 0 12px; }
    .bill-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .bill-detail { margin: 12px 0; border: 2px solid var(--navy); }
    @media (max-width: 800px) { .bill-kpis { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .rail { display: flex; gap: 6px; overflow: auto; padding: 10px; }
      .brand { display: none; }
      .nav-i { width: auto; white-space: nowrap; }
      .grid, .fields { grid-template-columns: 1fr; }
      .span2 { grid-column: auto; }
    }
    @media print {
      .rail, .row, #buildBanner, .no-print { display: none !important; }
      .app { display: block; }
      body { background: white; }
      .card { border: 0; }
    }
  </style>
</head>
<body>
  <div id="buildBanner" hidden>
    <span>A newer Finance page is published (<b id="buildLatest"></b>). This page is <b id="buildMine"></b>.</span>
    <button class="btn" type="button" id="reloadBuild">Reload</button>
  </div>
  <div class="app">
    <aside class="rail">
      <div class="brand"><b>CorConDev</b><span>Finance · Cebu</span></div>
      <nav id="nav"></nav>
    </aside>
    <main class="main">
      <header class="top">
        <div>
          <h1 id="title">Finance</h1>
          <p class="sub" id="crumb"></p>
        </div>
        <div class="sub" id="who"></div>
      </header>
      <div id="view"></div>
      <p class="foot">BUILD <span id="buildLabel"></span> · Asia/Manila · amounts in Philippine pesos</p>
    </main>
  </div>
  <div id="modalHost"></div>
  <script>
    const BUILD = "2026-10-10 d";
    try { window.BUILD = BUILD; } catch (e) {}
  </script>
  <script src="/finance-app.js"></script>
  <script src="/finance-checks.js"></script>
  <script src="/finance-bills.js"></script>
  <script src="/finance-sheets.js"></script>
</body>
</html>
